<style>
:root{--bg:#f2f7f6;--c:#fff;--tx:#0f2a2a;--mu:#5a6f6e;--bd:#d5e3e1;--ac:#0f8f7e;--hd:#0a3b4c;--soft:#e2f3f0;--bad:#d64565;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1a1c;--c:#142629;--tx:#e8f4f2;--mu:#9bb5b2;--bd:#25403f;--ac:#3cc4b0;--hd:#0a2a36;--soft:#1b3a38;--bad:#ff7a97;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1a1c;--c:#142629;--tx:#e8f4f2;--mu:#9bb5b2;--bd:#25403f;--ac:#3cc4b0;--hd:#0a2a36;--soft:#1b3a38;--bad:#ff7a97;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--hd);color:#fff;padding:10px 16px;border-bottom:3px solid var(--ac)}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}header b{font-size:19px}.fb{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:10px;padding:6px 10px;font-size:12px;flex:none}html.nofuri rt{display:none}.q,.opt{line-height:2.1}details.g{background:var(--c);border:1px solid var(--bd);border-radius:14px;margin-bottom:10px}details.g>summary{cursor:pointer;padding:12px 14px;list-style:none;display:flex;align-items:center;gap:8px;font-weight:700;color:var(--ac)}details.g>summary::-webkit-details-marker{display:none}details.g>summary::before{content:"▸"}details.g[open]>summary::before{content:"▾"}details.g>summary small{margin-left:auto;color:var(--mu);font-weight:400;flex:none}details.g>div{padding:0 10px 4px}header small{display:block;font-size:11px;opacity:.85}
main{max-width:720px;margin:0 auto;padding:14px 14px 96px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--c);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav a{flex:1;text-align:center;padding:8px 2px;color:var(--mu);text-decoration:none;font-size:11px}
nav a span{display:block;font-size:19px;line-height:1.2}
nav a.on{color:var(--ac);font-weight:700}
input,select{width:100%;padding:11px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--c);color:var(--tx);font-size:16px;margin-bottom:10px}
.card{background:var(--c);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:11px 16px;font-size:15px;font-weight:600;width:100%}
.btn.alt{background:var(--c);color:var(--tx);border:1px solid var(--bd)}
.btn.bad{background:var(--bad)}
.flex{display:flex;gap:8px;flex-wrap:wrap}.flex>*{flex:1}
.mu{color:var(--mu);font-size:14px}
h2{font-size:19px;margin:6px 0 10px}
rt{font-size:.5em}
.t{display:flex;align-items:center;gap:10px;background:var(--c);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.t .w{font-size:22px;min-width:96px}.t .m{flex:1;font-size:14px}.t small{color:var(--mu);display:block}
.chk{flex:none;width:38px;height:38px;border-radius:50%;border:2px solid var(--bd);background:var(--c);color:var(--mu);font-size:18px}
.chk.on{background:var(--ac);border-color:var(--ac);color:#fff}
.fc{background:var(--c);border:2px solid var(--bd);border-radius:22px;min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;margin:10px 0}
.fc .big{font-size:44px;line-height:1.3}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0 14px}.bar i{display:block;height:100%;background:var(--ac)}
.q{font-size:19px;line-height:1.8;margin:8px 0 12px}
.opt{display:block;width:100%;text-align:left;background:var(--c);border:2px solid var(--bd);color:var(--tx);border-radius:14px;padding:12px 14px;margin:8px 0;font-size:16px}
.opt.right{border-color:var(--ac);background:var(--soft)}.opt.bad{border-color:var(--bad)}
.seg{display:flex;gap:6px;margin-bottom:10px}.seg button{flex:1;padding:9px 4px;border:1px solid var(--bd);background:var(--c);color:var(--tx);border-radius:10px;font-size:14px}
.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
:root{--bg:#f4f7fe;--c:#fff;--tx:#10204a;--mu:#5d6b8f;--bd:#dbe3f5;--ac:#0b3a9e;--onac:#fff;--pk:#f2457a;--soft:#e8efff;--gold:#fff1c9;--hd:#0a2d7a;--bad:#e0386b;--ok:#1fae84;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1330;--c:#131f45;--tx:#eaf0ff;--mu:#a2b0d8;--bd:#26356b;--ac:#82b1ff;--onac:#0a1330;--pk:#ff7aa5;--soft:#1b2a5a;--gold:#1d2548;--hd:#091a4a;--bad:#ff7aa5;--ok:#3ccfa1;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1330;--c:#131f45;--tx:#eaf0ff;--mu:#a2b0d8;--bd:#26356b;--ac:#82b1ff;--onac:#0a1330;--pk:#ff7aa5;--soft:#1b2a5a;--gold:#1d2548;--hd:#091a4a;--bad:#ff7aa5;--ok:#3ccfa1;color-scheme:dark}
body{background:radial-gradient(130% 40% at 50% 0,var(--gold),transparent 70%) no-repeat,var(--bg)}
header{background:linear-gradient(120deg,var(--hd),#1a5fd0);border-bottom:3px solid var(--pk)}
.hb{display:flex;align-items:center;gap:10px;min-width:0}.hb>div{min-width:0}
.hl{width:44px;height:44px;border-radius:50%;background:#fff;flex:none;padding:2px}
.hr{display:flex;flex-direction:column;gap:4px;flex:none}
header small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{background:var(--ac);color:var(--onac)}
.seg button.on{background:var(--ac);color:var(--onac);border-color:var(--ac)}
nav a.on{color:var(--pk)}
.chk.on{background:var(--ok);border-color:var(--ok)}
.bar i{background:linear-gradient(90deg,var(--ac),var(--pk))}
.card,.t,details.g,.fc,.opt{border-radius:16px}
.card,.t,details.g{box-shadow:0 1px 4px rgba(20,40,110,.07)}
.opt.right{border-color:var(--ok);background:rgba(31,174,132,.14)}
.opt.bad{border-color:var(--bad);background:rgba(224,56,107,.12)}
.fc .big{color:var(--ac)}
h2{color:var(--tx)}
rt{color:var(--pk)}

.tt{font-size:15px;line-height:1.3}.tt b{font-size:17px}.tt span{font-weight:400;font-size:12.5px;opacity:.92}
#mb{background:rgba(255,255,255,.22);border:0;color:#fff;border-radius:12px;width:42px;height:38px;display:grid;place-items:center;padding:0;flex:none}
#mn{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.5);display:none;justify-content:flex-end}#mn.on{display:flex}
#mp{background:var(--c);width:min(88%,380px);height:100%;overflow:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
#mp h3{font-size:12px;color:var(--mu);margin:18px 0 6px;text-transform:uppercase;letter-spacing:.05em}
.mh{display:flex;align-items:center;justify-content:space-between}.mh b{font-size:20px}.mh .x{background:none;border:0;color:var(--tx);font-size:22px;padding:6px}
textarea{width:100%;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);padding:10px;font:13px/1.4 ui-monospace,monospace;margin-bottom:8px}
textarea.note{font:14px/1.4 system-ui,sans-serif}
.ta{display:flex;gap:8px;margin:2px 0 8px;flex-wrap:wrap}.ta button{border:1px solid var(--bd);background:var(--c);color:var(--tx);border-radius:10px;padding:6px 10px;font-size:13px}
.tw{margin-bottom:10px}.tw .t{margin-bottom:4px}
.rg{background:var(--soft);border-radius:12px;padding:10px 12px;margin:6px 0 10px;font-size:14px;line-height:1.6}
.spk{flex:none;width:34px;height:34px;border-radius:50%;border:0;background:var(--soft);color:var(--ac);font-size:15px;padding:0;vertical-align:middle}
main{zoom:var(--z,1)}
.spk{background:transparent;border:1px solid var(--bd);color:var(--ac)}.spk svg{width:17px;height:17px;display:block;margin:auto}.ta button svg{width:14px;height:14px;vertical-align:-2px}.tt span{display:block}.cs{display:block;background:var(--soft);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:16px;line-height:2}.cp{font-size:13px;line-height:1.65}.cp p{margin:0 0 6px}</style></head><body>
