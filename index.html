const BC=[[{"h":"Tujuan perawatan: martabat dan kemandirian","p":["Perawatan (介護) bukan sekadar mengerjakan semua untuk pengguna, melainkan mendukungnya menjalani hidup sesuai kehendaknya. Dua kata kunci: 尊厳の保持 (menjaga martabat) dan 自立支援 (mendukung kemandirian)."],"l":["自己決定: pengguna menentukan sendiri hal-hal sehari-hari, dari baju sampai jam bangun.","利用者本位: keinginan pengguna jadi pusat layanan, bukan kemudahan staf.","QOL (kualitas hidup): ukuran hidup yang bermakna menurut pengguna.","ノーマライゼーション: penyandang disabilitas hidup sewajarnya di masyarakat.","エンパワメント: menggali kekuatan pengguna agar ia berdaya.","アドボカシー: menyuarakan kehendak pengguna yang sulit menyampaikannya sendiri.","ADL: makan, berpakaian, mandi, toilet, berpindah. IADL: belanja, masak, kelola uang, minum obat."]},{"h":"Etika dan hukum profesi","p":["Dasarnya adalah 社会福祉士及び介護福祉士法. 介護福祉士 adalah 名称独占 (hanya yang berlisensi boleh memakai sebutan itu), bukan 業務独占 (orang lain tetap boleh melakukan perawatan)."],"l":["誠実義務: bekerja jujur dan menghormati martabat pengguna.","信用失墜行為の禁止: dilarang merusak kepercayaan pada profesi.","秘密保持義務: rahasia tetap dijaga, bahkan setelah berhenti dari profesi.","連携: bekerja sama dengan tenaga medis dan layanan lain.","資質向上の責務: terus meningkatkan kemampuan."]},{"h":"Penganiayaan dan pengekangan fisik","p":["Menurut 高齢者虐待防止法 ada lima bentuk: 身体的 (memukul), 心理的 (membentak, mengabaikan), 性的, 経済的 (memakai harta tanpa izin), dan 介護放棄 (menelantarkan). Siapa pun yang menemukan dugaan penganiayaan wajib melapor ke pemerintah kota (市町村)."],"l":["身体拘束 pada prinsipnya dilarang.","Pengecualian hanya jika memenuhi tiga syarat sekaligus: 切迫性 (mendesak), 非代替性 (tak ada cara lain), 一時性 (sementara), disertai penjelasan dan catatan.","スピーチロック: mengekang lewat kata ('jangan bergerak', 'tunggu sebentar') juga termasuk.","Cari penyebab perilaku, jangan langsung mengekang."]},{"h":"Konsep kemandirian dan ICF","p":[],"l":["自立 punya beberapa sisi: 身体的自立 (tubuh), 精神的自立, 経済的自立, 社会的自立. 自律 berarti menentukan dan mengatur diri sendiri; bisa tetap ada walau tubuh butuh bantuan.","自立支援: memanfaatkan 残存機能 (kemampuan yang masih ada) dan mencegah 廃用症候群. Bantu sebatas yang diperlukan.","ICF (国際生活機能分類, WHO 2001) menilai 心身機能・身体構造, 活動, 参加, dipengaruhi 環境因子 dan 個人因子. Berbeda dari ICIDH lama yang berfokus pada kekurangan.","介護予防: mencegah munculnya atau memburuknya kondisi yang membutuhkan perawatan.","Pergeseran paradigma: dari mengutamakan ADL menuju mengutamakan QOL, yaitu hidup yang bermakna menurut pengguna.","Perawatan ditujukan kepada pengguna dan juga memberi bimbingan kepada pengasuhnya (keluarga)."]},{"h":"Dasar hukum dan prinsip internasional","p":[],"l":["日本国憲法: 第13条 (hak mengejar kebahagiaan) dan 第25条 (生存権, hak hidup sehat dan bermartabat).","介護保険法 (berlaku 2000): bertujuan membantu pengguna menjalani hidup mandiri sesuai kemampuannya dengan martabat terjaga.","老人福祉法 (1963): dasar kesejahteraan lansia, termasuk 特別養護老人ホーム. 高齢者医療確保法 (2008): dasar 後期高齢者医療制度.","高齢社会対策基本法: arah kebijakan masyarakat lansia. 高年齢者雇用安定法: mendukung pekerjaan lansia.","障害者基本法: mengakui 社会的障壁 sebagai penyebab hambatan. 障害者権利条約 diratifikasi Jepang pada 2014. Prinsip: tidak ada keputusan tentang kami tanpa kami.","高齢者のための国連原則: 自立, 参加, ケア, 自己実現, 尊厳."]},{"h":"Privasi, informasi pribadi, dan hak memilih","p":[],"l":["プライバシー: lindungi saat mandi dan buang air, tutup tirai dan pintu, sapa dengan sopan, dan jangan membicarakan pengguna di tempat umum.","個人情報保護法: gunakan sesuai tujuan, jangan berikan ke pihak ketiga tanpa persetujuan.","インフォームド・コンセント: pengguna menerima penjelasan yang dapat dipahami lalu memutuskan sendiri.","Keselamatan dan kebebasan sering bertentangan. Jangan membatasi semuanya demi keselamatan; pertimbangkan hak pengguna menanggung risiko yang wajar bersama pencegahan yang masuk akal.","苦情対応 dan 第三者評価 membantu menjaga mutu dan hak pengguna.","成年後見制度 dan 日常生活自立支援事業 melindungi orang yang kemampuan menilainya terbatas."]},{"h":"Normalisasi, QOL, dan pemberdayaan","p":["Beberapa konsep dasar sering muncul di ujian. ノーマライゼーション berarti penyandang disabilitas dan lansia bisa hidup biasa di tengah masyarakat, bukan dipisahkan di fasilitas. QOL (kualitas hidup) menilai kepuasan hidup dari sudut pandang pengguna, bukan hanya kesehatan fisik."],"l":["エンパワメント: menggali dan menguatkan kemampuan pengguna sendiri.","アドボカシー: membela hak pengguna yang sulit menyuarakan keinginannya.","ストレングス視点: melihat kekuatan pengguna, bukan hanya kekurangannya."]},{"h":"Perlindungan hak: wali dan pengelolaan uang","p":["成年後見制度 melindungi orang yang kemampuan menilainya berkurang, misalnya karena demensia atau disabilitas intelektual. Wali (成年後見人) mengelola harta dan membuat kontrak atas nama pengguna, tetapi tidak melakukan perawatan langsung."],"l":["法定後見 dibagi tiga: 後見, 保佐, 補助, menurut tingkat kemampuan menilai.","任意後見: pengguna memilih walinya sendiri selagi masih sehat.","日常生活自立支援事業: bantuan mengelola uang sehari-hari, ditangani 社会福祉協議会."]},{"h":"Dukungan yang pas: tidak kurang, tidak berlebihan","p":["自立支援 bukan berarti membiarkan pengguna mengerjakan semuanya sendiri, dan bukan pula melakukan semuanya untuknya. Bantuan berlebihan (過剰介護) justru merampas kemampuan yang masih ada dan mempercepat penurunan fungsi."],"l":["Bantu hanya bagian yang memang tidak bisa dilakukan sendiri.","Beri kesempatan memilih dengan informasi yang cukup, lalu hormati keputusannya (自己決定).","Pengguna berhak mencoba hal yang ada risikonya; tugas kita mengurangi bahaya, bukan melarang semuanya.","Yang diukur bukan seberapa banyak kita membantu, tetapi seberapa besar pengguna tetap berperan."]},{"h":"Perawatan berpusat pada pribadi di fasilitas (ユニットケア)","p":["ユニットケア membagi fasilitas menjadi unit kecil, biasanya sekitar 10 orang atau kurang, dengan kamar pribadi (個室) dan ruang bersama. Tujuannya agar suasananya seperti rumah dan staf bisa mengenal tiap pengguna secara dekat."],"l":["Staf tetap per unit supaya terbentuk hubungan akrab (馴染みの関係).","Irama hidup mengikuti kebiasaan pengguna, bukan jadwal fasilitas.","Kamar pribadi menjaga privasi dan martabat.","Prinsipnya sama dengan 個別ケア: tiap pengguna diperlakukan sebagai pribadi."]},{"h":"Tokoh dan sejarah gagasan kesejahteraan","p":["Untuk ujian, kenali tokoh di balik konsep dasar. ノーマライゼーション digagas oleh Bank-Mikkelsen dari Denmark, dirumuskan prinsip-prinsipnya oleh ニィリエ dari Swedia, dan dikembangkan menjadi ソーシャル・ロール・バロリゼーション oleh ヴォルフェンスベルガー."],"l":["自立生活運動 (gerakan hidup mandiri) lahir di Amerika dan menekankan hak penyandang disabilitas menentukan hidupnya sendiri.","国際障害者年 diperingati pada 1981 dengan tema partisipasi penuh dan kesetaraan.","障害者権利条約 diadopsi PBB pada 2006; Jepang meratifikasinya pada 2014.","Kata kunci ujian: 自己決定, 社会参加, 権利擁護."]}],[{"h":"Sikap dasar membantu","p":["Komunikasi yang baik dimulai dari sikap: mendengar sampai selesai, menerima perasaan, dan tidak menghakimi. Pegangan klasik adalah tujuh prinsip Biestek."],"l":["個別化 (melihat sebagai pribadi), 意図的な感情表出 (memberi ruang mengungkap perasaan), 統制された情緒的関与 (terlibat tetapi terkendali), 受容 (menerima), 非審判的態度 (tidak menghakimi), 自己決定 (penentuan diri), 秘密保持 (menjaga rahasia).","自己覚知: mengenali nilai dan emosi diri agar tidak mengganggu perawatan.","ラポール: hubungan saling percaya sebagai fondasi."]},{"h":"Teknik bertanya dan menanggapi","p":["Pilih jenis pertanyaan menurut tujuan. Pertanyaan terbuka menggali, pertanyaan tertutup memastikan fakta cepat."],"l":["オープンクエスチョン: 'Bagaimana Anda menghabiskan hari kemarin?'","クローズドクエスチョン: 'Apakah terasa nyeri?' (ya atau tidak).","繰り返し: mengulang kata kunci. 要約: merangkum lalu mengonfirmasi. 感情の反映: 'Pasti berat ya'.","沈黙: beri waktu, jangan buru-buru mengisi hening.","Hindari menyela, menyangkal, dan menasihati terlalu cepat."]},{"h":"Menyesuaikan dengan hambatan komunikasi","p":[],"l":["失語症: bicara pelan dan pendek, gunakan pertanyaan ya/tidak, kartu gambar, dan tunggu jawabannya. Pada afasia motorik pemahaman relatif terjaga.","構音障害: pemahaman terjaga, lafal sulit; beri waktu atau gunakan tulisan.","Tuli atau kurang dengar: hadap depan, bicara jelas, pakai tulisan atau isyarat. Tidak perlu berteriak.","Tunanetra: sebut nama dulu, jelaskan posisi benda dengan クロックポジション (arah jam).","Pengguna kursi roda: samakan tinggi pandang."]},{"h":"Kerja tim dan kesehatan jiwa staf","p":[],"l":["Laporan: kesimpulan dulu, fakta dipisah dari pendapat. 申し送り harus ringkas dan lengkap.","ケアカンファレンス: rapat tim untuk menyatukan arah perawatan.","アサーション: menyampaikan pendapat jujur sambil menghargai orang lain.","バーンアウト: kelelahan emosional sampai kehilangan semangat; cegah dengan berbagi beban dan mencari dukungan."]},{"h":"Dasar teori komunikasi","p":[],"l":["Komunikasi verbal (kata) dan nonverbal (ekspresi wajah, tatapan, sikap tubuh, sentuhan, nada suara, jarak).","パーソナルスペース (Hall): 密接距離 (sampai sekitar 45 cm), 個体距離 (45 sampai 120 cm), 社会距離 (1,2 sampai 3,5 m), 公衆距離 (di atas 3,5 m). Perawatan fisik masuk 密接距離, jadi beri tahu dan minta izin.","傾聴: mendengarkan penuh dengan tatapan, anggukan, dan tidak memotong.","共感: memahami perasaan dari sudut pandang pengguna. 同情: ikut kasihan dari luar; tidak sama dengan empati.","Alat bantu komunikasi: 補聴器, 点字, 筆談, 絵カード, 文字盤, dan 手話.","Bila pesan verbal dan nonverbal bertentangan, orang cenderung lebih percaya pada yang nonverbal."]},{"h":"Diri sendiri dan hubungan antar manusia","p":[],"l":["ジョハリの窓: empat area diri yaitu 開放, 盲点, 秘密, 未知. Membuka diri dan menerima umpan balik memperluas area terbuka.","自己開示: mengungkapkan diri; dilakukan secukupnya sesuai hubungan.","アサーション: tiga gaya yaitu agresif (menekan), pasif (menahan diri), dan asertif (jujur sambil menghargai).","ストレス: rangsangan penyebabnya ストレッサー. ストレスコーピング: 問題焦点型 (menyelesaikan masalah) dan 情動焦点型 (mengelola perasaan).","感情労働: pekerjaan yang menuntut pengelolaan perasaan sendiri; berisiko 燃え尽き.","Di tempat kerja: ストレスチェック (wajib tahunan untuk tempat kerja 50 orang ke atas) dan meminta dukungan atasan atau rekan."]},{"h":"Keluarga, pencatatan, dan bahasa sopan","p":[],"l":["Keluarga pengasuh sering merasa bersalah dan lelah. Dengarkan, bagikan informasi, hargai usaha mereka, dan sambungkan ke dukungan.","Bila pendapat pengguna dan keluarga berbeda, utamakan keinginan pengguna sambil menjembatani lewat pembicaraan.","記録: 経過記録, 事故報告書, ヒヤリハット, 介護計画. Tulis fakta, objektif, singkat, dengan tanggal dan tanda tangan.","Koreksi catatan dengan garis dua dan paraf; jangan memakai cairan koreksi.","Pelaporan: lisan segera untuk hal mendesak, lalu tulis. Rapat: カンファレンス, ミーティング, 申し送り, サービス担当者会議.","敬語: 尊敬語 (いらっしゃる, おっしゃる, 召し上がる) untuk meninggikan lawan bicara, 謙譲語 (伺う, 申し上げる, 拝見する) merendahkan diri, 丁寧語 (です, ます).","Sapaan: nama keluarga plus さん. Hindari bahasa bayi atau memanggil dengan ちゃん kepada lansia."]},{"h":"Empati, kesadaran diri, dan prinsip Biestek","p":["共感 berarti memahami perasaan lawan bicara tanpa ikut larut. 自己覚知 berarti mengenali nilai dan kebiasaan diri sendiri supaya tidak memengaruhi cara menilai pengguna."],"l":["バイスティックの7原則: 個別化, 意図的な感情表出, 統制された情緒的関与, 受容, 非審判的態度, 利用者の自己決定, 秘密保持.","非言語コミュニケーション: ekspresi wajah, tatapan, nada suara, dan jarak duduk ikut menyampaikan pesan.","受容 berbeda dengan setuju: menerima perasaan pengguna tanpa menghakimi."]},{"h":"Komunikasi dengan afasia dan gangguan bicara","p":["失語症 adalah gangguan bahasa akibat kerusakan otak, bukan penurunan kecerdasan. Tipe 運動性失語 (ブローカ) paham tetapi sulit bicara; tipe 感覚性失語 (ウェルニッケ) lancar bicara tetapi isinya kacau dan sulit memahami."],"l":["Afasia motorik: beri pertanyaan tertutup (ya/tidak), beri waktu menjawab.","Afasia sensorik: bicara pendek dan jelas, pakai gambar atau isyarat.","構音障害: otot bicara bermasalah sehingga ucapan tidak jelas, pemahaman tetap baik.","Pada demensia: kalimat pendek, sebut nama, jangan membantah."]},{"h":"Nonverbal, jarak, dan posisi duduk","p":["Selain kata-kata, jarak dan posisi tubuh menyampaikan pesan. Menurut teori Hall, jarak antarmanusia terbagi empat: 密接距離 (sampai sekitar 45 cm), 個体距離 (sekitar 45 sampai 120 cm), 社会距離 (sekitar 1,2 sampai 3,6 m), dan 公衆距離."],"l":["Perawatan badan masuk ke jarak sangat dekat, jadi beri tahu dulu sebelum menyentuh.","Duduk atau berjongkok sejajar mata (目線を合わせる), jangan berbicara dari atas.","Posisi miring sekitar 90 derajat terasa lebih nyaman daripada berhadapan lurus.","Perhatikan ekspresi wajah, nada suara, dan tatapan; ini sering lebih jujur daripada ucapan."]},{"h":"Menanggapi keluhan dan menenangkan keluarga","p":["Saat menerima keluhan (苦情), dengarkan sampai selesai tanpa memotong dan tanpa membela diri. Sampaikan permintaan maaf atas ketidaknyamanan yang dirasakan, lalu laporkan ke atasan; jangan memutuskan atau menjanjikan sesuatu sendiri."],"l":["Catat isi keluhan dengan fakta: siapa, kapan, apa.","Sampaikan bahwa keluhan akan diteruskan dan kapan jawabannya diberikan.","Keluhan yang tak selesai di tempat bisa dibawa ke 国保連 atau pemerintah kota.","Keluhan adalah bahan perbaikan mutu layanan."]},{"h":"Bahasa sopan: 尊敬語, 謙譲語, 丁寧語","p":["Staf kaigo wajib menguasai tiga jenis bahasa sopan. 尊敬語 meninggikan tindakan lawan bicara, 謙譲語 merendahkan tindakan diri sendiri, dan 丁寧語 menyopankan nada bicara secara umum (です dan ます)."],"l":["尊敬語: いらっしゃる (pergi/ada), 召し上がる (makan), おっしゃる (berkata), なさる (melakukan).","謙譲語: 伺う (mengunjungi/bertanya), 申す (berkata), いただく (menerima/makan), 拝見する (melihat).","Panggil pengguna dengan nama keluarga + さん, hindari panggilan akrab seperti おじいちゃん.","Jangan memakai bahasa anak-anak (赤ちゃん言葉) kepada lansia."]}],[{"h":"Asuransi kaigo (介護保険)","p":["Penyelenggaranya adalah pemerintah kota atau kecamatan khusus (市町村・特別区). Prinsip dasarnya 共同連帯: masyarakat saling menanggung."],"l":["第1号被保険者: usia 65 tahun ke atas. 第2号被保険者: 40 sampai 64 tahun dengan asuransi kesehatan; layanan hanya untuk penyakit terkait usia (特定疾病).","Beban pengguna 1 sampai 3 bagian sesuai penghasilan.","Alur: permohonan ke kantor kota, survei kunjungan dan 主治医意見書, 一次判定 (komputer), 二次判定 (介護認定審査会), penetapan. Masa berlaku penetapan baru pada prinsipnya 6 bulan.","Kategori: 要支援1・2 (予防給付) dan 要介護1から5 (介護給付), total tujuh tingkat.","区分支給限度基準額: batas layanan per bulan; kelebihannya dibayar penuh pengguna.","Peralatan: 福祉用具 yang disewa (kursi roda, ranjang khusus, pegangan tanpa pemasangan) dan yang dibeli (kloset duduk, perlengkapan mandi)."]},{"h":"Pelaku dan layanan","p":[],"l":["介護支援専門員 (care manager) menyusun ケアプラン dan wajib mengunjungi rumah pengguna minimal sebulan sekali.","地域包括支援センター: pusat dukungan lansia; menyusun rencana pencegahan untuk 要支援.","地域密着型サービス: untuk warga setempat, misalnya 小規模多機能型居宅介護 (kunjungan, harian, menginap) dan グループホーム (demensia, mulai 要支援2).","民生委員: relawan yang ditunjuk menteri, tanpa gaji."]},{"h":"Kesejahteraan disabilitas dan perlindungan hak","p":[],"l":["障害者総合支援法: layanan dengan 障害支援区分 tingkat 1 sampai 6.","就労継続支援A型 memakai kontrak kerja; B型 tanpa kontrak, dengan upah sesuai hasil.","Kartu: 身体障害者手帳, 療育手帳 (intelektual), 精神障害者保健福祉手帳.","成年後見制度: 後見, 保佐, 補助 menurut tingkat penurunan daya nalar.","日常生活自立支援事業: dijalankan 社会福祉協議会, membantu uang dan prosedur harian.","福祉六法: 生活保護法, 児童福祉法, 母子及び父子並びに寡婦福祉法, 老人福祉法, 身体障害者福祉法, 知的障害者福祉法.","地域包括ケアシステム: medis, perawatan, pencegahan, tempat tinggal, dan dukungan hidup terpadu di komunitas."]},{"h":"Jaminan sosial (社会保障)","p":["Empat pilar jaminan sosial Jepang: 社会保険, 公的扶助, 社会福祉, 公衆衛生."],"l":["社会保険 mencakup 医療保険, 年金保険, 介護保険, 雇用保険, 労災保険. Premi dan iuran menjadi dasar manfaat.","医療保険: 国民皆保険 (semua penduduk wajib ikut). Karyawan memakai 被用者保険, lainnya 国民健康保険. 後期高齢者医療制度 untuk usia 75 tahun ke atas.","Beban berobat sekitar 1 sampai 3 bagian sesuai usia dan penghasilan; 高額療養費制度 membatasi beban bulanan.","年金: 国民年金 (基礎年金) untuk penduduk usia 20 sampai di bawah 60 tahun; 厚生年金 untuk karyawan.","労災保険: untuk kecelakaan kerja dan kecelakaan saat pergi-pulang kerja; iurannya seluruhnya ditanggung pemberi kerja.","雇用保険: tunjangan bagi yang kehilangan pekerjaan dan dukungan kerja.","生活保護 (公的扶助): ada 8 jenis bantuan yaitu 生活, 住宅, 教育, 医療, 介護, 出産, 生業, 葬祭. Diajukan ke 福祉事務所. Prinsip 補足性: memakai harta dan kemampuan sendiri lebih dulu. 医療扶助 dan 介護扶助 diberikan dalam bentuk layanan (現物給付)."]},{"h":"Pembiayaan dan jenis layanan asuransi kaigo","p":[],"l":["Sumber dana asuransi kaigo: separuh premi (保険料), separuh dana pajak (公費). Premi 第1号 biasanya dipotong dari pensiun; premi 第2号 dibayar bersama premi asuransi kesehatan.","介護報酬: imbalan layanan yang dihitung dalam 単位, ditinjau tiap 3 tahun.","Layanan di rumah (居宅サービス): 訪問介護, 訪問入浴, 訪問看護, 訪問リハビリ, 居宅療養管理指導, 通所介護 (デイサービス), 通所リハビリ (デイケア), 短期入所 (ショートステイ), 特定施設入居者生活介護, 福祉用具貸与, 福祉用具購入, 住宅改修.","地域密着型サービス (untuk penduduk setempat, izin dari kota): 小規模多機能型居宅介護, 認知症対応型共同生活介護 (グループホーム), 認知症対応型通所介護, 夜間対応型訪問介護, 地域密着型介護老人福祉施設 (kapasitas 29 orang ke bawah).","Layanan fasilitas: 介護老人福祉施設 (特別養護老人ホーム, prinsipnya 要介護3 ke atas), 介護老人保健施設 (老健, rehabilitasi untuk kembali ke rumah), 介護医療院 (perawatan jangka panjang dengan medis).","要支援 memakai 介護予防サービス dan tidak bisa memakai layanan fasilitas; グループホーム baru bisa mulai 要支援2.","特定疾病: 16 jenis penyakit terkait penuaan yang memungkinkan 第2号被保険者 (40 sampai 64 tahun) memakai layanan."]},{"h":"Hukum profesi dan pencegahan penganiayaan","p":[],"l":["社会福祉士及び介護福祉士法: 介護福祉士 adalah 名称独占 (hanya yang bersertifikat boleh memakai gelar), bukan 業務独占. Wajib 誠実義務, 信用失墜行為の禁止, 秘密保持義務 (juga setelah berhenti kerja), 連携, dan 資質向上の責務.","介護福祉士 dapat melakukan 喀痰吸引 dan 経管栄養 dalam kondisi tertentu setelah pelatihan dan dengan petunjuk dokter.","日本介護福祉士会 倫理綱領: 利用者本位・自立支援, 専門的サービスの提供, プライバシーの保護, 総合的サービスの提供と積極的な連携・協力, 利用者ニーズの代弁, 地域福祉の推進, 後継者の育成.","高齢者虐待防止法: pelaku 養護者 (keluarga dan sejenisnya) atau 養介護施設従事者等. Lima jenis: 身体的, 心理的, 性的, 経済的, 介護・世話の放棄 (ネグレクト).","Pelaporan (通報) ke pemerintah kota. Pekerja fasilitas yang menemukan penganiayaan wajib melapor. Untuk penganiayaan oleh keluarga, wajib melapor bila ada bahaya serius pada jiwa atau tubuh, selain itu berupaya melapor.","障害者虐待防止法: tiga jenis pelaku yaitu 養護者, 障害者福祉施設従事者等, dan 使用者 (pemberi kerja). Ada juga jenis 経済的虐待.","身体拘束: pada prinsipnya dilarang. Pengecualian hanya bila memenuhi 3 syarat yaitu 切迫性, 非代替性, 一時性, disertai penjelasan, persetujuan, dan catatan.","3つのロック: フィジカルロック (mengekang fisik), ドラッグロック (obat untuk menenangkan), スピーチロック (ucapan yang membatasi)."]},{"h":"Peserta dan alur asuransi kaigo","p":["Penyelenggara asuransi (保険者) adalah pemerintah kota/kabupaten (市町村). Peserta dibagi dua: 第1号被保険者 berusia 65 tahun ke atas, 第2号被保険者 berusia 40 sampai 64 tahun. Kelompok kedua hanya bisa memakai layanan bila sakitnya termasuk 特定疾病."],"l":["Tingkat: 要支援1〜2 dan 要介護1〜5.","ケアマネジャー (介護支援専門員) menyusun ケアプラン.","地域包括支援センター: pusat konsultasi dan dukungan lansia di tiap wilayah.","Peserta menanggung biaya sebagian (1 sampai 3 bagian dari 10) sesuai penghasilan."]},{"h":"Lima asuransi sosial dan bantuan publik","p":["Jaminan sosial Jepang bertumpu pada asuransi sosial: 医療保険, 年金保険, 介護保険, 雇用保険, dan 労災保険. Selain itu ada 公的扶助 (生活保護) untuk yang tidak mampu memenuhi kebutuhan dasar."],"l":["労災保険 menanggung kecelakaan kerja; iuran ditanggung pemberi kerja.","生活保護: bantuan bagi yang penghasilannya di bawah batas hidup minimum.","社会福祉 menolong kelompok rentan; 公衆衛生 menjaga kesehatan masyarakat."]},{"h":"Peran pemerintah daerah dan lembaga pendukung","p":["Penyelenggara asuransi kaigo adalah 市町村. 都道府県 berperan memberi izin dan mengawasi banyak penyelenggara layanan, sedangkan 市町村 menunjuk penyelenggara 地域密着型サービス di wilayahnya."],"l":["国民健康保険団体連合会 (国保連): memeriksa dan membayar biaya layanan, serta menangani keluhan.","介護保険審査会 (tingkat provinsi): menangani keberatan atas penetapan tingkat perawatan.","社会福祉協議会: lembaga kesejahteraan sosial di tingkat kota dan provinsi.","民生委員: sukarelawan yang mengunjungi dan mendampingi warga di lingkungannya."]},{"h":"Perawatan berbasis komunitas (地域包括ケア)","p":["地域包括ケアシステム bertujuan agar lansia bisa tetap tinggal di lingkungan yang akrab sampai akhir hidup. Lima unsurnya dijalankan terpadu: 住まい, 医療, 介護, 予防, dan 生活支援."],"l":["自助: usaha sendiri. 互助: tolong-menolong sukarela. 共助: asuransi sosial. 公助: bantuan pemerintah.","地域包括支援センター menjadi pusat koordinasi di tiap wilayah.","Peran staf kaigo: pengamat dini perubahan dan penghubung ke tenaga lain.","Kuncinya kerja sama lintas profesi dan warga sekitar."]},{"h":"Biaya, batas, dan keringanan asuransi kaigo","p":["Pengguna menanggung sebagian biaya (利用者負担): 1 bagian dari 10 pada umumnya, dan 2 atau 3 bagian bagi yang berpenghasilan lebih tinggi. Tiap tingkat 要介護度 memiliki batas penggunaan bulanan (区分支給限度基準額); kelebihannya ditanggung penuh oleh pengguna."],"l":["高額介護サービス費: bila biaya bulanan melewati batas tertentu, kelebihannya dikembalikan.","Di fasilitas, 食費 dan 居住費 ditanggung sendiri.","補足給付: keringanan makan dan tempat tinggal bagi pengguna berpenghasilan rendah.","Layanan 要支援 dan 要介護 memakai sistem dan batas yang berbeda."]}],[{"h":"Prinsip gerak: ボディメカニクス","p":["Agar perawatan ringan bagi kedua pihak, manfaatkan prinsip mekanika tubuh."],"l":["Lebarkan 支持基底面 (buka kaki) dan rendahkan titik berat (tekuk lutut).","Dekatkan badan ke pengguna, gunakan otot besar, dan gerakkan dengan menggeser, bukan mengangkat.","Beri tahu setiap gerakan dan minta bantuan pengguna sebisanya.","Setelah menaikkan sandaran tempat tidur, lakukan 背抜き (lepaskan tekanan punggung dan kaki)."]},{"h":"Berpindah, berjalan, dan kursi roda","p":[],"l":["Berdiri dari 端座位: duduk dangkal, kaki ditarik ke belakang, badan condong ke depan.","Tongkat setinggi trokanter besar; berdiri di sisi lumpuh agak ke belakang. Naik tangga: tongkat, kaki sehat, kaki lumpuh. Turun: tongkat, kaki lumpuh, kaki sehat.","Pindah dari tempat tidur: letakkan kursi roda di sisi sehat dengan sudut 20 sampai 30 derajat, kunci rem, angkat penopang kaki.","Turunan curam: mundur perlahan. Naik selisih tinggi: injak tuas dan angkat roda depan.","Periksa rem, ban, dan penopang kaki sebelum dipakai."]},{"h":"Makan dan perawatan mulut","p":[],"l":["Persiapan: toilet, cuci tangan, senam mulut. Duduk tegak, dagu sedikit turun, telapak kaki menapak.","Penolong duduk sejajar mata, di depan serong.","Orang yang sulit menelan: 嚥下調整食 dan とろみ; hindari mochi dan roti kering.","Tegak sekitar 30 menit setelah makan.","口腔ケア mencegah pneumonia aspirasi. Gigi tiruan dicuci air mengalir dan disimpan dalam air."]},{"h":"Mandi, kebersihan, dan berpakaian","p":[],"l":["入浴: hangatkan ruang ganti (ヒートショック), air 38 sampai 41 derajat, siram dari ujung kaki, siapkan kursi mandi dan pegangan.","清拭: dari ujung ke pusat, mulai dari wajah, area kemaluan terakhir. Mata dari sudut dalam ke luar.","陰部洗浄 dari depan ke belakang. Cuci rambut dengan ujung jari. Potong kuku jangan terlalu dalam.","更衣: 脱健着患. Lepas dari sisi sehat, pakai dari sisi lumpuh."]},{"h":"Buang air, luka tekan, tidur, dan lingkungan","p":[],"l":["Toilet: posisi sedikit membungkuk, kaki menapak. Ponsel toilet portabel di dekat sisi sehat. Amati warna, jumlah, dan frekuensi.","Inkontinensia: 切迫性 (kebelet mendadak), 腹圧性 (bocor saat batuk).","褥瘡: area rawan 仙骨部; ubah posisi berkala, gunakan penyebar tekanan, jangan memijat kemerahan.","Tidur: hindari kafein, aktifkan siang hari. Lingkungan: lampu kaki, lantai kering, hilangkan selisih tinggi, sediakan ramp dan pegangan.","Keracunan makanan: jangan sebarkan, jangan biarkan berkembang, bunuh kuman."]},{"h":"Lingkungan rumah dan alat bantu","p":[],"l":["Pegangan (手すり) di toilet dan kamar mandi, tinggi sekitar 75 sampai 85 cm. 引き戸 (pintu geser) lebih mudah dipakai kursi roda daripada pintu ayun.","Kemiringan ramp kursi roda sekitar 1 banding 12 atau lebih landai. Lantai anti selip, hilangkan selisih tinggi, beri penerangan kaki di malam hari.","住宅改修 (asuransi kaigo): pegangan, hilangkan selisih tinggi, ganti lantai, pintu geser, kloset duduk. Batas biaya 20万円, beban pengguna 1 sampai 3 bagian.","福祉用具貸与 (disewa): 車いす, 特殊寝台, 床ずれ防止用具, 体位変換器, 手すり dan スロープ tanpa pekerjaan konstruksi, 歩行器, 歩行補助つえ, 認知症老人徘徊感知機器, 移動用リフト, 自動排泄処理装置.","特定福祉用具購入 (dibeli, karena bersentuhan dengan tubuh): 腰掛便座 (termasuk toilet portabel), 入浴補助用具, 簡易浴槽, つり具 untuk lift. Batas 10万円 per tahun anggaran."]},{"h":"Memasak, gizi, dan keracunan makanan","p":[],"l":["Zat gizi: 三大栄養素 (たんぱく質, 炭水化物, 脂質), lalu ビタミン dan ミネラル. Larut air: B dan C. Larut lemak: A, D, E, K. Kalsium untuk tulang, zat besi untuk mencegah anemia, serat untuk mencegah sembelit.","Lansia perlu cukup protein dan 低栄養 diwaspadai, tetapi garam dibatasi untuk mencegah hipertensi.","Keracunan bakteri: サルモネラ (telur, daging), カンピロバクター (ayam), 腸管出血性大腸菌 O157 (daging kurang matang), 腸炎ビブリオ (ikan laut mentah, musim panas), ボツリヌス (kemasan kedap udara; madu tidak untuk bayi di bawah 1 tahun).","黄色ブドウ球菌: dari luka tangan, racunnya tahan panas. ノロウイルス: musim dingin, kerang; panaskan bagian dalam 85 sampai 90 derajat selama 90 detik atau lebih.","Pencegahan: jangan menempelkan, jangan memperbanyak, bunuh kuman. Simpan dingin, cuci tangan, pisahkan talenan daging mentah.","洗濯: 塩素系漂白剤 jangan dicampur dengan pembersih asam karena menghasilkan gas klorin berbahaya."]},{"h":"Posisi tubuh dan alat bantu jalan","p":[],"l":["Posisi: 仰臥位 (telentang), 側臥位 (miring), 腹臥位 (tengkurap), ファーラー位 (setengah duduk sekitar 45 derajat), 起座位 (duduk membungkuk, meringankan sesak), シムス位 (setengah tengkurap, untuk 浣腸 atau saat muntah).","Untuk mencegah luka tekan, miringkan sekitar 30 derajat. Area rawan telentang: 後頭部, 肩甲骨部, 仙骨部, 踵部. Area rawan miring: 耳, 肩, 大転子部, 外果.","T字杖: untuk keseimbangan ringan. 四点杖: permukaan tumpu luas, lebih stabil. ロフストランドクラッチ: ada penopang lengan bawah, untuk yang tenaga genggamnya lemah. 松葉づえ: jangan menumpukan berat di ketiak.","歩行器: untuk yang butuh stabilitas lebih besar dari tongkat.","Penyedia bantuan tidak menarik lengan lumpuh saat membantu; topang ketiak atau bahu secara aman."]},{"h":"Perawatan akhir hidup (終末期)","p":[],"l":["Kübler-Ross: 5 tahap menghadapi kematian yaitu 否認, 怒り, 取引, 抑うつ, 受容. Tahap tidak selalu berurutan.","Tanda menjelang ajal: 下顎呼吸, チェーンストークス呼吸, nadi lemah, tekanan darah turun, チアノーゼ, anggota gerak dingin, urine berkurang.","Kematian dinyatakan hanya oleh dokter berdasarkan tiga tanda: napas berhenti, jantung berhenti, pupil melebar tanpa refleks cahaya. Pekerja perawatan tidak menyatakan kematian.","Prinsip: menghormati kehendak yang bersangkutan, meredakan nyeri dan penderitaan, dan menjaga martabat. 緩和ケア bertujuan meringankan penderitaan fisik, mental, dan spiritual.","ACP (人生会議): merundingkan sebelumnya, bersama keluarga dan tim, perawatan yang diinginkan di akhir hidup. DNAR: kehendak untuk tidak dilakukan resusitasi. リビングウィル: pernyataan tertulis kehendak perawatan akhir hidup.","Setelah meninggal: 死後のケア (エンゼルケア) merapikan dan membersihkan tubuh dengan penuh hormat, sambil memperhatikan keluarga dan melakukan グリーフケア (dukungan duka). Staf pun perlu dibantu agar tidak terbebani."]},{"h":"Kebersihan dan pencegahan komplikasi","p":["Prinsip berpakaian untuk pengguna dengan lumpuh sebelah (片麻痺) adalah 脱健着患: saat melepas, mulai dari sisi yang sehat; saat memakai, mulai dari sisi yang sakit."],"l":["褥瘡の好発部位: 仙骨部, 大転子部, 踵, 肩甲骨部 (tulang yang menonjol).","Ubah posisi tubuh secara berkala untuk mencegah luka tekan.","誤嚥予防: duduk tegak, dagu sedikit ditarik, makan perlahan.","Suhu air mandi yang umum disarankan sekitar 38 sampai 41 derajat; hindari perubahan suhu mendadak."]},{"h":"Tongkat, walker, dan kursi roda","p":["Tongkat dipegang di sisi yang sehat (健側). Aturan tangga dengan tongkat: saat naik, kaki sehat melangkah dulu; saat turun, tongkat dan kaki yang sakit turun dulu. Pegangan: tangan berjaga di sisi yang lemah dan sedikit di belakang."],"l":["シルバーカー: untuk lansia yang masih berjalan stabil, bukan alat untuk menopang berat badan.","歩行器: lebih stabil, untuk yang keseimbangannya kurang.","Kursi roda naik tanjakan kecil: tekan tuas pengungkit lalu angkat roda depan.","Selalu kunci rem sebelum berpindah dan sebelum pengguna naik atau turun."]},{"h":"Perawatan kuku, kulit, dan kaki","p":["Kuku lebih mudah dipotong setelah mandi atau rendam kaki karena sudah lunak. Hindari memotong terlalu dalam (深爪), potong lurus lalu rapikan sudutnya dengan kikir."],"l":["Kulit lansia mudah kering dan gatal; oleskan pelembap setelah mandi.","Pada penderita diabetes, luka kecil di kaki sering tidak terasa; periksa kaki setiap hari.","Kaki yang bersih dan kering mencegah infeksi jamur dan luka.","Tindakan pada kuku yang bermasalah (misalnya tebal atau menanduk) diserahkan ke tenaga medis."]},{"h":"Menyeka tubuh di ranjang (清拭)","p":["清拭 dipakai saat pengguna tidak bisa mandi. Siapkan ruangan hangat (sekitar 22 sampai 26 derajat), tutup tirai, dan buka tubuh sedikit demi sedikit untuk menjaga privasi dan menghindari kedinginan."],"l":["Seka dari ujung (tangan, kaki) ke arah jantung agar membantu peredaran darah.","Urutan umum: wajah, lengan, dada dan perut, kaki, punggung, lalu area kemaluan.","Mata diseka dari sudut dalam ke luar dengan bagian handuk yang bersih.","Ajak bicara, tanyakan suhu, dan periksa kulit sambil menyeka."]},{"h":"Menuntun pengguna tunanetra","p":["Dalam 手引き, tawarkan dulu bantuan dengan suara, lalu biarkan pengguna memegang siku atau bahu kita. Berjalanlah setengah langkah di depan dan beri tahu bila ada tangga, belokan, atau halangan."],"l":["Sebut nama sebelum menyentuh dan jelaskan keadaan sekitar dengan kata-kata.","Saat makan, jelaskan letak hidangan memakai クロックポジション (arah jam).","Hindari menarik tangan atau tongkat putih pengguna.","Jangan memindahkan barang di rumah tanpa memberi tahu."]}],[{"h":"Alur proses perawatan (介護過程)","p":["Tujuannya mendukung kemandirian dan hidup yang bermakna. Alurnya berputar: asesmen, rencana, pelaksanaan, evaluasi."],"l":["アセスメント: kumpulkan informasi (wawancara, observasi, dokumen), tafsirkan, hubungkan, lalu rumuskan 生活課題.","Informasi subjektif (ucapan pengguna) dan objektif (suhu, tekanan darah) dibedakan.","生活歴, 既往歴, 現病歴 membantu memahami kebiasaan dan nilai pengguna.","Gunakan sudut pandang ストレングス: kekuatan dan minat pengguna."]},{"h":"Menyusun rencana dan pelaksanaan","p":[],"l":["Tujuan berpusat pada pengguna, spesifik, ada tenggat, dan bisa dinilai.","長期目標 dipecah menjadi 短期目標 sebagai anak tangga.","Prioritaskan masalah yang menyangkut nyawa dan keselamatan serta keinginan pengguna.","Rencana dijelaskan dan disetujui pengguna. ケアプラン disusun care manager; 個別援助計画 disusun tiap penyedia layanan.","Rapat 介護支援専門員 dengan para pihak disebut サービス担当者会議."]},{"h":"Mencatat dan mengevaluasi","p":[],"l":["Catatan faktual, objektif, jelas waktunya. Koreksi dengan garis dua dan paraf, jangan dihapus.","SOAP: subjektif, objektif, asesmen, rencana.","モニタリング: memantau pelaksanaan dan perubahan.","Evaluasi: tinjau pencapaian dan respons pengguna; jika belum tercapai, analisis penyebab dan susun ulang rencana.","Laporan: 事故報告書 (sudah terjadi) dan ヒヤリハット (nyaris terjadi) untuk pencegahan."]},{"h":"Alat dan kerangka penilaian","p":[],"l":["ICF: kerangka menilai 健康状態 dengan 心身機能・身体構造, 活動, 参加, serta 環境因子 dan 個人因子. Fokus pada kemampuan hidup (生活機能), bukan hanya penyakit.","ADL (dasar): makan, buang air, mandi, berpakaian, berpindah, merapikan diri. IADL (lebih kompleks): belanja, memasak, mengatur uang, mengelola obat, memakai telepon dan transportasi.","Barthel Index dan FIM: skala menilai tingkat kemandirian ADL.","障害高齢者の日常生活自立度 (寝たきり度): J (hidup mandiri), A (nyaris tidak keluar rumah), B (duduk, memakai kursi roda), C (berbaring sepanjang hari).","認知症高齢者の日常生活自立度: I, IIa, IIb, IIIa, IIIb, IV, M; makin ke belakang makin berat dan butuh pengawasan.","改訂長谷川式 (HDS-R): skor penuh 30, 20 atau kurang diduga demensia. MMSE: skor penuh 30, 23 atau kurang diduga demensia."]},{"h":"Penetapan tingkat perawatan dan hubungan dengan pengguna","p":[],"l":["Alur 要介護認定: permohonan, 認定調査 (kunjungan) dan 主治医意見書, 一次判定 (komputer), 二次判定 oleh 介護認定審査会, lalu pemerintah kota menetapkan. Hasil pada prinsipnya keluar dalam 30 hari.","Tingkat: 非該当, 要支援 1 dan 2, 要介護 1 sampai 5.","ラポール: hubungan saling percaya sebagai dasar asesmen. Gunakan 傾聴, 受容, dan 共感.","自己決定: pengguna menentukan sendiri berdasarkan informasi yang dipahami. アドボカシー: menyuarakan kepentingan pengguna yang sulit menyampaikan kehendak.","Anggota tim: pengguna dan keluarga, 介護福祉士, 介護支援専門員, dokter, perawat, terapis, pekerja sosial. Berbagi informasi dengan tetap menjaga rahasia."]},{"h":"Pencatatan dan kasus","p":[],"l":["Catatan memuat 5W1H: siapa, kapan, di mana, apa, mengapa, bagaimana. Tulis fakta dan bedakan dari pendapat pribadi.","Catatan dapat dibaca pengguna atau keluarga sehingga bahasanya harus sopan dan tidak merendahkan.","Catatan layanan dijaga sebagai informasi pribadi dan disimpan paling sedikit 2 tahun sejak layanan berakhir (standar nasional).","ケースカンファレンス: rapat meninjau kasus bersama untuk mencari dukungan yang lebih baik. Tujuannya belajar, bukan menyalahkan.","Saat menjawab soal kasus: tentukan masalah utama, utamakan keselamatan, hormati keinginan pengguna, dukung kemampuan yang masih ada, dan lapor ke atasan atau perawat bila ada perubahan kondisi."]},{"h":"Siklus proses perawatan","p":["Proses perawatan berjalan sebagai siklus: アセスメント (menilai kebutuhan), 計画立案, 実施, 評価, lalu kembali ke penilaian. Tujuan harus dibuat dari sudut pandang pengguna dan konkret."],"l":["長期目標 dan 短期目標: tujuan jangka panjang dipecah menjadi langkah jangka pendek.","Tujuan yang baik bisa diamati dan diukur, bukan sekadar “membaik”.","SOAP: S (kata pengguna), O (hasil pengamatan), A (penilaian), P (rencana)."]},{"h":"Pengumpulan informasi dan ADL/IADL","p":["Informasi untuk 介護過程 dibagi menjadi 主観的情報 (yang dikatakan pengguna) dan 客観的情報 (yang diamati). Dari analisis informasi lahir 生活課題 dan ニーズ, termasuk kebutuhan tersembunyi (潜在的ニーズ) yang belum diucapkan."],"l":["ADL: kegiatan dasar seperti makan, mandi, berpakaian, buang air, berpindah.","IADL: kegiatan lebih kompleks seperti memasak, belanja, mengelola uang, memakai telepon.","Fokus pada kemampuan yang masih ada, bukan hanya yang hilang."]},{"h":"Pemantauan dan penilaian ulang","p":["Setelah rencana berjalan, モニタリング adalah pengamatan berkelanjutan terhadap perubahan kondisi dan hasil perawatan. Bila kondisi berubah atau tujuan tidak tercapai, lakukan 再アセスメント lalu perbaiki rencana."],"l":["Evaluasi menilai tingkat pencapaian tujuan dan kepuasan pengguna.","Rencana layanan (ケアプラン) ditinjau lewat サービス担当者会議 yang dikumpulkan manajer perawatan.","Staf kaigo menyumbang informasi pengamatan sehari-hari ke rapat itu.","Tujuan yang tidak berubah meski kondisi berubah adalah tanda perlu ditinjau."]},{"h":"Profesi terkait dan pembagian peran","p":["Perawatan yang baik butuh banyak profesi (多職種連携), dan staf kaigo perlu tahu siapa mengerjakan apa agar bisa melapor ke orang yang tepat."],"l":["理学療法士 (PT): latihan gerak dasar seperti berdiri dan berjalan.","作業療法士 (OT): gerak terapan dan adaptasi sosial, misalnya makan, berpakaian, dan kegiatan.","言語聴覚士 (ST): bahasa, pendengaran, dan menelan.","管理栄養士: gizi dan menu. 社会福祉士: konsultasi dan akses sistem sosial. 介護支援専門員: menyusun ケアプラン.","Hasil pertemuan tim (ケアカンファレンス) dipakai menyamakan arah perawatan."]},{"h":"Skala kemandirian lansia (寝たきり度 dan 認知症自立度)","p":["障害高齢者の日常生活自立度 membagi tingkat gerak menjadi J (hampir mandiri), A (mandiri di dalam rumah), B (perlu bantuan duduk), dan C (terbaring seharian). 認知症高齢者の日常生活自立度 berjenjang dari I sampai IV dan M."],"l":["J dan A: masih bisa beraktivitas di luar atau di dalam rumah.","B: tidur seharian tetapi bisa duduk; C: tidak bisa bangun dari ranjang.","I: demensia ringan, mandiri; II: ada gejala di luar rumah (IIa) atau di rumah (IIb).","III: butuh perawatan tiap hari (IIIa siang, IIIb malam); IV: sangat bergantung; M: gejala berat butuh penanganan medis."]}],[{"h":"Ciri dan perubahan tubuh","p":["Penuaan alami (生理的老化) bersifat universal, bawaan, progresif, dan cenderung merugikan. Penuaan yang dipercepat penyakit disebut 病的老化."],"l":["Indra: 老眼 (sulit melihat dekat), 白内障 (kabur dan silau), 加齢性難聴 mulai dari nada tinggi, rasa asin kurang terasa.","Otot dan tulang: massa otot menurun (サルコペニア), 骨粗鬆症; 大腿骨頸部骨折 sering membuat tak bisa berjalan.","Jantung dan paru: pembuluh mengeras, tekanan sistolik naik, kapasitas paru menurun.","Kulit kering dan gatal. Lansia mudah dehidrasi karena rasa haus menumpul.","Tidur lebih dangkal dan sering terbangun. Sering berkemih di malam hari.","Fungsi ginjal dan hati menurun sehingga obat mudah menimbulkan efek samping; ポリファーマシー meningkatkan risiko."]},{"h":"Sisi psikologis dan penyakit lansia","p":[],"l":["Erikson: tugas lansia adalah 自我の統合 (menerima hidup sendiri).","喪失体験: kehilangan pasangan, pekerjaan, dan kesehatan memengaruhi jiwa.","老年期うつ: sering tampil sebagai keluhan tubuh, bisa mirip demensia.","Kecerdasan: 流動性知能 menurun, 結晶性知能 cenderung bertahan.","Penyakit umum: 糖尿病, 高血圧, 脳梗塞, 心不全, 変形性膝関節症.","フレイル: tahap rapuh yang masih dapat dipulihkan dengan gizi, gerak, dan kegiatan sosial.","低栄養: waspadai penurunan berat badan; cegah 廃用症候群 dengan mengajak turun dari tempat tidur."]},{"h":"Teori perkembangan","p":["Perkembangan berlangsung seumur hidup. Teori yang sering keluar dalam ujian:"],"l":["Erikson (8 tahap): bayi 基本的信頼, kanak awal 自律性, kanak akhir 自主性, usia sekolah 勤勉性, remaja アイデンティティ, dewasa awal 親密性, dewasa 世代性, lansia 自我の統合.","Piaget: 感覚運動期 (0 sampai 2 tahun), 前操作期 (2 sampai 7), 具体的操作期 (7 sampai 11), 形式的操作期 (sekitar 11 tahun ke atas).","ハヴィガースト: 発達課題, tugas yang perlu diselesaikan pada tiap tahap hidup.","ボウルビィ: 愛着 (attachment), ikatan emosional dengan pengasuh yang menjadi dasar rasa aman.","スキャモンの発育曲線: 神経型 cepat berkembang di masa kecil, リンパ型 puncak di usia sekolah, 一般型 melonjak di bayi dan remaja, 生殖型 di masa remaja."]},{"h":"Tahap hidup dan struktur penduduk","p":[],"l":["Tahap: 新生児期 (sampai 28 hari), 乳児期 (sampai 1 tahun), 幼児期, 学童期, 青年期, 成人期, 老年期.","原始反射 pada bayi (misalnya 把握反射, モロー反射) menghilang seiring perkembangan saraf.","Lansia dibagi 前期高齢者 (65 sampai 74 tahun) dan 後期高齢者 (75 tahun ke atas).","高齢化率: 7 persen 高齢化社会, 14 persen 高齢社会, 21 persen 超高齢社会. Jepang termasuk 超高齢社会.","Dukungan kemandirian lansia menekankan kemampuan yang masih ada, bukan hanya kekurangan."]},{"h":"Penyakit umum pada lansia","p":["Ciri umum: gejala tidak khas, penyakit ganda, mudah menjadi kronis, pemulihan lambat, mudah terjadi 廃用症候群."],"l":["脳血管疾患: 脳梗塞, 脳出血, くも膜下出血. Dapat meninggalkan 片麻痺 dan 失語症.","狭心症: nyeri dada beberapa menit, reda dengan istirahat atau ニトログリセリン. 心筋梗塞: nyeri berat lebih lama (sekitar 15 sampai 30 menit atau lebih) dan tidak reda; segera hubungi 119.","糖尿病: tiga komplikasi utama 網膜症, 腎症, 神経障害. 低血糖: keringat dingin, gemetar, lemas, kesadaran menurun; beri gula atau jus.","高血圧: faktor risiko utama stroke dan penyakit jantung; kurangi garam.","骨粗鬆症: sering pada perempuan pascamenopause. Dukung dengan kalsium, vitamin D, sinar matahari, dan olahraga.","変形性関節症: nyeri sendi lutut dan pinggul akibat kerusakan tulang rawan.","肺炎: pada lansia sering 誤嚥性肺炎 dan gejala demam bisa tidak jelas. COPD: terkait rokok, sesak saat bergerak, 在宅酸素 tidak boleh dekat api.","Mata: 白内障 (kabur dan silau), 緑内障 (lapang pandang menyempit, tekanan bola mata), 加齢黄斑変性 (bagian tengah pandangan menyimpang atau gelap).","前立腺肥大症: pada pria, sulit berkemih, sering berkemih, sisa urine."]},{"h":"Perubahan fisiologis pada lansia","p":["Penuaan membawa perubahan yang wajar, bukan otomatis penyakit. Pendengaran menurun terutama untuk suara bernada tinggi (老人性難聴), sehingga bicara pelan, jelas, dan dengan nada lebih rendah lebih membantu."],"l":["老眼: sulit melihat dekat; 白内障: lensa mata keruh.","サルコペニア: massa dan kekuatan otot menurun.","フレイル: kondisi lemah di antara sehat dan butuh perawatan, masih bisa dipulihkan.","ロコモティブシンドローム: gangguan gerak akibat masalah tulang, sendi, dan otot.","骨粗鬆症: tulang rapuh, risiko patah tulang naik."]},{"h":"Masalah kesehatan umum lansia","p":["Lansia mudah mengalami dehidrasi karena rasa haus menurun. Patah tulang akibat jatuh, terutama 大腿骨頸部骨折, dapat berujung tirah baring panjang dan 廃用症候群 (penurunan fungsi karena jarang bergerak)."],"l":["廃用症候群: otot melemah, sendi kaku, semangat turun, risiko demensia naik.","低栄養: asupan kurang dan berat badan menurun.","夜間頻尿: sering buang air kecil malam hari, ganggu tidur dan menambah risiko jatuh.","Pencegahan: gerak ringan rutin, nutrisi cukup, lingkungan aman."]},{"h":"Ciri khas penyakit pada lansia","p":["Penyakit pada lansia sering tampil tidak seperti pada orang muda. Gejala bisa tidak khas, misalnya radang paru tanpa demam tinggi, sehingga perubahan kecil seperti nafsu makan turun atau lebih sering tidur perlu dianggap sinyal."],"l":["Banyak penyakit sekaligus (複数の疾患) dan banyak obat sekaligus (ポリファーマシー).","Efek samping obat lebih mudah muncul.","Kondisi bisa memburuk cepat dan pemulihannya lebih lama.","Dehidrasi, jatuh, dan infeksi sering menjadi pemicu perburukan."]},{"h":"Kehilangan, pensiun, dan peran sosial pada lansia","p":["Lansia sering mengalami 喪失体験: kehilangan pasangan, kesehatan, pekerjaan, peran, dan penghasilan. Rangkaian kehilangan ini bisa memicu murung, menarik diri, dan penurunan semangat."],"l":["老年期うつ病 sering tampil sebagai keluhan fisik dan bisa mirip demensia (仮性認知症).","Dukung 生きがい: kegiatan bermakna, peran di rumah atau lingkungan, dan pertemuan dengan orang lain.","Dengarkan tanpa menghakimi dan jangan meremehkan kesedihannya.","Tanda bahaya (tidak mau makan, bicara tentang ingin mati) perlu dilaporkan segera."]},{"h":"Contoh perubahan penuaan yang sering diujikan","p":["Hafalkan contoh perubahan fisiologis yang sering muncul. Daya adaptasi gelap (暗順応) menurun, sulit membedakan warna tertentu, dan sensitivitas rasa asin menurun sehingga makanan mudah terlalu asin."],"l":["Keringat dan pengaturan suhu menurun sehingga risiko sengatan panas naik.","Air liur berkurang dan refleks menelan melemah, risiko tersedak naik.","Pendengaran: sulit menangkap nada tinggi dan huruf konsonan.","Cadangan fungsi organ menurun; penyakit ringan bisa cepat memburuk."]}],[{"h":"Gejala dan jenis demensia","p":["Demensia adalah penurunan fungsi otak yang mengganggu kehidupan sehari-hari. Gejalanya dibagi dua: 中核症状 (langsung akibat kerusakan otak) dan 行動・心理症状 BPSD (dipengaruhi lingkungan dan perasaan)."],"l":["中核症状: gangguan ingatan, 見当識障害, 実行機能障害, gangguan penilaian, 失語, 失認, 失行.","BPSD: halusinasi, delusi, gelisah, mengembara, depresi, cemas. Cari penyebab: nyeri, lapar, lingkungan.","アルツハイマー型: ingatan baru hilang sejak awal, progresif perlahan.","血管性認知症: memburuk bertahap seperti tangga, kemampuan tak merata.","レビー小体型: halusinasi visual, gejala Parkinson, kondisi naik-turun.","前頭側頭型: perubahan kepribadian, perilaku berulang.","若年性認知症: mulai sebelum usia 65 tahun.","軽度認知障害 (MCI): fase antara normal dan demensia."]},{"h":"Delirium dan perbedaannya","p":[],"l":["せん妄: timbul mendadak, naik-turun, sering akibat penyakit, obat, atau lingkungan; bisa pulih bila penyebab diatasi.","Demensia berkembang bertahap dan tidak sembuh."]},{"h":"Cara merawat","p":[],"l":["Dekati dari depan, sejajar mata, nada tenang, kalimat pendek dan konkret.","Jangan menyangkal atau memarahi. Terima perasaan di balik ucapan.","バリデーション: menerima dan mengakui perasaan. ユマニチュード: menatap, bicara, menyentuh, membantu berdiri. 回想法: mengenang masa lalu. パーソン・センタード・ケア: berpusat pada pribadi.","Pada halusinasi visual: nyalakan lampu dan cek bersama; atur benda yang bayangannya tampak seperti orang.","Menjelang sore sering gelisah: ciptakan suasana tenang.","Jaga keamanan benda berbahaya dan 異食.","Dukungan: 認知症サポーター, 認知症初期集中支援チーム, 地域包括支援センター."]},{"h":"Perjalanan penyakit dan penilaian","p":[],"l":["Tahap awal: gangguan ingatan baru, menutupi kesalahan, cemas. Tahap tengah: 見当識障害 makin berat, butuh bantuan ADL, BPSD paling menonjol. Tahap lanjut: sulit bicara dan berjalan, 嚥下障害, sering berbaring terus.","Lupa karena usia: lupa sebagian pengalaman, sadar sudah lupa, hidup sehari-hari tidak terganggu. Demensia: lupa seluruh pengalaman, tidak sadar, aktivitas harian terganggu.","Pemeriksaan: 改訂長谷川式 (HDS-R) dan MMSE (skor penuh 30), tes menggambar jam, serta CT atau MRI untuk melihat otak.","Penyebab yang bisa diobati (treatable): 正常圧水頭症 (gangguan jalan, inkontinensia, demensia), 慢性硬膜下血腫 (setelah benturan kepala), 甲状腺機能低下症, kekurangan vitamin B12.","Obat: コリンエステラーゼ阻害薬 (misalnya donepezil) memperlambat gejala pada アルツハイマー型 dan レビー小体型; メマンチン untuk tahap sedang sampai berat. Obat penenang antipsikotik berisiko, terutama pada レビー小体型.","アルツハイマー型: banyak pada perempuan, 海馬 mengecil, ada penumpukan アミロイドβ. 血管性: terkait hipertensi dan stroke, 感情失禁 dan まだら認知症. レビー小体型: 幻視, パーキンソン症状, 起立性低血圧, 転倒, 睡眠中の異常行動. 前頭側頭型: 脱抑制, 常同行動, 食行動の変化 (suka makanan manis)."]},{"h":"Perilaku yang sulit dan cara menanganinya","p":["Selalu cari penyebab dan pemicu: nyeri, lapar, ingin ke toilet, lingkungan baru, atau kebutuhan yang tak tersampaikan."],"l":["徘徊 (berkeliaran) dan 帰宅願望: biasanya ada tujuan atau kebutuhan. Temani, dengarkan, alihkan, jangan menghalangi dengan kunci atau kekang.","物盗られ妄想: merasa barangnya dicuri, sering menuduh orang terdekat. Jangan menyangkal atau berdebat; cari bersama dan terima kecemasannya.","Mandi menolak (入浴拒否): ubah waktu, ubah cara mengajak, pastikan kehangatan, minta bantuan staf yang akrab.","Terbalik siang-malam: perbanyak aktivitas dan sinar matahari siang, kurangi tidur siang panjang.","Gagal mengenali makanan (失認) atau kesulitan menggunakan alat makan (失行): beri satu hidangan sekali, beri contoh, bantu sebagian. Waspadai 異食 dan tersedak.","Inkontinensia karena lupa letak toilet: beri tanda jelas, antar tepat waktu, jangan mempermalukan.","見当識障害: pasang jam dan kalender besar, panggil nama dengan jelas.","リロケーションダメージ: pindah tempat tinggal dapat memperburuk gejala. Bawa barang akrab dan manfaatkan 生活歴 (riwayat hidup) pengguna."]},{"h":"Sistem dukungan demensia","p":[],"l":["Perkembangan kebijakan: オレンジプラン, 新オレンジプラン, 認知症施策推進大綱, lalu 認知症基本法 (berlaku sejak 2024) yang menekankan masyarakat inklusif.","認知症サポーター: warga yang mengikuti kursus singkat (sekitar 90 menit) untuk memahami dan mendukung, tanda khasnya gelang oranye.","認知症初期集中支援チーム: tim ahli yang mengunjungi orang yang diduga demensia (40 tahun ke atas) dan mendukung secara intensif hingga sekitar 6 bulan.","認知症地域支援推進員 dan 認知症ケアパス: menghubungkan layanan setempat dan menunjukkan alur dukungan.","認知症カフェ: tempat berkumpul orang dengan demensia, keluarga, dan warga.","Layanan kaigo: グループホーム (認知症対応型共同生活介護), 認知症対応型通所介護, 小規模多機能型居宅介護.","Dukungan keluarga: レスパイトケア dan 認知症の人と家族の会. Perhatikan 介護うつ pada pengasuh.","Perlindungan hak: 成年後見制度, 日常生活自立支援事業. 若年性認知症 didukung 若年性認知症支援コーディネーター."]},{"h":"Empat jenis utama demensia","p":["Membedakan jenis demensia adalah soal yang sering keluar. Hafalkan ciri khas masing-masing."],"l":["アルツハイマー型: terbanyak, gangguan ingatan jangka pendek, hipokampus menyusut.","血管性認知症: terkait stroke, gejala naik-turun bertahap dan tidak merata (まだら認知症).","レビー小体型: halusinasi visual (幻視) dan gejala mirip Parkinson.","前頭側頭型: perubahan kepribadian dan perilaku berulang (常同行動).","中核症状 (gejala inti seperti lupa) berbeda dengan BPSD (gejala perilaku dan psikologis, bisa dipengaruhi lingkungan)."]},{"h":"Pendekatan perawatan demensia","p":["パーソン・センタード・ケア menempatkan pribadi pengguna sebagai pusat. ユマニチュード mengajarkan empat pilar: 見る, 話す, 触れる, 立つ. バリデーション menerima perasaan pengguna tanpa memaksa kenyataan."],"l":["回想法: mengenang masa lalu untuk menenangkan dan menggali kekuatan.","リアリティ・オリエンテーション: membantu orientasi waktu, tempat, dan orang.","Hindari menyangkal atau memarahi; ajak bicara dengan tenang dan sejajar mata.","Rutinitas yang stabil dan lingkungan yang familiar mengurangi BPSD."]},{"h":"Keselamatan pengguna demensia di rumah dan luar","p":["Pengguna demensia tetap perlu dijaga keselamatannya tanpa mengurung. Prinsipnya: kurangi bahaya di lingkungan, dukung dengan pengawasan yang tidak mencolok, dan libatkan masyarakat sekitar."],"l":["徘徊: pakai 見守り, perangkat pelacak (GPS), dan jaringan warga (SOSネットワーク).","Api dan kompor: gunakan peralatan yang mati otomatis.","Penipuan: pengguna rentan, jadi libatkan keluarga atau 成年後見制度 bila perlu.","Mengemudi: bila terdiagnosis demensia, SIM dapat dicabut atau dihentikan."]},{"h":"Demensia yang bisa membaik bila ditangani","p":["Tidak semua gangguan ingatan adalah demensia degeneratif. Beberapa penyebab dapat membaik bila terdeteksi dan ditangani, sehingga perubahan mendadak perlu dilaporkan agar diperiksa dokter."],"l":["慢性硬膜下血腫: darah terkumpul di bawah selaput otak, sering setelah benturan ringan.","正常圧水頭症: gangguan jalan, gangguan berpikir, dan sulit menahan buang air kecil.","甲状腺機能低下症 dan kekurangan vitamin B12 juga bisa memengaruhi pikiran.","Pengobatan penyebab bisa memperbaiki gejala, jadi jangan menganggap semuanya karena usia."]},{"h":"Obat demensia dan prinsip penanganan gejala","p":["Obat demensia seperti ドネペジル (penghambat kolinesterase) memperlambat perkembangan gejala pada tipe Alzheimer, tetapi tidak menyembuhkan. Untuk BPSD, 非薬物療法 (pendekatan tanpa obat) diutamakan, dan obat antipsikotik dipakai dengan hati-hati karena efek sampingnya."],"l":["Efek samping antipsikotik: kantuk, kaku, mudah jatuh, dan gangguan menelan.","Perubahan perilaku mendadak: periksa dulu nyeri, sembelit, demam, dan efek obat.","Laporkan perubahan kondisi sesudah mulai atau mengganti obat.","Obat hanya diberikan sesuai petunjuk; staf kaigo tidak menentukan dosis."]}],[{"h":"Jenis disabilitas","p":[],"l":["肢体不自由, 視覚障害, 聴覚障害, 内部障害 (jantung, ginjal), 精神障害, 知的障害, 発達障害.","発達障害: ASD (kaku pada perubahan, butuh kejelasan) dan ADHD.","ICF: kerangka melihat fungsi tubuh, aktivitas, partisipasi, faktor lingkungan, dan faktor pribadi.","合理的配慮: penyesuaian wajar untuk menghilangkan hambatan sosial."]},{"h":"Kondisi khusus dan caranya","p":[],"l":["高次脳機能障害: gangguan ingatan, perhatian, eksekutif; gunakan catatan dan rutinitas. 半側空間無視: ajak memperhatikan sisi yang terabaikan.","パーキンソン病: tremor, kaku, gerak lambat, すくみ足, langkah kecil.","ALS: otot melemah bertahap, indra dan kecerdasan sering terjaga.","関節リウマチ: kaku di pagi hari; hangatkan sendi dan pakai 自助具.","脊髄損傷: perhatikan luka tekan dan pengaturan suhu.","Pacu jantung: jauhi magnet kuat.","Skizofrenia: terima rasa takutnya, jangan membenarkan atau menyangkal delusi.","Alat: 補装具 (kursi roda, kaki palsu, alat bantu dengar) dan 日常生活用具."]},{"h":"Dasar hukum dan sistem dukungan","p":["Prinsip utama: ノーマライゼーション (hidup setara di masyarakat) dan inklusi."],"l":["障害者総合支援法: dasar layanan disabilitas. Isinya 介護給付 (kunjungan perawatan, 生活介護, 施設入所支援), 訓練等給付 (自立訓練, 就労移行支援, 就労継続支援, グループホーム), 自立支援医療, 補装具.","障害支援区分: tingkat kebutuhan dukungan, 区分1 sampai 6 (6 paling berat). Ini setara 要介護認定 pada asuransi kaigo.","同行援護: pendamping untuk tunanetra. 行動援護: untuk disabilitas intelektual atau jiwa dengan perilaku berisiko. 重度訪問介護: untuk disabilitas berat yang butuh dukungan lama.","Buku disabilitas: 身体障害者手帳, 療育手帳 (intelektual), 精神障害者保健福祉手帳.","相談支援専門員 menyusun サービス等利用計画, seperti care manager pada asuransi kaigo.","障害者差別解消法: melarang diskriminasi dan mewajibkan 合理的配慮; sejak April 2024 juga mengikat pelaku usaha swasta.","障害者雇用促進法: ada 法定雇用率 (tingkat wajib mempekerjakan penyandang disabilitas).","就労継続支援 A型: ada kontrak kerja dan upah minimum. B型: tanpa kontrak, imbalannya disebut 工賃."]},{"h":"Disabilitas penglihatan, pendengaran, bicara, dan tubuh","p":[],"l":["視覚障害: ada 弱視 dan 全盲. Sebutkan nama saat menyapa, tunjukkan posisi benda dengan クロックポジション, jangan mengganggu 盲導犬 yang sedang bekerja. Alat: 白杖, 点字.","Mengantar tunanetra (手引き): biarkan ia memegang sedikit di atas siku Anda, berjalan setengah langkah di depan.","聴覚障害: 伝音性 (telinga luar atau tengah) masih terbantu 補聴器; 感音性 (telinga dalam atau saraf, termasuk 加齢性難聴) kurang terbantu. Komunikasi: 手話, 筆談, 読話.","失語症: 運動性 (ブローカ) paham tetapi sulit bicara; 感覚性 (ウェルニッケ) lancar bicara tetapi isinya tidak jelas dan sulit paham. Gunakan kalimat pendek, gambar, dan pertanyaan ya atau tidak.","構音障害: otot bicara bermasalah, pelafalan tidak jelas, tetapi pemahaman baik. Beri waktu dan jangan menebak-nebak.","肢体不自由: 片麻痺 (satu sisi), 対麻痺 (kedua kaki), 四肢麻痺 (keempat anggota). 脳性麻痺 terjadi sejak masa perkembangan.","内部障害: jantung (ペースメーカー), ginjal (人工透析), pernapasan, 膀胱直腸 (ストーマ, penggunanya disebut オストメイト). Tidak terlihat dari luar, jadi mudah terlewat."]},{"h":"Disabilitas intelektual, perkembangan, dan jiwa","p":[],"l":["知的障害: kemampuan intelektual dan adaptasi terbatas sejak masa perkembangan. Bicara dengan kalimat pendek, konkret, dan beri contoh.","ダウン症: akibat trisomi kromosom 21. Sering disertai kelainan jantung bawaan dan lebih awal mengalami tanda penuaan atau demensia.","ASD: sulit membaca isyarat sosial, minat sempit, peka terhadap suara atau cahaya. Beri jadwal tetap, kabari bila ada perubahan, gunakan kata konkret atau gambar.","ADHD: sulit memusatkan perhatian, hiperaktif, impulsif. LD (学習障害): sulit membaca, menulis, atau berhitung padahal kecerdasan umum normal.","統合失調症: 陽性症状 (halusinasi, waham) dan 陰性症状 (kehilangan motivasi, emosi datar). Terima rasa takutnya, jangan membenarkan atau menyangkal isi waham. Obat harus diminum teratur.","うつ病: jangan terlalu menyemangati dengan “ayo semangat”; dukung istirahat dan perhatikan tanda pikiran bunuh diri.","依存症 (misalnya alkohol): penyakit, bukan kelemahan karakter. Kelompok swabantu seperti 断酒会 membantu pemulihan."]},{"h":"Penerimaan disabilitas dan dukungan keluarga","p":[],"l":["障害受容: proses menerima disabilitas, kira-kira berjalan dari syok, penyangkalan, kebingungan, upaya mengatasi, sampai penerimaan. Tahapnya tidak selalu berurutan dan tiap orang berbeda.","Hargai perasaan yang bersangkutan, jangan memaksa menerima.","ピアサポート dan セルフヘルプグループ: dukungan dari sesama pengalaman.","レスパイトケア: layanan yang memberi keluarga pengasuh waktu istirahat.","権利擁護: 成年後見制度 membantu orang dengan kemampuan menilai terbatas dalam harta dan kontrak."]},{"h":"Dukungan dan akomodasi bagi penyandang disabilitas","p":["Dasar sistem dukungan di Jepang adalah 障害者総合支援法. Lewat 障害者差別解消法, penyedia layanan wajib memberi 合理的配慮 (penyesuaian yang wajar) agar penyandang disabilitas setara dalam mengakses layanan."],"l":["Tiga buku: 身体障害者手帳, 療育手帳 (intelektual), 精神障害者保健福祉手帳.","補助犬: 盲導犬, 聴導犬, 介助犬.","Alat bantu: 白杖 (tongkat putih), 点字, 補聴器, 車いす.","Komunikasi dengan tunarungu: tulisan, bahasa isyarat, gerak bibir yang jelas."]},{"h":"Model disabilitas dan desain inklusif","p":["Model medis memandang masalah ada pada tubuh individu; model sosial memandang hambatan terutama berasal dari lingkungan dan sikap masyarakat. ICF menggabungkan keduanya dan menekankan faktor lingkungan."],"l":["バリアフリー: menghapus hambatan yang sudah ada.","ユニバーサルデザイン: dirancang sejak awal agar bisa dipakai semua orang.","二次障害: masalah lanjutan akibat disabilitas, misalnya nyeri sendi atau depresi.","Dukungan perlu melihat lingkungan dan peran pengguna di masyarakat."]},{"h":"Penyakit saraf: Parkinson, ALS, dan cedera tulang belakang","p":["パーキンソン病 punya empat gejala utama: 安静時振戦 (gemetar saat diam), 筋固縮 (otot kaku), 無動 (gerak lambat), dan 姿勢反射障害 (mudah goyah). Bila langkah terhenti (すくみ足), garis di lantai atau aba-aba ritme membantu."],"l":["ALS (筋萎縮性側索硬化症): otot melemah progresif, tetapi kesadaran dan indera biasanya tetap baik.","脊髄損傷: lumpuh kaki (対麻痺) atau empat anggota gerak (四肢麻痺) sesuai letak cedera.","Dukungan mencakup posisi, pencegahan luka tekan, dan komunikasi yang sabar.","Selalu tanyakan kebutuhan pengguna, karena kondisinya berbeda-beda."]},{"h":"Autisme, ADHD, dan gangguan belajar","p":["発達障害 bukan akibat pola asuh atau kemalasan, melainkan perbedaan perkembangan otak. Dukungan terbaik menyesuaikan lingkungan dan cara berkomunikasi, bukan memaksa pengguna berubah."],"l":["自閉スペクトラム症 (ASD): kesulitan komunikasi sosial, kebiasaan yang kaku (こだわり), dan peka terhadap suara atau cahaya.","ADHD: sulit memusatkan perhatian, terlalu aktif, dan impulsif.","学習障害 (LD): kesulitan membaca, menulis, atau berhitung walau kecerdasan umum baik.","Beri instruksi jelas dan satu per satu; gunakan gambar atau tulisan bila membantu."]},{"h":"Klasifikasi dukungan disabilitas (障害支援区分)","p":["障害支援区分 menunjukkan tingkat kebutuhan dukungan bagi penyandang disabilitas, terdiri atas 区分1 sampai 区分6. Semakin besar angkanya, semakin banyak dukungan yang dibutuhkan."],"l":["自立支援給付 mencakup 介護給付 dan 訓練等給付.","就労移行支援: latihan menuju kerja umum. 就労継続支援: tempat kerja bagi yang sulit bekerja di perusahaan biasa (tipe A dengan kontrak kerja, tipe B tanpa).","共同生活援助 (グループホーム): tempat tinggal bersama dengan dukungan.","Dukungan disesuaikan dengan kebutuhan, bukan hanya jenis disabilitas."]}],[{"h":"Kebutuhan dan tanda vital","p":[],"l":["Maslow: fisiologis, keselamatan, kasih sayang dan keanggotaan, pengakuan, aktualisasi diri.","Nadi dewasa 60 sampai 100 per menit, napas 12 sampai 20 per menit. Suhu lansia cenderung lebih rendah.","Tekanan darah: manset sejajar jantung. Tekanan sistolik naik karena usia.","Lansia mudah dehidrasi: mulut kering, kulit kurang elastis, urine pekat."]},{"h":"Menelan, mencerna, dan buang air","p":[],"l":["Lima tahap menelan: 先行期, 準備期, 口腔期, 咽頭期, 食道期. 喉頭蓋 menutup jalan napas saat menelan.","Air liur membantu mencerna dan membersihkan mulut.","Buang air besar: tinja di rektum memicu rasa ingin buang air. Cegah sembelit dengan serat, air, gerak.","Tinja hitam: curiga perdarahan saluran cerna, lapor perawat.","Ginjal membuat urine dan membuang limbah."]},{"h":"Tidur, saraf, dan gerak","p":[],"l":["Tidur: ritme sekitar 24 jam (概日リズム), レム睡眠 (bermimpi) dan ノンレム.","交感神経: siaga, jantung cepat. 副交感神経: istirahat dan pencernaan.","Sendi: ketidakaktifan menyebabkan 拘縮 dan 廃用症候群; gerakkan sendi pelan.","浮腫: naikkan kaki dan amati; lapor bila berat.","Tulang: kalsium, vitamin D, sinar matahari."]},{"h":"Organ dalam dan peredaran","p":[],"l":["Jantung 4 ruang. 体循環: dari jantung ke seluruh tubuh dan kembali. 肺循環: dari jantung ke paru dan kembali; di sini arteri paru membawa darah miskin oksigen.","Darah: 赤血球 (membawa oksigen lewat ヘモグロビン), 白血球 (kekebalan), 血小板 (menghentikan perdarahan), 血漿 (cairan).","Pernapasan: pertukaran gas terjadi di 肺胞; 横隔膜 membantu menarik napas.","Pencernaan: mulut, 食道, 胃, 十二指腸, 小腸 (penyerapan zat gizi), 大腸 (penyerapan air), 直腸, 肛門.","肝臓 membuat 胆汁, menetralkan racun, dan menyimpan gula. 胆嚢 menyimpan dan memekatkan 胆汁. 膵臓 membuat 膵液 dan インスリン.","Kemih: 腎臓, 尿管, 膀胱, 尿道. Uretra perempuan lebih pendek sehingga mudah terkena 膀胱炎. Urine dewasa sekitar 1000 sampai 1500 mL per hari, berkemih sekitar 5 sampai 7 kali.","インスリン menurunkan gula darah; kekurangannya menyebabkan 糖尿病."]},{"h":"Saraf, panca indera, dan gerak","p":[],"l":["Susunan saraf pusat: otak dan 脊髄. 大脳: 前頭葉 (gerak, berpikir), 頭頂葉 (sensasi), 側頭葉 (pendengaran, ingatan, 海馬), 後頭葉 (penglihatan). 小脳: keseimbangan dan koordinasi. 脳幹: pusat napas dan peredaran.","Bahasa umumnya di otak kiri. Lesi otak kiri menyebabkan lumpuh sisi kanan karena jalur saraf menyilang, sering disertai 失語症.","Mata: 水晶体 kehilangan daya akomodasi (老眼). 白内障: 水晶体 keruh. 緑内障: tekanan bola mata merusak saraf.","Telinga: telinga luar, tengah, dalam. 蝸牛 untuk pendengaran, 三半規管 untuk keseimbangan. Pendengaran frekuensi tinggi menurun lebih dulu.","Indra pengecap menurun karena 味蕾 berkurang, sehingga lansia cenderung menambah garam.","Otot: 骨格筋 (sadar), 心筋 dan 平滑筋 (tidak sadar). Sendi: 球関節 (bahu, panggul), 蝶番関節 (siku).","関節可動域 (ROM): 屈曲, 伸展, 外転, 内転, 外旋, 内旋.","Patah tulang sering pada lansia: 大腿骨頸部, 脊椎圧迫骨折, 橈骨遠位端, 上腕骨近位端."]},{"h":"Jiwa, ingatan, dan kondisi tubuh lansia","p":[],"l":["防衛機制: 抑圧, 合理化, 退行 (kembali seperti anak), 投影, 昇華, 反動形成, 逃避, 否認, 代償.","Ingatan: 感覚記憶, 短期記憶, 長期記憶. Jangka panjang: エピソード記憶, 意味記憶, 手続き記憶. Pada usia lanjut ingatan baru menurun, tetapi 手続き記憶 relatif terjaga.","Kecerdasan: 流動性知能 (kecepatan memproses, menghafal) menurun, 結晶性知能 (pengetahuan, pengalaman) bertahan atau naik.","Tidur lansia lebih dangkal, mudah terbangun, sering 早朝覚醒. Perhatikan lingkungan tidur dan jangan mudah memberi obat tidur.","Suhu tubuh lansia mudah menurun dan tidak peka terhadap panas.","ヒートショック: perubahan tekanan darah akibat selisih suhu ruang dan kamar mandi. Hangatkan ruang ganti, air sekitar 41 derajat atau kurang, berendam singkat.","Kematian dan tubuh: 死後硬直 mulai sekitar 2 sampai 3 jam setelah kematian."]},{"h":"Tanda vital dan acuan nilainya","p":["Tanda vital (バイタルサイン) adalah suhu, denyut, napas, dan tekanan darah. Perawat perlu paham rentang normal dan perubahan yang harus segera dilaporkan."],"l":["体温 normal dewasa sekitar 36 sampai 37 derajat; lansia cenderung sedikit lebih rendah.","脈拍 normal sekitar 60 sampai 100 kali per menit.","呼吸 normal dewasa sekitar 12 sampai 20 kali per menit.","血圧: tekanan sistolik 140 atau diastolik 90 ke atas disebut tinggi.","Tanda dehidrasi: mulut kering, kulit kurang elastis, urine sedikit dan pekat."]},{"h":"Sistem tubuh dan tidur","p":["Pencernaan berjalan dari mulut, 食道, 胃, 小腸, lalu 大腸. 腎臓 menyaring darah dan membentuk urine yang ditampung di 膀胱. Pada lansia tidur menjadi lebih dangkal dan bangun lebih awal."],"l":["レム睡眠: tidur dengan otak aktif dan sering bermimpi.","ノンレム睡眠: tidur lelap; porsinya menurun pada lansia.","Napas: saat menarik napas, diafragma turun dan paru mengembang.","Peredaran: darah dari 左心室 mengalir lewat 大動脈 ke seluruh tubuh."]},{"h":"Diabetes dan komplikasinya","p":["糖尿病 terjadi karena kerja インスリン kurang. Gula darah rendah (低血糖) muncul dengan keringat dingin, tangan gemetar, jantung berdebar, bahkan penurunan kesadaran; perlu segera asupan gula atau glukosa dan lapor ke perawat."],"l":["Gula darah tinggi: haus, sering buang air kecil, mudah lelah.","Tiga komplikasi utama: 網膜症, 腎症, 神経障害.","Pada pengguna diabetes, periksa kaki dan perhatikan luka yang lama sembuh.","Atur makan dan obat sesuai petunjuk; jangan menghentikan sendiri."]},{"h":"Tulang, sendi, otot, dan kontraktur","p":["Tulang lansia lebih rapuh (骨粗鬆症), sehingga jatuh ringan dapat menyebabkan patah tulang pinggul (大腿骨頸部骨折). Bila sendi lama tidak digerakkan, terjadi 拘縮 (sendi kaku dan sulit diluruskan)."],"l":["Pencegahan kontraktur: gerakkan sendi ringan secara berkala dan jaga posisi yang baik.","廃用性筋萎縮: otot mengecil karena jarang dipakai.","変形性膝関節症: sendi lutut aus, nyeri saat berdiri dan berjalan.","Jangan memaksa gerakan melebihi batas nyeri."]},{"h":"Darah, hormon, dan kekebalan","p":["Darah terdiri atas 赤血球 (membawa oksigen), 白血球 (melawan kuman), 血小板 (membantu pembekuan), dan 血漿. Kadar hemoglobin yang rendah menyebabkan 貧血, dengan gejala pucat, mudah lelah, dan pusing."],"l":["ホルモン: zat pengatur dari kelenjar; インスリン dibuat di 膵臓 untuk menurunkan gula darah.","甲状腺ホルモン memengaruhi metabolisme dan suhu tubuh.","Kekebalan menurun pada lansia sehingga mudah terkena infeksi.","Perubahan warna kulit, memar mudah, dan lelah berkepanjangan perlu dilaporkan."]}],[{"h":"Landasan hukum dan peran","p":["Tindakan medis (医行為) pada prinsipnya hanya oleh dokter dan perawat. Pengecualian: pemberi perawatan yang memenuhi syarat dapat melakukan喀痰吸引等 dan 経管栄養 di bawah instruksi dokter."],"l":["Syarat: pelatihan, status 認定特定行為業務従事者 atau 介護福祉士 terdaftar, institusi terdaftar, 主治医の指示書, dan kerja sama dengan 看護職員.","Yang bukan wewenang: memasukkan atau mengganti selang, mengganti kanul, dan hal lain di luar daftar.","Tidak termasuk 医行為: mengukur suhu dengan termometer, tekanan darah, dan memasang pulse oximeter."]},{"h":"Menyedot dahak","p":[],"l":["Lokasi: dalam mulut, hidung, dan kanul trakea (tidak melewati ujung kanul).","Satu kali sekitar 10 sampai 15 detik. Tekanan sesuai petunjuk, jangan terlalu kuat.","清潔操作: cuci tangan, sarung tangan, selang bersih. Bedakan 消毒 (kurangi kuman) dan 滅菌 (steril).","Amati: warna, kekentalan, jumlah dahak, SpO2, napas, wajah.","Bibir atau kuku biru (チアノーゼ): hentikan, lapor perawat segera."]},{"h":"Nutrisi lewat selang","p":[],"l":["Jenis: 胃ろう, 腸ろう, 経鼻. Pastikan posisi duduk atau setengah duduk.","Cairan pada suhu ruang dan diberikan perlahan. 半固形化栄養剤 mengurangi refluks dan diare.","Setelah selesai, tetap tegak sekitar beberapa saat.","Muntah, batuk, atau sesak saat pemberian: hentikan dan hubungi perawat.","Amati kulit sekitar 胃ろう: kemerahan, pendarahan, kebocoran, lalu laporkan.","Cegah infeksi dan catat setiap tindakan."]},{"h":"Latar hukum dan pelatihan","p":[],"l":["Dasar: perubahan 社会福祉士及び介護福祉士法. 介護福祉士 yang menyelesaikan pelatihan dapat melakukan 喀痰吸引等 dan 経管栄養 sebagai bagian dari praktik.","Jenis pelatihan: 第1号 dan 第2号 (untuk banyak pengguna tak tertentu, dengan 基本研修 dan 実地研修), 第3号 (untuk pengguna tertentu, misalnya di 重度訪問介護). Hanya tindakan yang dilatih yang boleh dilakukan.","Institusi harus terdaftar sebagai 登録喀痰吸引等事業者 atau 登録特定行為事業者 dan bekerja sama dengan 看護職員.","Sebelum tindakan: pastikan 指示書, persetujuan pengguna atau keluarga, kondisi hari itu, dan nama pengguna. Sesudahnya: laporkan dan catat.","Yang tidak boleh dilakukan pekerja perawatan: memasukkan selang ke hidung, mengganti selang 胃ろう, mengganti 気管カニューレ, dan memeriksa letak selang hidung (dilakukan perawat)."]},{"h":"Dasar pernapasan dan pencernaan","p":[],"l":["Jalur napas: 鼻腔, 咽頭, 喉頭, 気管, 気管支, 肺. Makanan lewat 食道. 喉頭蓋 menutup saluran napas saat menelan.","気管支 kanan lebih pendek, lebar, dan lurus, sehingga benda yang teraspirasi lebih mudah masuk ke kanan.","Napas dewasa istirahat sekitar 12 sampai 20 kali per menit. SpO2 normal sekitar 96 persen ke atas.","Tanda sesak: 肩呼吸, 陥没呼吸, 鼻翼呼吸, チアノーゼ, tidak bisa bicara panjang.","Dahak kuning atau hijau dapat menandakan infeksi; laporkan perubahan warna, kekentalan, dan jumlah.","気管切開 mempermudah penyedotan tetapi menyulitkan bicara. 人工呼吸器 dan 在宅酸素 mengikuti petunjuk dokter, jauhkan dari api.","Menelan dibagi 5 fase: 先行期, 準備期, 口腔期, 咽頭期, 食道期. Gangguan menelan menyebabkan 誤嚥性肺炎, jadi 口腔ケア penting.","Komplikasi pemberian lewat selang: 誤嚥, 下痢 (kecepatan, suhu, kepekatan), 便秘, 胃食道逆流, peradangan di sekitar stoma, 事故抜去, 脱水."]},{"h":"Pencegahan infeksi dan keadaan darurat","p":[],"l":["Tekanan penyedotan paling tinggi sekitar 20 kPa (150 mmHg); tekanan terlalu tinggi melukai mukosa. Beri jeda antara penyedotan agar napas pulih.","Bedakan 清潔 dan 不潔: tangan dan sarung tangan bersih, selang disimpan dengan cara yang benar (浸漬法 atau 乾燥法), wadah dibilas dan didesinfeksi sesudah dipakai.","Sebelum 経管栄養: periksa nama pengguna, jenis dan tanggal kedaluwarsa nutrisi, suhu, jumlah, kecepatan, serta posisi tegak.","Keadaan darurat penyedotan: perdarahan, bibir atau kuku biru, SpO2 turun, tersedak. Hentikan dan hubungi perawat atau dokter, lalu 119 bila perlu.","Keadaan darurat 経管栄養: muntah, sesak, nyeri perut, wajah pucat, atau selang terlepas. Hentikan pemberian, jangan memasukkan selang lagi, hubungi perawat.","気管カニューレ terlepas: segera hubungi perawat atau 119.","Catat 事故 dan ヒヤリハット, lalu bahas bersama untuk mencegah terulang."]},{"h":"Pencegahan infeksi dasar","p":["標準予防策 (スタンダードプリコーション) menganggap darah, cairan tubuh, dan kotoran semua orang berpotensi menular, sehingga perlindungan dilakukan pada semua pengguna, bukan hanya yang sakit."],"l":["Cuci tangan adalah langkah paling dasar, sebelum dan sesudah kontak.","Sarung tangan diganti untuk tiap pengguna dan tiap tindakan.","Jalur penularan: 接触, 飛沫, 空気.","消毒 mematikan sebagian kuman; 滅菌 mematikan semua mikroorganisme.","Tindakan medis seperti menyedot dahak dan nutrisi selang hanya boleh dilakukan sesuai syarat pelatihan dan petunjuk dokter."]},{"h":"Batas tindakan medis oleh 介護福祉士","p":["喀痰吸引 dan 経管栄養 hanya boleh dilakukan 介護福祉士 setelah menjalani pelatihan praktik dan terdaftar sebagai 認定特定行為業務従事者, dengan petunjuk dokter dan kerja sama perawat."],"l":["Penyedotan dahak terbatas pada 口腔内, 鼻腔内, dan bagian dalam 気管カニューレ.","Nutrisi selang: lewat 胃ろう, 腸ろう, atau selang hidung; memasang selang hidung bukan tugas介護職.","Satu kali penyedotan sekitar 10 detik; amati warna wajah dan napas.","Hentikan dan laporkan segera bila ada tanda tidak wajar."]},{"h":"Persiapan dan pencatatan tindakan medis","p":["Tindakan medis oleh staf kaigo selalu bertumpu pada petunjuk dokter dan kerja sama perawat. Sebelum mulai, cuci tangan dan periksa kondisi pengguna; selama dan sesudah, amati dan catat."],"l":["Nutrisi selang: duduk setengah tegak sebelum dan beberapa puluh menit sesudah untuk mencegah aliran balik.","Bila ada batuk, muntah, atau sesak saat nutrisi, hentikan dan segera hubungi perawat.","Kecepatan, jumlah, dan suhu cairan mengikuti petunjuk yang tertulis.","Catat waktu, kondisi, dan hal tak biasa, lalu laporkan sesuai alur."]},{"h":"Keadaan darurat saat tindakan medis","p":["Bila saat tindakan terjadi hal tak biasa, prinsipnya: hentikan tindakan, amankan pengguna, dan segera hubungi perawat atau dokter sesuai petunjuk. Jangan melanjutkan atau memperbaiki sendiri."],"l":["Saat penyedotan: perdarahan, bibir membiru (チアノーゼ), atau napas memburuk berarti hentikan.","Saat nutrisi selang: muntah atau tersedak berarti hentikan dan miringkan badan pengguna.","Bila selang lambung tercabut (自己抜去), jangan dimasukkan kembali; segera hubungi tenaga medis.","Catat kejadian, waktu, dan tindakan yang diambil."]},{"h":"Merawat sekitar stoma dan trakeostomi","p":["Kulit di sekitar 胃ろう (stoma lambung) dijaga bersih dan kering. Perhatikan kemerahan, bengkak, perdarahan, bau, atau cairan yang bocor, dan segera laporkan kepada perawat."],"l":["気管切開: pengguna bicara lewat cara khusus; bahasa tubuh dan tulisan membantu komunikasi.","Lendir yang mengering dapat menyumbat kanul; kelembapan udara perlu dijaga.","Jangan menarik atau memutar selang secara paksa.","Catat tampilan kulit dan kebocoran pada tiap perawatan."]}],[{"h":"Menjawab soal kasus","p":["Ujian asli memuat empat kasus, masing-masing tiga soal, yang menggabungkan beberapa bidang. Bacalah kasusnya dulu, tandai siapa, kondisi, dan masalahnya."],"l":["Pilih jawaban yang menghormati keinginan pengguna dan kemampuan yang tersisa.","Hindari pilihan yang menyangkal, membentak, mengekang, atau mengambil alih semuanya.","Gejala baru atau memburuk: amati, catat, lapor perawat atau atasan.","Pilihan 'selalu', 'pasti', 'tidak pernah' sering salah."]},{"h":"Infeksi dan darurat","p":[],"l":["標準予防策: semua darah dan cairan tubuh dianggap berpotensi menular. Cuci tangan dengan 手指衛生.","Jalur: kontak (疥癬, MRSA, ノロ), droplet (インフルエンザ), udara (結核).","ノロウイルス: sarung tangan dan masker, bersihkan dengan 次亜塩素酸ナトリウム.","一次救命処置: cek respons, panggil bantuan dan 119, AED, 胸骨圧迫 sekitar 5 cm, 100 sampai 120 kali per menit.","窒息: dorong batuk, tepuk punggung bila perlu. 熱中症: minum sedikit-sedikit, atur suhu."]},{"h":"Mutu layanan dan bencana","p":[],"l":["個人情報保護: gunakan sesuai tujuan, tidak diberikan tanpa persetujuan.","苦情解決: terima, verifikasi, perbaiki bersama.","リスクマネジメント dan ヒヤリハット: cari penyebab, bukan menghukum.","Dugaan penganiayaan: lapor ke pemerintah kota.","看取り: kenyamanan, kebersihan, dukungan keluarga, dan グリーフケア bagi keluarga dan staf.","福祉避難所 untuk yang butuh dukungan khusus; BCP menjaga layanan saat bencana atau wabah."]},{"h":"Pola kasus yang sering muncul","p":["Kenali pola, lalu pilih jawaban yang selaras dengan prinsip dukungan."],"l":["Demensia dengan cemas, halusinasi, atau berkeliaran: jangan menyangkal, terima perasaannya, cari pemicunya, atur lingkungan (cahaya, barang), jaga keselamatan, lalu catat dan lapor.","Hemiplegia atau pasca stroke: dahulukan sisi yang sehat, dorong ADL sendiri, sesuaikan alat bantu, perhatikan posisi pendamping, jangan menarik lengan yang lumpuh.","Artritis reumatoid atau gangguan gerak tangan: sesuaikan alat (gagang tebal), kerjakan pada waktu mudah bergerak, bagi bagian yang berat, hormati keinginan memasak sendiri.","Cedera tulang belakang dan kursi roda: cegah luka tekan (push-up, ganti posisi, bantalan), dukung keinginan bekerja lewat lembaga dukungan kerja.","Gejala infeksi di fasilitas (muntah, diare): sarung tangan dan masker, cuci tangan, disinfeksi dengan natrium hipoklorit, cegah dehidrasi, lapor ke perawat atau atasan.","Akhir hidup: kenyamanan, kebersihan, dengarkan kecemasan keluarga, sertakan keluarga dalam apa yang bisa dilakukan, dukungan duka sesudahnya.","Pengguna menolak: cari alasan di balik penolakan, tawarkan pilihan, jangan memaksa, ulangi dengan waktu dan cara berbeda.","Staf baru mengambil alih pekerjaan pengguna: itu melanggar dukungan kemandirian; ajarkan menghormati kemampuan dan ritme pengguna."]},{"h":"Strategi menjawab tiap soal","p":[],"l":["Baca kata kunci: “paling tepat”, “pertama kali”, “sesuai pernyataan yang benar”. Bila dua pilihan terlihat benar, pilih yang lebih awal secara urutan atau lebih mendasar.","Prioritas: keselamatan, keinginan pengguna, kemandirian, kerja sama tim, fakta di atas dugaan.","Singkirkan pilihan yang memaksa, membentak, menyerahkan semuanya kepada staf, atau memakai kata mutlak (selalu, pasti, tidak pernah).","Staf perawatan tidak mengambil keputusan medis sendiri. Bila ada perubahan kondisi: amati, catat, lapor ke perawat atau atasan.","Informasi pribadi tidak dibagikan tanpa persetujuan, termasuk kepada keluarga jauh atau di media sosial.","Soal kasus: tentukan siapa, kondisi apa, masalah apa, lalu cocokkan dengan pola di atas sebelum membaca pilihan."]},{"h":"Kerja sama tim dan keselamatan staf","p":[],"l":["報告・連絡・相談 (ホウレンソウ): laporkan fakta secara singkat dan tepat waktu, mulai dari kesimpulan.","多職種連携: berbagi informasi dengan dokter, perawat, terapis, care manager, dan keluarga, dengan tetap menjaga rahasia.","ボディメカニクス: buka kaki selebar bahu, pusat gravitasi rendah, dekatkan tubuh ke pengguna, pakai otot besar, jangan memutar pinggang, geser atau tarik lebih baik daripada mengangkat.","腰痛予防: jangan membungkuk dengan lutut lurus; ukur dan atur ketinggian tempat tidur.","Kelelahan emosional (燃え尽き症候群): bicarakan beban dengan rekan atau atasan, manfaatkan sistem dukungan di tempat kerja.","Keselamatan: cegah jatuh (jalan bebas rintangan, penerangan), tersedak (bentuk makanan dan posisi), dan kebakaran (jalur evakuasi, latihan berkala)."]},{"h":"Strategi cepat untuk soal kasus","p":["Soal kasus biasanya menguji sikap dasar. Jawaban yang tepat umumnya menghormati keinginan pengguna, memperhatikan keselamatan, dan melibatkan tim."],"l":["Waspadai pilihan dengan kata mutlak seperti 必ず dan すべて; biasanya salah.","Utamakan keselamatan lebih dulu, lalu tanyakan keinginan pengguna.","Hindari memutuskan sendiri; laporkan, konsultasikan, dan bagikan informasi ke tim (多職種連携).","Pilihan yang memaksa atau meniadakan pilihan pengguna biasanya bukan jawaban benar."]},{"h":"Membaca soal dan mengatur waktu","p":["Perhatikan kata kunci di soal: 最も適切なもの (paling tepat) berbeda dengan 不適切なもの (yang tidak tepat). Soal 総合問題 menggabungkan beberapa kelompok, jadi cari dulu inti masalahnya."],"l":["Jawab dulu soal yang yakin, tandai yang ragu, kembali di akhir.","Coret pilihan yang jelas salah untuk menyempit.","Dua pilihan mirip: pilih yang lebih menghormati pengguna dan lebih aman.","Sisakan waktu untuk memeriksa soal yang diberi tanda."]},{"h":"Laporan insiden dan pencegahan ulang","p":["Kecelakaan ringan dan kejadian nyaris celaka (ヒヤリハット) dicatat agar bisa dicegah ulang. Menurut hukum Heinrich, di balik satu kecelakaan berat ada sekitar 29 kecelakaan ringan dan 300 kejadian nyaris celaka."],"l":["Tujuan laporan adalah mencari penyebab dan memperbaiki sistem, bukan mencari siapa yang salah.","Laporkan secepat mungkin dan sejujur mungkin.","Analisis sebab: manusia, peralatan, lingkungan, dan cara kerja.","Soal kasus: urutan umumnya keselamatan dulu, lalu amati, lapor, dan catat."]},{"h":"Penanganan muntah dan norovirus","p":["Muntahan dan kotoran dari pasien norovirus sangat menular. Gunakan sarung tangan sekali pakai, masker, dan celemek, buka ventilasi, lalu bersihkan dengan kertas dari arah luar ke dalam agar tidak menyebar."],"l":["Alkohol kurang efektif terhadap norovirus; gunakan larutan 次亜塩素酸ナトリウム untuk disinfeksi.","Buang kertas, sarung tangan, dan celemek ke kantong tertutup.","Cuci tangan dengan sabun dan air mengalir setelahnya.","Pisahkan pengguna yang bergejala dan laporkan ke atasan dan perawat."]},{"h":"Kesehatan dan keselamatan kerja staf","p":["Keselamatan staf bagian dari mutu layanan. Pedoman pencegahan nyeri pinggang menetapkan bahwa mengangkat pengguna hanya dengan tenaga manusia pada prinsipnya tidak dilakukan; manfaatkan alat bantu seperti lift dan papan geser."],"l":["ストレスチェック wajib dilakukan setahun sekali di tempat kerja dengan 50 pekerja tetap atau lebih.","Nyeri pinggang: gunakan ボディメカニクス, kerja berdua bila perlu, dan atur ketinggian ranjang.","Vaksinasi dan pemeriksaan kesehatan berkala melindungi staf dan pengguna.","Laporkan kekerasan atau pelecehan dari pengguna kepada atasan."]}]];
