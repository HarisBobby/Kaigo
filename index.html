Object.assign(TRS,{"4":["Syarat pengecualian pengekangan fisik adalah 切迫性, 非代替性, dan satu lagi. Apa itu?",["Ekonomis","Kepraktisan","Sementara (一時性)","Berkelanjutan","Kebiasaan"]],"7":["Manakah sikap yang tepat tentang dukungan kemandirian oleh pekerja perawatan?",["Mengerjakan juga hal yang bisa dilakukan sendiri","Mengawasi hal yang bisa dilakukan sendiri dan membantu bagian yang diperlukan","Hanya mengutamakan keinginan keluarga","Mengutamakan efisiensi","Membatasi kegiatan demi menghindari bahaya"]],"9":["Manakah sikap yang tepat saat mendengarkan?",["Memotong pembicaraan dan memberi nasihat","Mengangguk dan mendengarkan dengan menerima","Segera mengisi keheningan","Memaksa cepat menyimpulkan","Mendengarkan sambil melihat jam"]],"14":["Manakah yang tepat untuk mencegah sindrom disuse (penurunan fungsi karena kurang bergerak)?",["Terus beristirahat","Turun dari tempat tidur dan beraktivitas sejauh memungkinkan","Mengurangi jumlah makan","Tidak mengeluarkan dari kamar","Menghindari rangsangan"]],"20":["Manakah urutan pengembangan proses perawatan yang tepat?",["Pelaksanaan, evaluasi, penyusunan rencana, asesmen","Asesmen, penyusunan rencana, pelaksanaan, evaluasi","Penyusunan rencana, asesmen, evaluasi, pelaksanaan","Evaluasi, pelaksanaan, asesmen, penyusunan rencana","Pelaksanaan, asesmen, evaluasi, penyusunan rencana"]],"21":["Manakah pernyataan tentang asesmen yang tepat?",["Hanya memperhatikan hal yang tidak bisa dilakukan","Mengumpulkan informasi termasuk kekuatan dan semangat pengguna","Menilai hanya dari informasi keluarga","Mengutamakan kenyamanan staf","Menentukan masalah berdasarkan prasangka"]],"22":["Manakah cara menetapkan target rencana perawatan yang tepat?",["Abstrak dan tanpa batas waktu","Konkret dan pencapaiannya dapat dievaluasi","Ditentukan hanya oleh keinginan staf","Tidak disampaikan kepada pengguna","Hanya menetapkan target jangka panjang"]],"24":["Kasus: Ibu A (82 tahun, perempuan) mengalami hemiplegia kanan akibat stroke. Belakangan ia sering tidak sempat ke toilet sehingga mengompol, dan mulai menghindari bepergian. Manakah sikap yang paling tepat dari pekerja perawatan?",["Menganjurkan selalu memakai popok","Mencatat pola buang air dan mempertimbangkan waktu mengantar ke toilet","Mengurangi minum agar mengompol berkurang","Menganjurkan agar tidak bepergian","Menyerahkan penanganan hanya kepada keluarga"]],"25":["Kasus: Ibu B (demensia) setiap menjelang sore berkata \"mau pulang\" lalu menuju pintu depan. Manakah sikap yang paling tepat?",["Mengunci pintu depan agar tidak bisa keluar","Terus meyakinkan \"di sinilah rumahnya\"","Menerima perasaannya dan menenangkannya, misalnya dengan berjalan-jalan bersama","Membuatnya tidur dengan obat","Mengamati tanpa menyapa"]],"26":["Kasus: Keluarga yang merawat Tuan C mengeluh kelelahan merawat. Manakah sikap yang paling tepat dari pekerja perawatan?",["Menyemangati agar bertahan","Berkonsultasi dengan care manager dan mempertimbangkan layanan seperti rawat singkat","Segera memutuskan masuk fasilitas","Mengamati tanpa berkata apa pun","Memarahi keluarga"]],"27":["Manakah cara yang tepat menyampaikan posisi benda kepada pengguna dengan gangguan penglihatan?",["Mengatakan \"di sana\" atau \"di sini\"","Mengumpamakan jam dinding dan berkata \"arah jam 3\"","Meletakkan tanpa berkata apa-apa","Memegang tangannya dan memaksa menyentuh","Mengatakan berulang kali dengan suara keras"]],"28":["Manakah cara berbicara yang tepat kepada pengguna dengan gangguan pendengaran?",["Berbicara keras dari belakang","Berbicara pelan dan jelas dari depan agar bibir terlihat","Berbicara cepat dan singkat","Berbicara dengan tetap memakai masker","Berteriak di dekat telinga"]],"29":["Bentuk pertanyaan mana yang membuat pengguna bisa menjawab bebas?",["Pertanyaan tertutup","Pertanyaan terbuka","Pertanyaan mengarahkan","Pertanyaan konfirmasi","Pertanyaan ganda"]],"30":["Manakah perubahan pendengaran karena usia yang benar?",["Suara rendah menjadi sulit didengar lebih dulu","Suara tinggi menjadi sulit didengar lebih dulu","Semua nada menjadi sulit didengar bersamaan","Menjadi lebih mudah mendengar","Hampir tidak berubah"]],"31":["Manakah alasan lansia mudah mengalami dehidrasi yang tepat?",["Karena kadar air tubuh bertambah","Karena rasa haus kurang terasa","Karena fungsi ginjal meningkat","Karena sama sekali tidak berkeringat","Karena jumlah makan bertambah"]],"32":["Manakah tugas perkembangan lansia menurut Erikson yang benar?",["Identitas ego","Keintiman","Generativitas","Integritas ego","Ketekunan"]],"39":["Manakah sikap menjaga martabat pengguna yang tepat?",["Staf menentukan cara menyapa secara sepihak","Memastikan kehendak pengguna lalu menentukan dukungan dengan menghargai keinginannya","Menentukan dukungan hanya berdasarkan keinginan keluarga","Mengutamakan efisiensi kerja","Membatasi gerak walau tidak ada bahaya"]],"40":["Manakah kewajiban menjaga rahasia pekerja perawatan yang benar?",["Tidak perlu dijaga setelah kehilangan sertifikat","Tetap wajib dijaga setelah tidak lagi menjadi pekerja perawatan","Boleh dibicarakan dengan siapa pun selain keluarga","Boleh diunggah di media sosial jika anonim","Boleh dibicarakan apa saja dengan rekan kerja"]],"41":["Manakah ciri sertifikat pekerja perawatan yang benar?",["Monopoli pekerjaan","Monopoli sebutan nama","Pembaruan setiap lima tahun","Boleh melakukan semua tindakan medis","Boleh memakai sebutan tanpa sertifikat"]],"42":["Manakah pernyataan tentang laporan nyaris celaka (hiyari-hatto) yang tepat?",["Dilakukan untuk mencari siapa yang bertanggung jawab","Berbagi kasus dan menganalisis penyebab untuk mencegah kecelakaan","Tidak perlu dilaporkan bila tidak terjadi kecelakaan","Hanya dipakai untuk penilaian pribadi","Cukup lisan tanpa dicatat"]],"51":["Manakah penjelasan monitoring dalam proses perawatan yang tepat?",["Mengumpulkan informasi pengguna untuk pertama kali","Memeriksa secara berkelanjutan pelaksanaan rencana dan pencapaian target","Mendiagnosis penyakit pengguna","Menagih biaya perawatan","Melaksanakan tanpa menyusun rencana"]],"52":["Manakah penjelasan target jangka pendek yang tepat?",["Menunjukkan kehidupan ideal beberapa tahun ke depan","Target bertahap untuk mencapai target jangka panjang","Tidak menetapkan batas waktu","Hanya menulis tugas staf","Tidak dievaluasi"]],"53":["Manakah cara menulis catatan perawatan yang tepat?",["Menulis dugaan dan kesan seolah fakta","Menulis fakta secara objektif dan konkret","Menulis sekaligus beberapa hari kemudian","Menutup kesalahan dengan cairan koreksi","Menulis dengan singkatan yang hanya dimengerti sendiri"]],"57":["Kasus: Bapak D (78 tahun, laki-laki) menderita diabetes dan luka kecil di kaki kanannya sulit sembuh. Saat membantu mandi, pekerja perawatan melihat kemerahan di sekitar luka. Manakah sikap yang paling tepat?",["Mengoleskan obat antiseptik atas keputusan sendiri","Mengamati dan memeriksa lagi saat mandi berikutnya","Mencatat hasil pengamatan dan segera melapor ke perawat","Tidak memberi tahu pengguna","Menghentikan semua mandi mulai sekarang"]],"58":["Kasus: Ibu E (85 tahun, perempuan, kategori perawatan 3) tampak sempoyongan saat ke toilet pada malam hari. Manakah sikap yang paling tepat untuk mencegah jatuh?",["Tidak memberi minum sama sekali pada malam hari","Mengelilingi tempat tidur dengan pagar agar tidak bisa bergerak","Memasang lampu di dekat kaki dan mempertimbangkan toilet portabel","Memaksa memakai popok","Membujuk agar tidak ke toilet"]],"63":["Teknik mana yang mengulang kata lawan bicara apa adanya saat mendengarkan pengguna?",["Pengulangan","Pembujukan","Nasihat","Penyangkalan","Pendesakan"]],"64":["Dalam situasi apa pertanyaan tertutup cocok digunakan?",["Saat ingin ia bercerita bebas tentang perasaannya","Saat ingin memastikan fakta dalam waktu singkat","Saat ingin menggali perasaan pengguna lebih dalam","Saat ingin memahami nilai-nilainya","Saat ingin ia berbicara panjang"]],"65":["Manakah sikap yang tepat terhadap orang dengan afasia motorik?",["Berbicara cepat dan banyak","Memakai pertanyaan yang bisa dijawab ya atau tidak dan menunggu dengan sabar","Mengoreksi setiap salah ucap","Bertanya hanya kepada keluarga","Menjawab menggantikan tanpa menunggu jawaban"]],"66":["Manakah yang termasuk komunikasi nonverbal?",["Ekspresi wajah","Isi percakapan","Tulisan","Kata-kata di telepon","Isi laporan"]],"67":["Manakah pernyataan tentang lapor, hubungi, konsultasi yang tepat?",["Dilewati karena bisa memutuskan sendiri","Menyampaikan fakta dan pendapat sendiri secara terpisah","Menunda kabar buruk","Hanya lisan tanpa catatan","Tidak melapor bila atasan tampak sibuk"]],"68":["Manakah perubahan penglihatan karena usia yang benar?",["Benda dekat menjadi sulit dilihat","Menjadi lebih mudah melihat di tempat gelap","Pembedaan warna menjadi jelas","Lapang pandang melebar","Menjadi tidak mudah silau"]],"69":["Manakah ciri minum obat pada lansia yang tepat?",["Efek samping sulit muncul","Memakai banyak obat membuat efek samping lebih mudah muncul","Efek obat tidak melemah","Boleh menambah dosis atas keputusan sendiri","Fungsi hati dan ginjal tidak berubah"]],"70":["Kondisi mana yang menurunkan massa dan kekuatan otot karena usia?",["Sarkopenia","Luka tekan","Dehidrasi","Kontraktur","Tersedak"]],"71":["Manakah alasan osteoporosis lebih banyak pada perempuan?",["Karena hormon perempuan berkurang setelah menopause","Karena aktivitas lebih banyak dari laki-laki","Karena tidak perlu asupan kalsium","Karena terlalu banyak terkena sinar matahari","Karena tidak ada kaitan dengan usia"]],"72":["Manakah perubahan psikologis yang sering terjadi pada lansia?",["Pengalaman kehilangan seperti kematian pasangan atau teman dapat berujung depresi","Perasaan sama sekali tidak bergerak","Minat pada hal baru pasti meningkat","Tidak lagi merasa kesepian","Kepribadian pasti berubah"]],"79":["Kasus: Bapak F (76 tahun, laki-laki) menjalani rehabilitasi akibat hemiplegia kiri pasca-stroke, tetapi berkata \"saya tidak bisa berjalan lagi\" dan semangatnya menurun. Manakah sikap yang paling tepat?",["Menyemangati dengan \"kalau berusaha pasti sembuh\"","Menerima perasaannya, memastikan bersama hal yang sudah bisa dilakukan, lalu menetapkan target kecil","Menghentikan rehabilitasi","Membandingkan dengan pengguna lain agar terpacu","Menyerahkan kepada keluarga dan tidak terlibat"]],"80":["Kasus: Ibu G (90 tahun, perempuan) makin sering tersedak saat makan dan jumlah makannya berkurang. Ia mengatakan gigi palsunya tidak pas. Manakah sikap yang paling tepat?",["Tetap menyuapi walau tersedak","Memeriksa masalah gigi palsu dan bentuk makanan, lalu berkonsultasi dengan perawat atau dokter gigi","Mengambil makanannya","Memberi hanya cairan","Mengamati tanpa berbuat apa-apa"]],"81":["Kasus: Ibu H (demensia) tinggal di rumah kelompok. Belakangan ia menolak keras mandi. Manakah sikap yang paling tepat?",["Memaksa melepas bajunya","Menggali alasan penolakan, lalu mengubah cara mengajak atau waktunya","Memutuskan mandi tidak perlu","Menegur agar menurut","Menghentikan semua mandi mulai sekarang"]],"82":["Kasus: Putra yang merawat Ibu I (kategori perawatan 3) berpikir untuk berhenti bekerja. Manakah sikap yang paling tepat dari pekerja perawatan?",["Menyarankan berhenti bekerja","Bekerja sama dengan care manager dan memberi informasi layanan serta sistem yang bisa dipakai","Tidak mendengarkan keluhan merawat","Membebankan seluruh tanggung jawab kepada putra","Menyarankan menyerahkan semuanya kepada fasilitas"]],"83":["Manakah tujuan sistem perwalian dewasa yang tepat?",["Membantu pengelolaan harta dan kontrak bagi orang yang daya nalarnya kurang","Mengurangi iuran asuransi kaigo","Menanggung seluruh biaya medis","Mencarikan pekerjaan","Menyediakan tempat tinggal"]],"84":["Manakah bentuk menjaga privasi yang tepat saat membantu buang air?",["Melakukan dengan pintu terbuka","Menutup pintu atau tirai dan meminimalkan bagian tubuh yang terbuka","Diawasi oleh beberapa staf","Menanyakan dengan suara keras apakah sudah buang air","Meminta pengguna lain melihat keadaannya"]],"85":["Manakah sikap yang tepat bila hasil evaluasi menunjukkan target belum tercapai?",["Mengakhiri dengan menganggap kurang usaha pengguna","Menganalisis penyebab, lalu melakukan asesmen ulang dan meninjau rencana","Tidak mencatat hasil evaluasi","Meneruskan rencana yang sama tanpa batas waktu","Menyerahkan kepada penyedia layanan lain"]],"86":["Manakah tujuan mengembangkan proses perawatan yang paling tepat?",["Untuk mengefisienkan pekerjaan staf","Untuk memahami masalah hidup pengguna dan mendukung kehidupan yang sesuai dengan dirinya","Untuk menambah jumlah catatan","Untuk menambah biaya layanan","Untuk melakukan tindakan medis"]],"98":["Manakah kewajiban yang tidak diatur dalam UU pekerja sosial dan pekerja perawatan?",["Kewajiban jujur","Larangan merusak kepercayaan","Kewajiban menjaga rahasia","Koordinasi","Pembuatan peraturan kerja"]],"99":["Manakah cara menghormati keputusan sendiri pengguna yang tepat?",["Menyajikan pilihan dengan jelas dan membantu pengguna memutuskan sendiri","Staf menentukan cara yang dianggap terbaik","Keluarga yang memutuskan semuanya","Tidak menyajikan pilihan","Melarang semua bila ada bahaya"]],"103":["Manakah yang termasuk informasi objektif?",["Hasil pengukuran seperti suhu dan tekanan darah","Keluhan \"sakit\" dari pengguna","Keinginan keluarga","Perasaan pengguna","Dugaan staf"]],"104":["Manakah alasan lansia lebih sering buang air kecil di malam hari?",["Kapasitas kandung kemih berkurang sehingga frekuensi buang air kecil malam hari bertambah","Karena kemampuan memekatkan urine meningkat","Karena asupan cairan sangat berkurang","Karena fungsi ginjal membaik","Karena hormon antidiuretik bertambah"]],"105":["Manakah perubahan kulit karena usia yang benar?",["Produksi minyak kulit berkurang sehingga mudah kering","Elastisitas bertambah","Luka cepat sembuh","Keringat bertambah","Indra peraba menjadi tajam"]],"110":["Kasus: Ibu K (demensia) masuk ke kamar pengguna lain dan menyentuh barang sehingga terjadi masalah. Manakah sikap yang paling tepat?",["Mengunci pintu agar tidak bisa keluar","Menggali alasannya dan menyiapkan kegiatan siang hari serta tempat yang membuatnya nyaman","Memarahi keras dan melarang","Mengawasinya agar tidak keluar kamar","Membuatnya tidak bisa bergerak dengan obat"]],"111":["Manakah sikap yang tepat saat pengguna menunjukkan kemarahan?",["Menerima emosinya dan mendengarkan alasan kemarahannya dengan tenang","Segera membantah dan membujuk","Mengabaikan","Menegur dengan suara keras","Pergi dan tidak kembali"]],"112":["Manakah cara menyapa penderita demensia yang tepat?",["Menyampaikan dari depan dengan menyejajarkan pandangan, secara tenang dan dengan kata pendek","Menyapa tiba-tiba dari belakang","Menumpuk perintah dengan cepat","Berbicara seperti kepada anak kecil","Bertanya berulang untuk memastikan"]],"113":["Manakah cara berinteraksi dengan keluarga pengguna yang tepat?",["Mendengarkan kecemasan dan perasaan keluarga serta menyampaikan informasi yang perlu dengan mudah dipahami","Tidak mendengarkan pendapat keluarga","Menjelaskan dengan banyak istilah teknis","Membicarakan informasi pribadi dengan bebas kepada keluarga lain","Tidak menyampaikan sama sekali keadaan pengguna"]],"114":["Manakah yang tepat dalam menyusun atau mengubah rencana perawatan?",["Menjelaskan kepada pengguna dan keluarga lalu memperoleh persetujuan","Diputuskan staf saja","Persetujuan diambil setelah pelaksanaan","Penjelasan hanya tertulis dan tidak menerima pertanyaan","Hanya mendengarkan pendapat keluarga"]],"115":["Manakah tujuan mengumpulkan informasi riwayat hidup yang tepat?",["Memahami nilai dan kebiasaan orang itu agar dukungan sesuai dengan dirinya","Mencari kesalahan pengguna di masa lalu","Mengurangi beban staf","Menilai keluarga","Membuat diagnosis"]],"116":["Manakah sikap yang tepat bila kondisi pengguna berubah saat rencana perawatan dijalankan?",["Mengamati, mencatat, dan membagikan dalam tim sesuai kebutuhan","Tidak berbuat apa-apa karena sesuai rencana","Mengubah rencana atas keputusan sendiri","Memberi tahu hanya keluarga","Membiarkan sampai tanggal evaluasi berikutnya"]],"125":["Kasus: Ibu L (84 tahun, perempuan) menderita demensia Alzheimer dengan kategori perawatan 2. Sudah tiga bulan ia tinggal di rumah kelompok (group home). Menjelang sore ia menjadi gelisah dan berkata \"mau pulang\". Siang hari ia suka mewarnai bersama penghuni lain di ruang bersama. Belakangan nafsu makannya berkurang dan berat badannya turun 2 kg.\n\nManakah sikap yang paling tepat terhadap kegelisahannya menjelang sore?",["Terus meyakinkan \"di sinilah rumahnya\"","Menerima perasaannya dan mengajak mewarnai atau berjalan-jalan agar suasananya berubah","Membiarkannya sendirian di kamar sampai tenang","Mengunci pintu depan agar tidak bisa keluar","Menghentikan semua kegiatan sore"]],"126":["Kasus: Ibu L (84 tahun, perempuan) menderita demensia Alzheimer dengan kategori perawatan 2. Sudah tiga bulan ia tinggal di rumah kelompok (group home). Menjelang sore ia menjadi gelisah dan berkata \"mau pulang\". Siang hari ia suka mewarnai bersama penghuni lain di ruang bersama. Belakangan nafsu makannya berkurang dan berat badannya turun 2 kg.\n\nManakah sikap yang paling tepat terhadap Ibu L yang jumlah makannya berkurang?",["Terus memanggil sampai semuanya habis dimakan","Memeriksa selera dan bentuk makanan yang mudah dimakan, serta menata suasana makan","Menggantinya hanya dengan suplemen gizi","Menghentikan penimbangan berat badan","Menyerahkan semuanya kepada keluarga"]],"127":["Kasus: Ibu L (84 tahun, perempuan) menderita demensia Alzheimer dengan kategori perawatan 2. Sudah tiga bulan ia tinggal di rumah kelompok (group home). Menjelang sore ia menjadi gelisah dan berkata \"mau pulang\". Siang hari ia suka mewarnai bersama penghuni lain di ruang bersama. Belakangan nafsu makannya berkurang dan berat badannya turun 2 kg.\n\nManakah evaluasi yang tepat setelah dukungan untuk kegelisahan menjelang sore dilakukan?",["Mencatat kondisi setelah pelaksanaan, memastikan pencapaian target, dan meninjau rencana bila perlu","Mengakhiri evaluasi hanya dengan apa yang berhasil dilakukan","Menilai hanya dari kesan staf","Tidak mengevaluasi dan meneruskan dukungan yang sama","Mengubah rencana hanya berdasarkan pendapat keluarga"]],"128":["Kasus: Bapak M (72 tahun, laki-laki) menderita hemiplegia kiri akibat stroke. Setelah keluar dari rumah sakit ia tinggal bersama istrinya, kategori perawatan 3, dan memakai layanan perawatan kunjungan. Ia cemas saat mandi di kamar mandi rumah dan berkata \"saya tidak akan bisa pulih seperti semula\".\n\nManakah bantuan yang tepat saat masuk dan keluar bak mandi?",["Masuk bak dengan kaki yang lumpuh","Masuk dengan kaki yang tidak lumpuh, dan mempertimbangkan pegangan atau bangku bak mandi","Membiarkan pengguna masuk sendiri tanpa bantuan","Merendam lama di air agak panas","Mencuci badan sambil berdiri"]],"129":["Kasus: Bapak M (72 tahun, laki-laki) menderita hemiplegia kiri akibat stroke. Setelah keluar dari rumah sakit ia tinggal bersama istrinya, kategori perawatan 3, dan memakai layanan perawatan kunjungan. Ia cemas saat mandi di kamar mandi rumah dan berkata \"saya tidak akan bisa pulih seperti semula\".\n\nLayanan asuransi kaigo mana yang dapat dipakai untuk pekerjaan memasang pegangan di kamar mandi?",["Renovasi rumah","Penjualan alat bantu khusus","Rawat singkat dengan menginap","Rehabilitasi harian","Perawatan kesehatan kunjungan"]],"130":["Kasus: Bapak M (72 tahun, laki-laki) menderita hemiplegia kiri akibat stroke. Setelah keluar dari rumah sakit ia tinggal bersama istrinya, kategori perawatan 3, dan memakai layanan perawatan kunjungan. Ia cemas saat mandi di kamar mandi rumah dan berkata \"saya tidak akan bisa pulih seperti semula\".\n\nManakah sikap yang paling tepat terhadap ucapan Bapak M \"saya tidak akan bisa pulih seperti semula\"?",["Menjawab hanya \"tidak apa-apa\"","Mendengarkan dan memastikan bersama hal-hal yang sudah bisa ia lakukan","Segera mengganti topik","Mendesak rehabilitasi dengan keras","Menyemangati dengan membandingkannya dengan pengguna lain"]],"131":["Kasus: Tuan N (35 tahun, laki-laki) memiliki disabilitas intelektual dan tinggal di fasilitas dukungan disabilitas. Siang hari ia pergi ke tempat kerja dukungan tipe B. Belakangan ia sering tiba-tiba berteriak keras saat bekerja. Prosedur kerjanya baru saja berubah.\n\nManakah sudut pandang yang paling tepat saat memikirkan alasan bertambahnya teriakan?",["Menganggapnya masalah sifat pribadi","Memeriksa apakah perubahan lingkungan atau situasi seperti prosedur kerja menimbulkan kecemasan","Melarang bersuara itu sendiri","Meminta dosis obat ditambah","Mengamati tanpa berbuat apa-apa"]],"132":["Kasus: Tuan N (35 tahun, laki-laki) memiliki disabilitas intelektual dan tinggal di fasilitas dukungan disabilitas. Siang hari ia pergi ke tempat kerja dukungan tipe B. Belakangan ia sering tiba-tiba berteriak keras saat bekerja. Prosedur kerjanya baru saja berubah.\n\nManakah cara yang paling tepat menyampaikan prosedur kerja yang baru?",["Menjelaskan sekaligus dengan kalimat panjang","Memakai foto atau ilustrasi dan menyampaikan satu per satu dengan kata pendek","Menjelaskan sekali saja dengan cepat","Hanya memberikan buku prosedur","Menegur bila gagal agar ia mengingat"]],"133":["Kasus: Tuan N (35 tahun, laki-laki) memiliki disabilitas intelektual dan tinggal di fasilitas dukungan disabilitas. Siang hari ia pergi ke tempat kerja dukungan tipe B. Belakangan ia sering tiba-tiba berteriak keras saat bekerja. Prosedur kerjanya baru saja berubah.\n\nManakah penjelasan dukungan kerja berkelanjutan tipe B yang tepat?",["Membuat kontrak kerja dan upah minimum dijamin","Tanpa kontrak kerja, memberi kesempatan bekerja dan pelatihan meningkatkan kemampuan","Hanya untuk disabilitas berat dan masanya ditentukan","Hanya untuk usia 65 tahun ke atas","Layanan asuransi kaigo"]],"134":["Kasus: Ibu O (88 tahun, perempuan) tinggal di panti lansia khusus. Karena usia lanjut, jumlah makannya menurun dan waktu tidurnya bertambah. Keluarganya berharap \"ia bisa menghabiskan waktu di sini sampai akhir hayat\".\n\nManakah sikap yang paling tepat terhadap keluarga?",["Tidak mendengar keinginan keluarga dan hanya menyampaikan kebijakan panti","Mendengarkan perasaan keluarga dan berbagi rencana pendampingan menjelang ajal bersama dokter dan perawat","Menganjurkan agar dibawa ke rumah sakit","Tidak memberi tahu apa pun kepada keluarga","Sama sekali tidak membicarakan bahwa ajal sudah dekat"]],"135":["Kasus: Ibu O (88 tahun, perempuan) tinggal di panti lansia khusus. Karena usia lanjut, jumlah makannya menurun dan waktu tidurnya bertambah. Keluarganya berharap \"ia bisa menghabiskan waktu di sini sampai akhir hayat\".\n\nManakah perubahan tubuh menjelang ajal yang tepat?",["Jumlah urine berkurang","Nafsu makan tiba-tiba meningkat","Suhu tubuh pasti naik","Denyut nadi menjadi kuat dan cepat","Kelenturan kulit bertambah"]],"136":["Kasus: Ibu O (88 tahun, perempuan) tinggal di panti lansia khusus. Karena usia lanjut, jumlah makannya menurun dan waktu tidurnya bertambah. Keluarganya berharap \"ia bisa menghabiskan waktu di sini sampai akhir hayat\".\n\nManakah perawatan mulut yang tepat bagi pengguna yang hampir tidak makan lagi?",["Tidak perlu karena tidak makan","Mencegah mulut kering dan kotor serta menjaga kebersihan dan kelembapan","Menggosok kuat dengan sikat gigi untuk menghilangkan kotoran","Memberi banyak air minum","Tidak melepas dan tidak membersihkan gigi palsu"]],"162":["Manakah isi pedoman etika Asosiasi Pekerja Perawatan Jepang yang tepat?",["Mengutamakan pengguna dan mendukung kemandirian","Mengutamakan mencari keuntungan","Mengutamakan kenyamanan staf","Hanya menghormati pendapat keluarga","Memanfaatkan sertifikat secara eksklusif"]],"163":["Istilah mana yang berarti memutuskan sendiri kehidupan sesuai kehendak walau tubuh tidak bebas?",["Otonomi","Diatur orang lain","Ketergantungan","Terisolasi","Dikendalikan"]],"164":["Manakah tindakan awal yang tepat saat pengguna jatuh?",["Memastikan keselamatan, mengamati luka dan kondisi, lalu segera melapor","Segera mengangkat dengan paksa","Menyembunyikan kecelakaan","Menyalahkan yang bersangkutan","Menyerahkan kepada staf lain dan tidak berbuat apa-apa"]],"165":["Manakah cara pandang kewaspadaan standar (standard precaution) yang tepat?",["Menganggap darah, cairan tubuh, dan ekskreta berpotensi menular","Memakai sarung tangan hanya pada orang yang bergejala","Mencuci tangan hanya bila ada kotoran terlihat","Masker selalu tidak diperlukan","Ekskreta boleh ditangani dengan tangan kosong"]],"166":["Manakah dasar body mechanics (mekanika tubuh) yang tepat?",["Membuka landasan tumpu dan merendahkan pusat gravitasi serta mendekati pengguna","Berdiri dengan kaki rapat","Mengangkat hanya dengan kekuatan lengan","Menarik dari jauh","Memutar pinggang saat memindahkan"]],"177":["Manakah perubahan pengecap karena usia yang tepat?",["Sulit merasakan rasa sehingga menyukai rasa yang kuat","Pengecap menjadi tajam","Hanya tidak merasakan manis","Tidak ada perubahan","Rasa pahit terasa kuat"]],"178":["Manakah ciri depresi pada lansia yang tepat?",["Sering mengeluhkan gangguan fisik seperti sulit tidur dan nafsu makan turun","Pasti mengeluh sendiri tentang suasana hati yang murung","Tiba-tiba menjadi aktif","Halusinasi visual adalah gejala utama","Sama sekali tidak ada gangguan ingatan"]],"179":["Manakah penjelasan osteoartritis lutut yang tepat?",["Tulang rawan lutut menipis sehingga timbul nyeri dan sulit bergerak","Otot tiba-tiba rusak","Penyakit seluruh tubuh yang membuat sendi tiba-tiba kaku","Penyakit otak","Penyakit darah"]],"180":["Manakah gejala katarak yang tepat?",["Pandangan berkabut dan terasa silau","Lapang pandang menyempit dari tepi","Tiba-tiba buta","Pendengaran menurun","Warna tampak terlalu kuat"]],"201":["Manakah cara menentukan prioritas masalah hidup yang tepat?",["Memutuskan dengan mengutamakan masalah mendesak dan menyangkut keselamatan, serta keinginan pengguna","Berdasarkan urutan yang mudah bagi staf","Berdasarkan yang paling mudah diselesaikan","Berdasarkan urutan keinginan keluarga","Berdasarkan urutan ditemukan"]],"202":["Manakah cara menulis target rencana perawatan yang tepat?",["Menjadikan pengguna sebagai subjek dan menulis isi yang bisa dicapai secara konkret","Menjadikan staf sebagai subjek","Menulis dengan ungkapan abstrak","Tidak menulis batas waktu","Memasukkan beberapa isi dalam satu target"]],"203":["Manakah keuntungan memakai cara pandang ICF dalam proses perawatan?",["Gambaran utuh dapat dipahami, termasuk hal yang bisa dilakukan, lingkungan, dan partisipasi, bukan hanya yang tidak bisa","Diagnosis menjadi mudah","Biaya medis berkurang","Jumlah staf bisa dikurangi","Perjalanan penyakit bisa diprediksi"]],"204":["Pada catatan format SOAP, bagian mana yang berisi nilai ukur dan fakta pengamatan?",["O","S","A","P","R"]],"205":["Manakah penjelasan \"ekspresi emosi yang disengaja\" dari prinsip Biestek yang tepat?",["Membantu agar pengguna bebas mengungkapkan perasaannya","Pendamping menonjolkan perasaannya sendiri","Membuat pengguna menahan perasaan","Menenangkan perasaan dengan membujuk secara logis","Terus berbicara untuk menghindari keheningan"]],"206":["Manakah penjelasan sikap tidak menghakimi yang tepat?",["Tidak menilai ucapan dan tindakan lawan bicara baik atau buruk, dan tidak memaksakan nilai sendiri","Menilai tindakan lawan bicara lalu menyampaikannya","Pendamping menentukan tindakan yang benar","Mengkritik lawan bicara agar memperbaiki diri","Mengutamakan pendapat pendamping"]],"207":["Manakah penjelasan informed consent yang tepat?",["Setuju dengan sadar setelah menerima penjelasan yang cukup","Keluarga memutuskan semuanya","Dokter menentukan rencana pengobatan secara sepihak","Menyuruh menandatangani surat pernyataan","Tidak perlu persetujuan"]],"208":["Manakah cara berkomunikasi yang tepat dengan orang yang mengalami disartria?",["Memilih cara yang mudah baginya, seperti menulis atau memakai tabel huruf","Berpura-pura mengerti lalu melanjutkan percakapan","Mendesaknya berbicara cepat","Meminta orang lain berbicara mewakilinya","Menyuruhnya berhenti berbicara"]],"209":["Manakah yang termasuk pekerjaan pekerja perawatan bersertifikat?",["Memberi bimbingan tentang perawatan kepada pengguna dan pengasuhnya","Diagnosis dan peresepan","Memungut iuran asuransi","Mewakili dalam pengadilan","Mendaftarkan tanah"]],"210":["Manakah tujuan UU asuransi kaigo yang tepat?",["Menjaga martabat dan mendukung kehidupan sehari-hari yang mandiri sesuai kemampuan","Hanya bertujuan mengurangi biaya medis","Menambah keuntungan fasilitas","Menutup kekurangan pensiun","Memungut pajak"]],"211":["Manakah yang termasuk penelantaran (neglect) dalam penganiayaan lansia?",["Tidak memberi perawatan dan pengurusan yang dibutuhkan lalu membiarkannya","Memukul tubuhnya","Mengucapkan kata kasar","Menggunakan harta pengguna seenaknya","Memaksa tindakan seksual"]],"212":["Manakah sikap yang tepat saat pengguna menyampaikan keluhan?",["Menerimanya dengan jujur, mencatat, membagikan di organisasi, dan menjadikannya perbaikan","Menyelesaikan sendiri tanpa melapor","Menganggap pengguna salah paham","Mengabaikan dan tidak menanggapi","Menjauhi orang yang mengeluh"]],"213":["Kasus: Bapak P (79 tahun, laki-laki) mengalami hemiplegia kanan dan gangguan menelan ringan akibat gejala sisa stroke. Ia tinggal di rumah bersama istrinya dan memakai layanan harian (daycare) tiga kali seminggu. Ia kadang tersedak saat makan, dan istrinya berkata \"saya takut menyuapinya\".\n\nManakah cara membantu makan yang paling tepat?",["Menyiapkan posisi duduk, dagu sedikit ditarik, suapan sedikit, dan memastikan sudah tertelan","Makan dalam posisi hampir telentang","Jika tersedak segera memberi banyak air untuk mendorong","Melarang bicara saat makan","Tetap makan walau tersedak"]],"214":["Kasus: Bapak P (79 tahun, laki-laki) mengalami hemiplegia kanan dan gangguan menelan ringan akibat gejala sisa stroke. Ia tinggal di rumah bersama istrinya dan memakai layanan harian (daycare) tiga kali seminggu. Ia kadang tersedak saat makan, dan istrinya berkata \"saya takut menyuapinya\".\n\nManakah sikap yang paling tepat terhadap kecemasan istrinya?",["Berempati pada kecemasannya, memastikan bersama cara menyuapi yang aman, dan menghubungkan ke tenaga ahli bila perlu","Tidak menjelaskan apa pun kepada istrinya","Melarang istrinya membantu makan","Menyarankan menolak perawatan","Menyimpulkan bahwa tersedak itu normal sehingga tidak perlu khawatir"]],"215":["Kasus: Bapak P (79 tahun, laki-laki) mengalami hemiplegia kanan dan gangguan menelan ringan akibat gejala sisa stroke. Ia tinggal di rumah bersama istrinya dan memakai layanan harian (daycare) tiga kali seminggu. Ia kadang tersedak saat makan, dan istrinya berkata \"saya takut menyuapinya\".\n\nManakah profesi yang tepat untuk dikonsultasikan bila tersedak berlanjut?",["Terapis wicara dan menelan, dokter, dan dokter gigi","Pengacara","Konsultan pajak","Hanya staf administrasi","Tidak perlu berkonsultasi"]],"216":["Kasus: Ibu Q (86 tahun, perempuan) tinggal di panti lansia khusus. Ia menderita demensia dan makin sering berjalan sendiri pada malam hari hingga hampir jatuh. Di antara staf muncul pendapat \"sebaiknya tempat tidurnya dikelilingi pagar\".\n\nManakah sikap yang paling tepat terhadap Ibu Q yang berjalan malam hari dan hampir jatuh?",["Mencari penyebab jatuh, lalu mempertimbangkan penataan lingkungan dan dukungan sesuai tujuan berjalan malam hari","Mengelilingi tempat tidur seluruhnya dengan pagar","Mengikatnya di kursi roda pada malam hari","Membuatnya tidur dengan obat psikotropika","Memarahinya agar tidak berjalan"]],"217":["Kasus: Ibu Q (86 tahun, perempuan) tinggal di panti lansia khusus. Ia menderita demensia dan makin sering berjalan sendiri pada malam hari hingga hampir jatuh. Di antara staf muncul pendapat \"sebaiknya tempat tidurnya dikelilingi pagar\".\n\nManakah sikap yang tepat bila pengekangan fisik terpaksa dilakukan?",["Memastikan tiga syarat, menjelaskan kepada yang bersangkutan dan keluarga, serta mencatatnya","Dilaksanakan hanya atas keputusan staf","Dilaksanakan tanpa memberi tahu keluarga","Dilanjutkan tanpa batas waktu","Tidak dicatat"]],"218":["Kasus: Ibu Q (86 tahun, perempuan) tinggal di panti lansia khusus. Ia menderita demensia dan makin sering berjalan sendiri pada malam hari hingga hampir jatuh. Di antara staf muncul pendapat \"sebaiknya tempat tidurnya dikelilingi pagar\".\n\nManakah cara berbagi informasi yang tepat dalam situasi ini?",["Berbagi informasi lintas profesi dalam rapat perawatan lalu meninjau isi dukungan","Diputuskan staf perawatan saja","Menyerahkan semuanya kepada perawat","Menyerahkan semuanya kepada keluarga","Setiap staf menangani sendiri-sendiri"]],"220":["Apa penyebab utama patah tulang leher paha yang sering terjadi pada lansia?",["Jatuh","Mengangkat benda berat","Mandi terlalu lama","Makan berlebihan","Olahraga berlebihan"]]});
Object.assign(TRS,{"227":["Kasus: Bapak R (74 tahun, laki-laki) menderita penyakit Parkinson dengan kategori perawatan 2 dan tinggal di rumah bersama istrinya. Kakinya sulit melangkah saat mulai berjalan, dan ia hampir jatuh saat berbelok. Gerakannya berbeda antara saat obat bekerja dan saat obat habis. Ia memakai layanan perawatan kunjungan.\n\nManakah gejala yang membuat kaki sulit melangkah saat mulai berjalan?",["Kaki terasa menempel (すくみ足)","Gemetar","Apraksia","Kelumpuhan","Disartria"]],"228":["Kasus: Bapak R (74 tahun, laki-laki) menderita penyakit Parkinson dengan kategori perawatan 2 dan tinggal di rumah bersama istrinya. Kakinya sulit melangkah saat mulai berjalan, dan ia hampir jatuh saat berbelok. Gerakannya berbeda antara saat obat bekerja dan saat obat habis. Ia memakai layanan perawatan kunjungan.\n\nManakah bantuan berjalan yang tepat?",["Membuat garis penanda di lantai atau memberi irama \"satu, dua\" agar mudah mulai melangkah","Mendesak dari belakang agar berjalan","Menambah benda di kaki untuk mengingatkan","Selalu memakai kursi roda saja","Melarang berjalan"]],"229":["Kasus: Bapak R (74 tahun, laki-laki) menderita penyakit Parkinson dengan kategori perawatan 2 dan tinggal di rumah bersama istrinya. Kakinya sulit melangkah saat mulai berjalan, dan ia hampir jatuh saat berbelok. Gerakannya berbeda antara saat obat bekerja dan saat obat habis. Ia memakai layanan perawatan kunjungan.\n\nManakah sikap yang tepat terhadap naik turunnya efek obat?",["Mengamati dan mencatat keadaan geraknya lalu menyampaikan kepada dokter dan perawat","Mengubah dosis obat atas keputusan sendiri","Menghentikan minum obat","Memberi tahu hanya keluarga","Menyimpulkan obat tidak berefek"]],"230":["Kasus: Ibu S (80 tahun, perempuan) menderita diabetes tipe 2 dan menyuntik insulin, serta tinggal di panti lansia khusus. Sebelum makan siang ia berkeringat dingin, tangannya gemetar, dan tampak linglung.\n\nKeadaan apa yang mungkin dialami Ibu S?",["Gula darah rendah","Gula darah tinggi","Dehidrasi","Anemia","Tekanan darah tinggi"]],"231":["Kasus: Ibu S (80 tahun, perempuan) menderita diabetes tipe 2 dan menyuntik insulin, serta tinggal di panti lansia khusus. Sebelum makan siang ia berkeringat dingin, tangannya gemetar, dan tampak linglung.\n\nManakah sikap yang paling tepat dalam situasi ini?",["Menghubungi perawat dan, bila sadar, memberi gula sesuai instruksi","Menyuntikkan insulin tambahan","Menunggu sampai makan siang sambil mengamati","Hanya memberi air putih","Membiarkan istirahat tanpa berbuat apa-apa"]],"232":["Kasus: Ibu S (80 tahun, perempuan) menderita diabetes tipe 2 dan menyuntik insulin, serta tinggal di panti lansia khusus. Sebelum makan siang ia berkeringat dingin, tangannya gemetar, dan tampak linglung.\n\nManakah dukungan sehari-hari yang tepat bagi penderita diabetes?",["Mendukung agar jumlah dan jam makan sesuai ketentuan serta mengamati perubahan kondisi","Melewatkan makan untuk menurunkan gula darah","Membebaskan makanan selingan","Melarang semua olahraga","Tidak perlu memeriksa kaki"]],"233":["Kasus: Bapak T (68 tahun, laki-laki) mengalami hemiplegia kiri dan pengabaian ruang sisi kiri akibat stroke, dan memakai rehabilitasi harian. Saat makan ia sering menyisakan makanan di sisi kiri piring.\n\nManakah penjelasan pengabaian ruang sisi kiri yang tepat?",["Sulit menyadari benda atau orang di ruang sisi yang terganggu (kiri)","Penglihatan menurun","Nama benda tidak keluar","Tidak memahami bahasa","Ingatan hilang"]],"234":["Kasus: Bapak T (68 tahun, laki-laki) mengalami hemiplegia kiri dan pengabaian ruang sisi kiri akibat stroke, dan memakai rehabilitasi harian. Saat makan ia sering menyisakan makanan di sisi kiri piring.\n\nManakah dukungan makan yang paling tepat?",["Menggeser makanan ke sisi kanan yang terlihat dan mengajak melihat ke sisi kiri juga","Mengambil makanan di sisi kiri","Tidak menaruh piring di sisi kanan","Hanya mengamati tanpa menegur","Menghentikan makan"]],"235":["Kasus: Bapak T (68 tahun, laki-laki) mengalami hemiplegia kiri dan pengabaian ruang sisi kiri akibat stroke, dan memakai rehabilitasi harian. Saat makan ia sering menyisakan makanan di sisi kiri piring.\n\nManakah cara berinteraksi saat berpindah tempat yang paling tepat?",["Menyapa dari sisi kanan yang mudah diperhatikan dan menyingkirkan benda berbahaya di sisi kiri","Selalu menyapa dari sisi kiri","Menaruh banyak benda di sisi kiri","Menggelapkan ruangan","Tidak peduli benda di lorong"]],"236":["Kasus: Bapak U (78 tahun, laki-laki) menderita penyakit paru obstruktif kronis (PPOK) dan menjalani terapi oksigen di rumah. Ia tinggal berdua dengan istrinya. Ia sangat sesak saat naik turun tangga dan mandi. Dulu ia lama merokok.\n\nManakah kewaspadaan terapi oksigen di rumah yang tepat?",["Jauhkan api saat oksigen dipakai","Memakai di dekat kompor gas","Merokok bebas","Menaikkan aliran oksigen sendiri","Melepas oksigen kecuali saat perlu"]],"237":["Kasus: Bapak U (78 tahun, laki-laki) menderita penyakit paru obstruktif kronis (PPOK) dan menjalani terapi oksigen di rumah. Ia tinggal berdua dengan istrinya. Ia sangat sesak saat naik turun tangga dan mandi. Dulu ia lama merokok.\n\nManakah cara membantu mandi yang tepat?",["Memakai air suam, berendam setengah badan, dan beristirahat bila sesak","Berendam di air panas sampai bahu","Menganjurkan mandi lama","Mencuci rambut dengan tergesa","Melepas oksigen saat mandi"]],"238":["Kasus: Bapak U (78 tahun, laki-laki) menderita penyakit paru obstruktif kronis (PPOK) dan menjalani terapi oksigen di rumah. Ia tinggal berdua dengan istrinya. Ia sangat sesak saat naik turun tangga dan mandi. Dulu ia lama merokok.\n\nManakah cara bernapas yang tepat untuk mengurangi sesak?",["Menghembuskan napas pelan dengan bibir mengerucut","Menarik napas secepat mungkin","Menahan napas","Menghembuskan napas dengan mulut terbuka lebar","Bernapas dangkal hanya dengan dada"]],"239":["Manakah cara memilih sepatu lansia yang tepat?",["Sepatu yang menopang tumit dan alasnya tidak licin"
