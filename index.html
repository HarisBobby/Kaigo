t","Menyebutkan tujuan penggunaan dan tidak memberikan ke pihak ketiga tanpa persetujuan yang bersangkutan","Keluarga siapa pun boleh diberi tahu bebas","Boleh diunggah ke media sosial asal anonim","Siapa pun boleh menyalin di catatan bersama"]],"339":["Manakah penanganan yang tepat bila ada keluhan dari pengguna atau keluarga?",["Tidak menghubungi pengguna sampai selesai","Menerima dengan sungguh-sungguh, memastikan fakta, menangani sebagai organisasi, dan menjadikannya perbaikan","Menyalahkan penanggung jawab lalu selesai","Menganggapnya ketidakpuasan pribadi","Cukup lisan tanpa dicatat"]],"340":["Kepada siapa dilaporkan bila menemukan penganiayaan lansia oleh pengasuh (養護者)?",["Perusahaan keamanan swasta","Hanya rekan kerja","Kenalan keluarga","Pemerintah kota (pusat dukungan komunitas terpadu)","Tidak perlu melapor"]],"341":["Anda menemukan pengguna tergeletak. Manakah respons pertama yang tepat?",["Segera memberi minum air","Mengangkatnya sendirian","Membiarkan sampai penyebabnya diketahui","Memeriksa kesadaran dan napas, memanggil bantuan, dan bila perlu menelepon 119","Tidak berbuat apa pun sampai menelepon keluarga"]],"342":["Manakah pencegahan sengatan panas yang tepat?",["Menahan panas dan terus beraktivitas","Sering minum sedikit-sedikit, serta menyesuaikan suhu ruangan dan pakaian","Berpakaian tebal agar berkeringat","Tidak minum sampai haus","Tidak memakai pendingin karena buruk bagi tubuh"]],"343":["Manakah tujuan laporan hiyari-hatto (kejadian nyaris celaka) yang tepat?",["Berlomba jumlah laporan","Menyembunyikan kecelakaan","Menuntut tanggung jawab pengguna","Menganalisis penyebab dan membantu mencegah terulangnya","Menghukum penanggung jawab"]],"344":["Manakah hal yang perlu dipastikan sebelum membantu mandi?",["Suhu air kesukaan staf","Penghasilan tahunan pengguna","Hanya menu makan hari sebelumnya","Tanda vital, kondisi tubuh, dan keinginan yang bersangkutan","Jadwal keluarga"]],"372":["Manakah yang termasuk \"partisipasi\" (参加) dalam ICF?",["Mengambil bagian dalam kegiatan masyarakat dan menjalankan peran","Berjalan sendiri","Penglihatan menurun","Ada undakan pada tangga","Usia 80 tahun"]],"373":["Manakah suhu cairan nutrisi untuk pemberian makan lewat selang yang tepat?",["Dihangatkan hingga 60 derajat ke atas","Dihangatkan dengan air mendidih","Langsung dipakai dari kulkas","Sekitar suhu ruangan (hindari tepat setelah keluar dari kulkas)","Didinginkan dengan es"]],"384":["Kasus: Bapak G (80 tahun, laki-laki) tinggal di panti werda khusus. Sejak setelah makan malam, beberapa penghuni mengalami muntah dan diare. Bapak G tidak demam tetapi mengeluh mual. Manakah penanganan awal yang paling tepat saat muntah dan diare terlihat pada beberapa penghuni? Pilih satu.",["Mengumpulkan yang bergejala di ruang makan sambil diamati","Memakai sarung tangan sekali pakai dan masker, serta melapor ke perawat atau atasan untuk mencegah penyebaran infeksi","Mengelap kotoran dengan tangan kosong","Menghubungi keluarga saja","Menjalani hari seperti biasa sampai penyebabnya diketahui"]],"385":["Kasus: Bapak G (80 tahun, laki-laki) tinggal di panti werda khusus. Sejak setelah makan malam, beberapa penghuni mengalami muntah dan diare. Bapak G tidak demam tetapi mengeluh mual. Manakah cara mencuci tangan sebelum dan sesudah membantu yang paling tepat? Pilih satu.",["Dengan sabun dan air mengalir, mencuci teliti sampai sela jari dan pergelangan","Tidak mencuci bila memakai sarung tangan","Hanya membilas sebentar dengan air","Mencuci sekali sehari secara sekaligus","Hanya cukup dengan alkohol, kotoran dibiarkan"]],"386":["Kasus: Bapak G (80 tahun, laki-laki) tinggal di panti werda khusus. Sejak setelah makan malam, beberapa penghuni mengalami muntah dan diare. Bapak G tidak demam tetapi mengeluh mual. Manakah dukungan bagi pengguna yang muntah atau diare yang paling tepat? Pilih satu.",["Tidak mencatat gejala","Membiarkan tetap berbaring","Memaksa menghabiskan seluruh makanan","Membatasi cairan","Mewaspadai dehidrasi, menganjurkan asupan cairan, mengamati kondisi, dan melapor"]],"387":["Kasus: Ibu H (81 tahun, perempuan) tinggal di panti berbayar (有料老人ホーム) dengan 要介護 2. Setiap pagi ia senang berdandan sendiri, tetapi belakangan tangannya gemetar sehingga memakan waktu. Seorang staf baru berdandan menggantikannya karena lama, dan wajah Ibu H menjadi murung. Manakah saran untuk staf baru tentang dandanan Ibu H yang paling tepat? Pilih satu.",["Menentukan cara tanpa mendengar keinginannya","Menghormati ritmenya, membiarkan ia melakukan bagian yang bisa, dengan pengawasan atau bantuan sebagian","Bila tangan gemetar, minta berhenti berdandan","Demi hemat waktu, semuanya dilakukan staf","Menyuruh staf lain menggantikan"]],"388":["Kasus: Ibu H (81 tahun, perempuan) tinggal di panti berbayar (有料老人ホーム) dengan 要介護 2. Setiap pagi ia senang berdandan sendiri, tetapi belakangan tangannya gemetar sehingga memakan waktu. Seorang staf baru berdandan menggantikannya karena lama, dan wajah Ibu H menjadi murung. Manakah yang paling mungkin menjelaskan wajah murung Ibu H? Pilih satu.",["Ia jadi tidak suka berdandan","Ia merasa kesenangan melakukannya sendiri telah direnggut","Ia tidak keberatan meski memakan waktu","Dukungan kemandirian telah terwujud","Ia berterima kasih kepada staf"]],"389":["Kasus: Ibu H (81 tahun, perempuan) tinggal di panti berbayar (有料老人ホーム) dengan 要介護 2. Setiap pagi ia senang berdandan sendiri, tetapi belakangan tangannya gemetar sehingga memakan waktu. Seorang staf baru berdandan menggantikannya karena lama, dan wajah Ibu H menjadi murung. Manakah sudut pandang yang paling tepat saat meninjau rencana agar Ibu H tetap bisa berdandan? Pilih satu.",["Mengubah tanpa mendengar pendapatnya","Menghapus waktu berdandan demi mencegah jatuh","Membiarkannya sendirian tanpa staf pengawas","Memanfaatkan semangatnya dan menopang kemandirian dengan penyesuaian alat dan lingkungan","Menentukan frekuensi sesuai jam kerja staf"]],"394":["Manakah hal yang tepat dilakukan pertama kali oleh orang yang menemukan lansia yang diduga mengalami penganiayaan? Pilih satu.",["Menghubungi hanya keluarga","Menanyakan tanggung jawab kepada yang bersangkutan","Menyelesaikan hanya oleh staf","Melapor ke pemerintah kota","Mengamati dan tidak mencatat"]],"403":["Manakah perubahan indra pengecap pada lansia yang paling tepat? Pilih satu.",["Semua rasa terasa kuat","Sulit merasakan asin sehingga bumbu cenderung menjadi pekat","Hanya rasa manis yang peka","Hanya merasakan pedas","Indra pengecap sama sekali tidak berubah"]],"485":["Manakah penanganan yang paling tepat bila bibir atau kuku tampak kebiruan saat penyedotan dahak? Pilih satu.",["Mengamati saja","Melanjutkan penyedotan","Menaikkan tekanan dan menyelesaikan dalam waktu singkat","Segera menghentikan penyedotan dan menghubungi perawat","Hanya mencatat"]],"487":["Manakah penanganan setelah pemberian makan lewat selang yang paling tepat? Pilih satu.",["Segera membaringkan","Mengguncang tubuh agar lambung bergerak","Menjaga tubuh bagian atas tetap tegak beberapa saat untuk mencegah refluks","Membaringkan dengan tempat tidur datar","Menengkurapkan"]],"491":["Manakah patokan kedalaman dan tempo kompresi dada yang paling tepat? Pilih satu.",["Kedalaman sekitar 3 cm, 60 kali per menit","Kedalaman sekitar 1 cm, 50 kali per menit","Kedalaman sekitar 5 cm, 100 sampai 120 kali per menit","Kedalaman sekitar 10 cm, 200 kali per menit","Tanpa menentukan kedalaman, secepat mungkin"]],"492":["Manakah penanganan saat AED tiba yang paling tepat? Pilih satu.",["Menghentikan kompresi dada dan mengamati","Menyalakan alat dan menempelkan bantalan elektroda sesuai instruksi suara","Menempelkan bantalan pada kulit yang basah","Menunggu tanpa menyalakan alat","Mengabaikan instruksi suara"]],"493":["Manakah jalur penularan utama kudis (疥癬) yang paling tepat? Pilih satu.",["Lewat udara","Lewat kontak","Lewat percikan (droplet)","Lewat darah","Lewat nyamuk"]],"494":["Manakah jalur penularan utama tuberkulosis yang paling tepat? Pilih satu.",["Lewat hubungan seksual","Lewat udara","Hanya lewat kontak","Lewat nyamuk","Lewat mulut"]],"495":["Manakah penanganan terhadap penderita demensia yang memakan benda bukan makanan (異食) yang paling tepat? Pilih satu.",["Membiarkan benda berbahaya di tempatnya","Memarahi agar berhenti","Tidak menaruh benda berbahaya di tempat yang terjangkau dan menata lingkungan","Meninggalkannya sendirian","Tidak memeriksa apa yang dimakan"]],"496":["Manakah penanganan terhadap orang sadar yang tersedak makanan yang paling tepat? Pilih satu.",["Memberi minum air","Hanya mengamati tanpa berbuat apa-apa","Hanya mengusap punggung","Membaringkan","Menganjurkan batuk, dan bila tidak keluar lakukan pukulan punggung sambil memanggil bantuan"]],"497":["Manakah penjelasan tempat pengungsian kesejahteraan (福祉避難所) yang paling tepat? Pilih satu.",["Penginapan untuk wisatawan","Nama lain rumah sakit","Ruang istirahat khusus staf","Menerima lansia dan penyandang disabilitas yang sulit hidup di tempat pengungsian umum","Lapangan sekolah"]],"498":["Manakah tujuan BCP (rencana kelangsungan usaha) yang paling tepat? Pilih satu.",["Menambah jumlah pengguna","Mengurangi biaya","Menentukan penanggung jawab kecelakaan","Melanjutkan layanan sebisa mungkin meski terjadi bencana atau wabah penyakit","Menentukan gaji staf"]]});

Object.assign(TRS,{"269":["Manakah contoh pengekangan lewat ucapan (speech lock) yang paling tepat?",["Mengelilingi dengan pagar tempat tidur agar tidak bisa bergerak","Mengucapkan kata yang membatasi tindakan, seperti \"tunggu sebentar\" atau \"jangan bergerak\"","Mengikat dengan sabuk di kursi roda","Mengunci pintu","Memakaikan sarung tangan agar tangan tidak bisa dipakai"]],"273":["Pengguna berkata, \"Saya sudah tidak bisa melakukan apa pun lagi.\" Manakah respons pertama yang tepat?",["Mengganti topik","Langsung menyangkal, \"Tidak begitu kok\"","Menyemangati dengan \"Cepatlah terbiasa\"","Menerima perasaannya, \"Anda merasa begitu ya\"","Mengatakan \"Semua orang sama saja\""]],"276":["Manakah cara berbicara yang tepat kepada orang dengan gangguan pendengaran?",["Berbicara dari depan agar gerak bibir terlihat, dengan jelas dan pelan","Menyapa dari belakang","Berbicara cepat sambil menutupi mulut","Tiba-tiba berteriak keras di dekat telinga","Selalu hanya memakai isyarat tubuh"]],"277":["Manakah yang tidak termasuk komunikasi nonverbal?",["Ekspresi wajah","Nada suara","Isi kata-kata yang diucapkan","Gerak tubuh","Tatapan mata"]],"278":["Manakah dasar yang tepat saat staf melapor kepada atasan?",["Menyampaikan dugaan seolah-olah fakta","Menceritakan semuanya secara rinci sesuai urutan kejadian","Menyampaikan kesimpulan lebih dulu dan membedakan fakta dari pendapat sendiri","Melapor nanti secara dikumpulkan","Tidak menyampaikan hal yang tidak menguntungkan"]],"279":["Manakah usia yang benar untuk peserta asuransi kaigo nomor 2 (dai-ni gō hihokensha)?",["Semua orang berusia 65 tahun ke atas","Hanya 75 tahun ke atas","Peserta asuransi kesehatan berusia 40 sampai di bawah 65 tahun","60 sampai di bawah 75 tahun","20 sampai di bawah 40 tahun"]],"281":["Lembaga mana yang terutama menyusun rencana perawatan pencegahan bagi orang dengan 要支援 1 dan 2?",["Pengadilan keluarga","Pusat kesehatan masyarakat (hokenjo)","Pusat dukungan komunitas terpadu (地域包括支援センター)","Kantor kesejahteraan (fukushi jimusho)","Kantor penyalur tenaga kerja publik"]],"282":["Manakah beban biaya pengguna yang benar saat memakai layanan asuransi kaigo?",["Ditanggung penuh sendiri","1 sampai 3 persepuluh sesuai penghasilan","Selalu tanpa beban biaya","Selalu 2 persepuluh apa pun penghasilannya","Selalu 5 persepuluh"]],"286":["Manakah cara mengubah posisi dari telentang ke miring yang tepat?",["Mengangkat sekaligus dengan kuat","Menekuk lutut, menopang bahu dan pinggul, lalu memutar ke arah depan","Menarik rambut untuk mengubah arah","Dengan kaki lurus, menarik lengan dengan kuat","Hanya memalingkan kepala ke samping"]],"287":["Manakah bagian yang mudah terkena luka tekan saat telentang?",["Punggung kaki","Dada bagian depan","Perut","Bagian depan lutut","Daerah tulang ekor (sakrum)"]],"290":["Manakah posisi pendamping yang tepat untuk orang hemiplegia yang berjalan dengan tongkat?",["Di belakang miring pada sisi yang lumpuh","Di depan miring pada sisi yang sehat","Tepat di depan sisi yang lumpuh","Di posisi yang jauh dari pengguna","Tepat di samping sisi yang sehat"]],"293":["Manakah urutan proses kaigo yang benar?",["Pelaksanaan, evaluasi, penyusunan rencana, asesmen","Evaluasi, asesmen, pelaksanaan, penyusunan rencana","Penyusunan rencana, pelaksanaan, asesmen, evaluasi","Asesmen, pelaksanaan, penyusunan rencana, evaluasi","Asesmen, penyusunan rencana, pelaksanaan, evaluasi"]],"294":["Manakah penjelasan yang tepat tentang tujuan jangka pendek?",["Tujuan bertahap untuk mendekati tujuan jangka panjang","Ditentukan tanpa kaitan dengan tujuan jangka panjang","Jangka waktunya ditetapkan satu tahun atau lebih","Tujuan samar yang boleh tidak tercapai","Ditetapkan demi kenyamanan staf"]],"295":["Manakah penetapan tujuan perawatan yang tepat?",["Pengguna sebagai subjek, isinya konkret dan dapat dicapai","Tanpa menentukan jangka waktu","Ditulis dengan staf sebagai subjek","Hanya menderetkan larangan","Memakai ungkapan abstrak"]],"301":["Manakah perubahan tubuh akibat penuaan yang tepat?",["Indra pengecap menjadi lebih peka","Kapasitas paru bertambah","Kepadatan tulang meningkat","Massa otot bertambah","Kulit menjadi tipis dan mudah kering"]],"302":["Manakah gejala katarak yang tepat?",["Air mata tidak berhenti mengalir","Bola mata menonjol ke depan","Sama sekali tidak bisa melihat warna","Lapang pandang menyempit sedikit demi sedikit","Penglihatan kabur dan merasa silau"]],"305":["Manakah penjelasan yang tepat tentang frailty (フレイル)?",["Keadaan vitalitas fisik dan mental menurun karena usia sehingga mudah membutuhkan perawatan","Infeksi akut","Salah satu jenis demensia","Nama lain patah tulang","Penyakit yang banyak terjadi pada usia muda"]],"306":["Manakah patah tulang yang sering terjadi pada lansia?",["Patah tulang belikat","Patah tulang leher femur (paha)","Patah tulang tengkorak","Patah tulang rusuk saja","Patah tulang jari kaki"]],"309":["Manakah ciri demensia vaskular yang tepat?",["Gejala utamanya hanya perubahan kepribadian","Memburuk bertahap seperti tangga, ada selisih antara hal yang bisa dan tidak bisa dilakukan","Sembuh total dalam beberapa hari","Berkembang lambat secara lurus","Halusinasi visual pasti muncul sejak awal"]],"310":["Manakah gejala khas demensia dengan badan Lewy?",["Perubahan kepribadian mendadak dan perilaku berulang yang kaku","Demam tinggi dan hilang kesadaran total","Hanya afasia mendadak","Halusinasi visual dan gejala parkinsonisme","Memburuk bertahap seperti tangga"]],"311":["Manakah ciri demensia frontotemporal yang tepat?",["Halusinasi visual pasti muncul sejak awal","Tidak terjadi pada usia 60 tahun ke atas","Perubahan kepribadian dan perilaku berulang menonjol","Hanya gangguan ingatan yang muncul","Tiba-tiba memburuk seperti tangga"]],"314":["Manakah cara menyapa orang dengan demensia yang tepat?",["Menyalahkan kesalahan saat itu juga","Menjelaskan panjang dengan cepat","Berbicara seperti kepada anak kecil","Memanggil keras dari belakang","Sejajarkan pandangan, berbicara tenang, singkat, dan konkret"]],"317":["Manakah penanganan saat makan bagi orang dengan neglect spasial unilateral (半側空間無視) yang tepat?",["Menghentikan makan","Mengumpulkan makanan di sisi yang terabaikan","Menyapa agar perhatiannya beralih ke sisi yang terabaikan","Tidak berbicara apa pun dari sisi yang terabaikan","Mengambil sisa makanan diam-diam"]],"318":["Manakah cara berinteraksi yang tepat dengan orang dengan gangguan spektrum autisme?",["Memakai ungkapan samar agar dimengerti sendiri","Memaksa kontak mata","Menunjukkan gambaran ke depan dan menyampaikan dengan kata konkret, gambar, atau tulisan","Mengubah jadwal mendadak agar terbiasa","Berbicara bersama banyak orang sekaligus"]],"319":["Manakah penjelasan yang tepat tentang akomodasi yang wajar (合理的配慮)?",["Harus dilakukan berapa pun biayanya","Memberi hak istimewa hanya kepada penyandang disabilitas","Menghilangkan hambatan sosial akibat disabilitas dalam batas beban yang tidak terlalu berat","Tes untuk mengukur tingkat disabilitas","Tidak melakukan pertimbangan sama sekali"]],"322":["Manakah ciri artritis reumatoid yang tepat?",["Kekakuan kuat di pagi hari","Hanya terjadi pada pria lanjut usia","Pasti memburuk di malam hari","Pasti disebabkan oleh olahraga","Tidak terjadi pada sendi tangan"]],"326":["Manakah alasan lansia mudah mengalami dehidrasi?",["Karena fungsi ginjal menjadi aktif","Karena tidak terlalu sering ke toilet","Karena sulit merasakan haus sehingga asupan cairan mudah berkurang","Karena cairan dalam tubuh bertambah","Karena sama sekali tidak berkeringat"]],"329":["Manakah posisi yang tepat selama pemberian makan lewat selang (経管栄養)?",["Hindari posisi duduk, selalu miring","Menjaga tubuh bagian atas tetap tegak","Mengistirahatkan dengan kaki ditinggikan","Telentang dengan kepala rendah","Tengkurap"]],"331":["Manakah hal yang tepat pada penyedotan di dalam kanul trakea?",["Menyedot terus-menerus dalam waktu lama","Memasukkan sedalam mungkin","Kebersihan tangan tidak diperlukan","Selang penyedot dijaga agar tidak melewati ujung kanul trakea","Tidak mengamati apa pun selama penyedotan"]],"351":["Kasus: Ibu C (90 tahun, perempuan) tinggal di panti werda khusus (特別養護老人ホーム). Penuaan lanjut membuatnya dinyatakan dokter berada pada masa akhir hidup. Keluarga ingin ia menjalani hari terakhir dengan tenang, tetapi cemas dan berkata, \"Kami tidak tahu harus berbuat apa.\" Manakah penanganan terhadap keluarga Ibu C yang paling tepat?",["Mengatakan itu pekerjaan tenaga medis sehingga keluarga tidak perlu berbuat apa-apa","Mengatakan kecemasan itu hanya perasaan","Mendengarkan kecemasan dan bersama-sama memikirkan hal yang bisa dilakukan keluarga, seperti mendampingi dan berbicara kepadanya","Menghindari pembicaraan tentang kematian","Membatasi kunjungan keluarga"]],"352":["Kasus: Ibu C (90 tahun, perempuan) tinggal di panti werda khusus (特別養護老人ホーム). Penuaan lanjut membuatnya dinyatakan dokter berada pada masa akhir hidup. Keluarga ingin ia menjalani hari terakhir dengan tenang, tetapi cemas dan berkata, \"Kami tidak tahu harus berbuat apa.\" Manakah perawatan masa akhir hidup yang tepat?",["Membiarkannya sendirian di kamar pribadi sebisa mungkin","Menghentikan perawatan dasar meski ada rasa sakit","Memutuskan demi kenyamanan panti tanpa menanyakan keinginannya","Meredakan penderitaan, menjaga kebersihan mulut dan tubuh, serta mendukung agar ia tenang di lingkungan yang sesuai dirinya","Memaksanya menghabiskan seluruh porsi makan"]],"353":["Kasus: Ibu C (90 tahun, perempuan) tinggal di panti werda khusus (特別養護老人ホーム). Penuaan lanjut membuatnya dinyatakan dokter berada pada masa akhir hidup. Keluarga ingin ia menjalani hari terakhir dengan tenang, tetapi cemas dan berkata, \"Kami tidak tahu harus berbuat apa.\" Manakah penanganan setelah Ibu C meninggal yang tepat?",["Langsung kembali ke pekerjaan biasa dan tidak membicarakannya","Memperhatikan duka keluarga, dan staf pun melakukan refleksi serta perawatan batin","Tidak perlu menyapa keluarga","Tidak memikirkan perasaan staf","Tidak meninggalkan catatan"]],"354":["Kasus: Bapak D (45 tahun, laki-laki) mengalami cedera tulang belakang (lumpuh tubuh bagian bawah) akibat kecelakaan lalu lintas dan memakai kursi roda. Ia tinggal sendiri di rumah dan memakai layanan kunjungan perawatan. Ia ingin kembali bekerja. Karena lama duduk, terlihat kemerahan di daerah sakrum. Manakah penanganan kemerahan di sakrum Bapak D yang tepat?",["Mengamati saja tanpa berbuat apa-apa","Melepas bantalan dan memakai alas duduk yang keras","Memintanya tetap pada posisi yang sama","Memijat kuat bagian yang merah","Memakai bantalan penyebar tekanan, lalu meredakan tekanan dengan push-up atau mengubah posisi"]],"355":["Kasus: Bapak D (45 tahun, laki-laki) mengalami cedera tulang belakang (lumpuh tubuh bagian bawah) akibat kecelakaan lalu lintas dan memakai kursi roda. Ia tinggal sendiri di rumah dan memakai layanan kunjungan perawatan. Ia ingin kembali bekerja. Karena lama duduk, terlihat kemerahan di daerah sakrum. Manakah penanganan terhadap keinginan Bapak D untuk kembali bekerja yang tepat?",["Tidak mendengar keinginannya dan menyarankan masuk panti","Mengatakan itu mustahil karena disabilitas","Menyuruhnya berkonsultasi hanya dengan keluarga","Tidak membicarakan soal pekerjaan","Menghormati keinginannya dan memberi informasi bekerja sama dengan spesialis konsultasi dukungan dan lembaga dukungan kerja"]],"356":["Kasus: Bapak D (45 tahun, laki-laki) mengalami cedera tulang belakang (lumpuh tubuh bagian bawah) akibat kecelakaan lalu lintas dan memakai kursi roda. Ia tinggal sendiri di rumah dan memakai layanan kunjungan perawatan. Ia ingin kembali bekerja. Karena lama duduk, terlihat kemerahan di daerah sakrum. Manakah bantuan berpindah ke kursi roda untuk Bapak D yang tepat?",["Dibantu sepenuhnya dengan tergesa-gesa","Menyerahkan sepenuhnya kepada yang bersangkutan","Tidak memasang rem dan bergerak cepat","Mengangkat tanpa memberi aba-aba","Memasang rem, membiarkan ia melakukan gerakan yang bisa, dan membantu bagian yang diperlukan"]],"358":["Manakah yang menjadi sasaran pembelian alat bantu kesejahteraan asuransi kaigo?",["Tempat tidur khusus","Alat pencegah luka tekan","Kloset duduk (腰掛便座)","Kursi roda","Alat bantu jalan"]],"359":["Manakah jenis sistem wali menurut hukum (法定後見制度) yang benar?",["Perlindungan, pendampingan, bantuan","Wali (後見), pendampingan (保佐), bantuan (補助)","Santunan, pendampingan, bantuan","Wali, nafkah, bantuan","Wali, pendampingan, sukarela"]],"360":["Manakah sasaran layanan perawatan bersama untuk penderita demensia (grup home) yang benar?",["Orang yang butuh perawatan tanpa demensia","Semua orang di bawah 65 tahun","Semua orang dengan 要支援 1 ke atas","Hanya orang dengan 要介護 3 ke atas","Orang dengan 要支援 2 ke atas yang didiagnosis demensia"]],"370":["Manakah pertimbangan saat membantu buang air yang tepat?",["Dilakukan di tempat yang terlihat dari lorong","Mengganti popok tanpa memastikan","Sama sekali tidak bicara sampai selesai","Memberi aba-aba dengan suara keras yang terdengar pengguna lain","Menutup tirai dan pintu, meminimalkan bagian tubuh yang terbuka, dan menyapa dengan wajar"]],"371":["Manakah gagasan penjelasan dan persetujuan (informed consent) yang tepat?",["Dilakukan hanya dengan persetujuan keluarga","Melaksanakan lebih dulu tanpa penjelasan","Menjelaskan secara rinci dengan istilah teknis","Selalu dilaksanakan meski tanpa persetujuan","Menjelaskan dengan mudah dipahami dan melaksanakan setelah mendapat persetujuan pengguna"]],"378":["Kasus: Bapak E (76 tahun, laki-laki) menderita demensia dengan badan Lewy dan tinggal di grup home. Pada malam hari ia cemas dan berkata, \"Ada orang asing berdiri di kamar.\" Siang hari ia tenang dan senang membantu memasak. Manakah respons yang paling tepat saat Bapak E mengatakan \"ada orang asing\"? Pilih satu.",["Mengatakan \"Hanya Anda yang melihatnya\"","Mengunci kamar dan membiarkannya sendiri","Meninggalkan kamar tanpa berkata apa-apa","Menyangkal keras, \"Tidak ada siapa-siapa\"","Tidak menyangkal, menerima rasa cemasnya, menyalakan lampu, dan memeriksa bersama"]],"379":["Kasus: Bapak E (76 tahun, laki-laki) menderita demensia dengan badan Lewy dan tinggal di grup home. Pada malam hari ia cemas dan berkata, \"Ada orang asing berdiri di kamar.\" Siang hari ia tenang dan senang membantu memasak. Manakah penataan lingkungan malam hari yang paling tepat? Pilih satu.",["Menutup semua tirai dan memutar musik","Membuat kamar gelap gulita pada malam hari","Menyingkirkan semua barang di kamar","Membiarkan pakaian tergantung di dinding","Mengatur pencahayaan dan penempatan barang agar bayangan di dinding atau pakaian tidak tampak seperti orang"]],"380":["Kasus: Bapak E (76 tahun, laki-laki) menderita demensia dengan badan Lewy dan tinggal di grup home. Pada malam hari ia cemas dan berkata, \"Ada orang asing berdiri di kamar.\" Siang hari ia tenang dan senang membantu memasak. Manakah sikap staf yang paling tepat saat ada perubahan gejala pada Bapak E? Pilih satu.",["Menyampaikannya hanya kepada keluarga","Mencatat kapan dan dalam situasi apa terjadi, lalu berkoordinasi dengan perawat atau dokter","Memperdengarkannya kepada pengguna lain untuk memastikan","Cukup lisan tanpa mencatat","Mengamati dengan penilaian sendiri saja"]],"381":["Kasus: Ibu F (52 tahun, perempuan) menderita artritis reumatoid dengan jari tangan berubah bentuk dan kaku di pagi hari. Ia tinggal bersama suami di rumah dan memakai layanan kunjungan perawatan. Ia ingin terus memasak sendiri. Manakah penanganan terhadap kekakuan pagi Ibu F yang paling tepat? Pilih satu.",["Mengabaikan kekakuan dan menyuruh mulai memasak","Menarik sendi dengan kuat untuk menggerakkan","Mendinginkan tangan dengan air dingin lalu menggerakkannya","Melakukan persiapan seperti menghangatkan sendi, lalu melakukan pekerjaan pada waktu yang mudah bergerak","Melarang semua aktivitas pagi"]],"382":["Kasus: Ibu F (52 tahun, perempuan) menderita artritis reumatoid dengan jari tangan berubah bentuk dan kaku di pagi hari. Ia tinggal bersama suami di rumah dan memakai layanan kunjungan perawatan. Ia ingin terus memasak sendiri. Manakah alat bantu agar Ibu F tetap bisa memasak yang paling tepat? Pilih satu.",["Alat bantu mandiri seperti pisau dan pengupas bergagang tebal yang mudah digenggam","Hanya panci besi yang berat","Hanya pisau yang tajam","Alat bergagang tipis dan licin","Mengambil semua alat masak"]],"383":["Kasus: Ibu F (52 tahun, perempuan) menderita artritis reumatoid dengan jari tangan berubah bentuk dan kaku di pagi hari. Ia tinggal bersama suami di rumah dan memakai layanan kunjungan perawatan. Ia ingin terus memasak sendiri. Manakah dukungan yang menghormati keinginan Ibu F yang paling tepat? Pilih satu.",["Menyerahkan sepenuhnya tanpa mengajarkan caranya","Menyuruh suami mengurus semua masakan","Demi keselamatan, semua memasak dilakukan staf","Tanpa mendengar keinginannya, hanya memakai layanan antar makanan","Memeriksa langkah memasak bersama dan membagi hanya bagian yang berat baginya"]],"397":["Manakah penjelasan burnout yang paling tepat? Pilih satu.",["Keadaan penuh semangat saat baru mulai bekerja","Rasa kantuk setelah giliran malam","Sekadar gejala flu","Cedera akibat kecelakaan mendadak","Keadaan orang yang dulu bekerja penuh semangat lalu kehilangan motivasi seperti terbakar habis"]],"405":["Manakah penjelasan polifarmasi yang paling tepat? Pilih satu.",["Keadaan minum obat hanya sekali sehari","Keadaan hanya minum obat yang sangat manjur","Keadaan tanpa efek samping obat sama sekali","Keadaan tidak minum obat sama sekali","Keadaan minum banyak obat sehingga risiko efek samping dan salah minum meningkat"]],"409":["Manakah dari pernyataan berikut yang paling tepat sebagai sudut pandang perlindungan hak (権利擁護)? Pilih satu.",["Staf saja yang mengelola uang","Memanfaatkan sistem dan mekanisme yang melindungi harta dan kehidupan orang yang kemampuan menilainya kurang","Keluarga memutuskan tanpa mendengar keinginan yang bersangkutan","Menghindari penggunaan sistem","Mengutamakan kepentingan panti"]],"410":["Manakah penjelasan dukungan pengambilan keputusan (意思決定支援) yang paling tepat? Pilih satu.",["Menunda keputusan","Staf memilih sendiri yang dianggap terbaik","Menyiapkan informasi dan lingkungan agar orang yang sulit menyatakan kehendak dapat memutuskan sendiri","Memutuskan hanya dengan pendapat keluarga","Melaksanakan tanpa menjelaskan kepada yang bersangkutan"]],"411":["Manakah dukungan berpusat pada pengguna yang paling tepat saat memilih pakaian? Pilih satu.",["Karena ia bingung, tidak menunjukkan pilihan","Menunjukkan beberapa pakaian dan membiarkan ia memilih, \"Yang mana?\"","Keluarga memilih tanpa bertanya","Memilih hanya karena mudah dipakai dan dilepas","Staf menentukan pakaian yang sama setiap hari"]],"417":["Manakah penanganan terhadap pengguna yang sering menumpahkan makanan yang paling tepat? Pilih satu.",["Menegur dan menghentikan makannya","Beralih ke bantuan makan penuh","Melarang makan","Menyuruh makan di ruangan terpisah dari yang lain","Tidak menyalahkan tumpahan, dan menyesuaikan alat makan serta lingkungan agar mudah makan"]],"420":["Manakah cara memotong kuku yang paling tepat? Pilih satu.",["Memotong pendek tanpa memperhatikan bentuk kuku","Memotong beserta kulit di sekitar kuku","Tidak memakai gunting kuku, melainkan gunting biasa","Menghindari terlalu pendek, menyisakan sedikit bagian putih di ujung","Memotong dalam hingga mepet kulit"]],"421":["Manakah ciri tongkat empat kaki yang paling tepat? Pilih satu.",["Ringan tetapi tidak stabil","Paling cocok untuk naik turun tangga","Bidang pijaknya luas dan lebih stabil daripada tongkat T","Tidak bisa dipakai orang yang tidak punya kekuatan genggam","Dipakai satu tangan sehingga sulit dioperasikan"]],"424":["Manakah posisi menaruh toilet portabel yang paling tepat? Pilih satu.",["Dekat sisi yang sehat dan mudah untuk berpindah","Di tempat yang gelap di bawah kaki","Dengan ketinggian yang sulit untuk berdiri","Jauh dari tempat tidur","Di sudut jauh dari sisi yang lumpuh"]],"429":["Manakah sepatu yang mudah dipakai berjalan yang paling tepat? Pilih satu.",["Sandal tanpa tumit","Sepatu hak tinggi","Sepatu berukuran besar yang mudah lepas","Sepatu yang membungkus tumit dan alasnya tidak licin","Sepatu bersol tipis dan licin"]],"430":["Manakah pemeriksaan sebelum memakai kursi roda yang paling tepat? Pilih satu.",["Hanya memeriksa tampilannya","Memeriksa setelah pengguna didudukkan","Pemeriksaan cukup setahun sekali","Memeriksa rem, tekanan udara ban, dan sandaran kaki","Tidak memeriksa udara ban"]],"431":["Manakah dari berikut ini yang pada prinsipnya bukan tindakan medis (医行為)? Pilih satu.",["Mengukur suhu dengan termometer","Perawatan luka tekan","Pengeluaran feses dengan tangan (摘便)","Infus","Suntik insulin"]],"433":["Manakah ciri pengaturan suhu tubuh lansia yang paling tepat? Pilih satu.",["Suhu tubuh selalu tetap","Sangat merasakan dingin","Sulit menyadari panas dan dingin sehingga pengaturan suhu mudah menurun","Banyak berkeringat","Sangat peka terhadap panas"]],"434":["Manakah ciri tidur REM yang paling tepat? Pilih satu.",["Tidur paling dalam","Tidur saat suhu tubuh turun paling rendah","Bola mata bergerak dan mudah bermimpi","Meningkat saat usia lanjut","Bola mata sama sekali tidak bergerak"]],"437":["Manakah mekanisme yang mencegah makanan masuk ke saluran napas saat menelan yang paling tepat? Pilih satu.",["Pita suara terbuka lebar","Epiglotis (喉頭蓋) menutup pintu masuk trakea","Lidah jatuh ke dalam trakea","Langit-langit lunak menutup trakea","Kerongkongan menutup"]],"438":["Manakah fungsi air liur yang paling tepat? Pilih satu.",["Membekukan makanan","Menaikkan denyut jantung","Mencerna lemak","Menurunkan tekanan darah","Membantu mencerna makanan dan menjaga mulut tetap bersih"]],"439":["Manakah perubahan tekanan darah akibat penuaan yang paling tepat? Pilih satu.",["Beban jantung berkurang","Tekanan darah tidak berubah","Tekanan darah pasti menjadi rendah","Arteri menjadi lunak","Pengerasan arteri berlanjut sehingga tekanan sistolik mudah naik"]],"455":["Manakah sasaran tunjangan pencegahan (予防給付) yang benar? Pilih satu.",["Orang dengan 要支援 1 dan 2","Semua orang berusia 65 tahun ke atas","Orang dengan 要介護 1 sampai 5","Orang yang belum menerima penetapan perawatan","Orang di bawah 40 tahun"]],"458":["Manakah cara memakai lembar geser (スライディングシート) yang paling tepat? Pilih satu.",["Dibiarkan terhampar di dudukan kursi roda","Mengurangi gesekan agar perpindahan dan perubahan posisi di tempat tidur lebih mudah","Dipakai untuk mengangkat dan membawa pengguna","Dihamparkan di dekat kaki untuk mencegah jatuh","Membaringkan di atas lembar dalam waktu lama"]],"459":["Manakah hal yang perlu diperhatikan saat menyajikan makanan penyesuaian menelan (嚥下調整食) yang paling tepat? Pilih satu.",["Menyesuaikan bentuk makanan dengan kemampuan menelan yang bersangkutan","Tidak berkonsultasi soal bentuk makanan","Tampilan tidak perlu diperhatikan","Cukup menghindari yang keras","Menyajikan bentuk yang sama untuk semua orang"]],"489":["Manakah prinsip tindakan medis (医行為) yang paling tepat? Pilih satu.",["Tindakan medis boleh dilakukan siapa saja","Pekerja perawatan bersertifikat boleh melakukan semua tindakan medis","Penyedotan dahak boleh dilakukan tanpa kualifikasi","Keluarga tidak boleh melakukan apa pun","Pada prinsipnya dilakukan dokter atau perawat, dan pekerja perawatan bersertifikat dapat melakukan penyedotan dahak dan sejenisnya dalam kondisi tertentu"]],"501":["Manakah contoh penelantaran perawatan (ネグレクト) yang paling tepat? Pilih satu.",["Pergi ke toilet atas kehendak sendiri","Mengawasi secara berkala","Membantu sambil memberi aba-aba","Menyajikan makanan sesuai permintaan pengguna","Tidak membantu makan atau buang air yang diperlukan dalam waktu lama"]],"520":["Manakah cara menaikkan kursi roda melewati undakan yang paling tepat? Pilih satu.",["Mendorong tanpa mengangkat roda depan","Maju dengan cepat untuk melewati undakan","Meminta pengguna berdiri","Mengangkat roda belakang","Menginjak tuas penyeimbang (テ i perawatan 4. Ia pernah mengalami pneumonia aspirasi. Belakangan ia lebih sering tersedak saat makan atau minum, makan makin lama, dan suaranya serak setelah makan. Manakah posisi Ibu B saat makan yang tepat?", ["Posisi tubuh merosot ke depan di kursi roda", "Duduk dengan kaki menggantung", "Posisi hampir telentang", "Duduk di kursi, dagu sedikit ditarik, telapak kaki menapak lantai", "Posisi dagu terangkat"]], "349": ["Kasus: Ibu B (85 tahun, perempuan) tinggal di panti lansia khusus (特別養護老人ホーム), kategori perawatan 4. Ia pernah mengalami pneumonia aspirasi. Belakangan ia lebih sering tersedak saat makan atau minum, makan makin lama, dan suaranya serak setelah makan. Manakah tanggapan yang paling tepat terhadap suara yang menjadi serak setelah makan?", ["Memberi lebih banyak makanan agar tenggorokan bersih", "Tidak mencatat dan hanya memberi tahu keluarga", "Karena kemungkinan makanan atau air liur tertinggal di tenggorokan, melapor kepada perawat dan mengamati", "Menganggapnya sifat pribadi", "Mengamati saja tanpa berbuat apa-apa"]], "350": ["Kasus: Ibu B (85 tahun, perempuan) tinggal di panti lansia khusus (特別養護老人ホーム), kategori perawatan 4. Ia pernah mengalami pneumonia aspirasi. Belakangan ia lebih sering tersedak saat makan atau minum, makan makin lama, dan suaranya serak setelah makan. Manakah penanganan setelah makan yang tepat?", ["Membiarkan beristirahat sendirian di kamar setelah makan", "Membaringkan segera setelah makan", "Hanya membatasi cairan", "Melakukan perawatan mulut dan membiarkan duduk sekitar 30 menit", "Perawatan mulut hanya di malam hari"]]});

Object.assign(TRS,{"413": ["Manakah yang termasuk pengekangan fisik? Pilih satu.", ["Mengelilingi tempat tidur dengan pagar di empat sisi agar tidak bisa turun sendiri", "Mengawasi saat berjalan agar tidak jatuh", "Memanggil dan memastikan gerakan", "Berjalan-jalan bersama pengguna", "Merapikan lantai dengan mengurangi selisih tinggi"]], "268": ["Keluarga memakai pensiun pengguna untuk biaya hidup tanpa persetujuannya. Termasuk jenis penganiayaan apa?", ["Penelantaran perawatan", "Penganiayaan ekonomi", "Penganiayaan seksual", "Penganiayaan psikologis", "Penganiayaan fisik"]], "414": ["Manakah perawatan yang memanfaatkan 'hal yang bisa dilakukan' pengguna? Pilih satu.", ["Mendorong pengguna melakukan gerakan sendiri dengan arahan dan pengawasan", "Menentukan peran sesuai kepentingan staf", "Melarang meski bisa dilakukan karena berbahaya", "Tidak memeriksa kemampuan pengguna", "Membantu semuanya agar tidak memakan waktu"]], "502": ["Manakah cara pandang dukungan kemandirian yang paling tepat? Pilih satu.", ["Menentukan jadwal harian sesuai kepentingan staf", "Menentukan dukungan hanya berdasarkan harapan keluarga", "Melakukan semua hal menggantikan pengguna", "Membatasi kegiatan karena berbahaya", "Menutupi hal yang tidak bisa dilakukan dan mendukung pengguna hidup sesuai dirinya"]], "267": ["Manakah yang TIDAK termasuk kewajiban介護福祉士?", ["Kewajiban menjaga rahasia", "Kewajiban menyimpan dan mengelola harta pengguna", "Kewajiban tidak merusak kepercayaan", "Tanggung jawab meningkatkan kemampuan", "Kewajiban bekerja dengan jujur"]], "412": ["Menurut undang-undang介護福祉士, apa yang dituntut dari介護福祉士? Pilih satu yang benar.", ["Menyimpan harta pengguna", "Mengikuti ujian pembaruan lisensi", "Memutuskan sendiri tanpa bekerja sama dengan profesi lain", "Menjaga kerja sama dengan pihak layanan kesejahteraan dan kesehatan", "Melakukan semua tindakan medis tanpa instruksi dokter"]], "395": ["Manakah penjelasan kesadaran diri (自己覚知) yang paling tepat? Pilih satu.", ["Menilai st ","Berbicara seperti kepada anak kecil"]],"36":["Manakah yang tidak termasuk komponen ICF (Klasifikasi Fungsi Internasional)?",["Aktivitas","Partisipasi","Faktor lingkungan","Faktor personal","Tingkat keparahan penyakit"]],"37":["Manakah penjelasan disartria yang tepat?",["Tidak memahami arti kata","Paham kata tetapi pelafalan tidak jelas","Tidak bisa menulis","Tidak tahu cara memakai benda","Ingatan hilang"]],"38":["Manakah cara menjelaskan yang tepat kepada penyandang disabilitas intelektual?",["Menjelaskan sekaligus dengan kalimat panjang","Menyampaikan dengan kata pendek dan mudah, secara konkret","Memakai istilah teknis agar akurat","Melewati yang bersangkutan dan menjelaskan hanya kepada keluarga","Mendesak agar cepat menjawab"]],"59":["Manakah dasar pencegahan infeksi yang tepat?",["Jika memakai sarung tangan sekali pakai, tidak perlu cuci tangan","Membersihkan tangan sebelum dan sesudah perawatan","Memakai sarung tangan yang sama untuk beberapa pengguna","Menangani muntahan dengan tangan kosong","Memakai masker di bawah dagu"]],"60":["Pengguna batuk saat nutrisi lewat lubang lambung sedang diberikan. Manakah tindakan yang tepat?",["Tetap melanjutkan pemberian","Segera hentikan pemberian dan hubungi perawat","Mempercepat pemberian","Membaringkan miring lalu melanjutkan","Hanya mengamati tanpa berbuat apa-apa"]],"61":["Manakah dukungan yang tepat bagi orang yang memakai tongkat putih?",["Tiba-tiba memegang lengannya dari belakang","Menyapa dan menanyakan apakah perlu dibantu","Mengambil tongkat putihnya lalu menuntun","Menuntun sambil berlari","Mendorongnya maju tanpa bicara"]],"62":["Manakah yang benar tentang penerbitan kartu penyandang disabilitas fisik?",["Diterbitkan menteri kesehatan, tenaga kerja, dan kesejahteraan","Diterbitkan gubernur provinsi dan sejenisnya","Diterbitkan manajer penyedia layanan","Diterbitkan komisaris kesejahteraan","Diterbitkan kepala kantor polisi"]],"73":["Manakah ciri demensia vaskular yang tepat?",["Gejala memburuk bertahap at nstruksi","Kecepatan diubah sesuai penilaian staf","Setelah dibuka dipakai berhari-hari","Posisi tubuh tidak perlu diperhatikan"]],"92":["Apa yang dilakukan sebelum penyedotan dahak?",["Menyiapkan diri seperti mencuci tangan, menjelaskan kepada pengguna, dan memperoleh persetujuan","Langsung menyedot tanpa menjelaskan","Melakukannya tanpa sarung tangan","Mengatur tekanan isap maksimum","Tidak memeriksa apa pun setelah menyedot"]],"106":["Manakah yang tidak termasuk empat pilar Humanitude?",["Melihat","Berbicara","Menyentuh","Berdiri","Menegur dengan marah"]],"107":["Manakah penjelasan paraplegia yang tepat?",["Kelumpuhan kedua tungkai","Kelumpuhan lengan dan tungkai satu sisi","Kelumpuhan keempat anggota gerak","Kelumpuhan wajah saja","Kelumpuhan lengan saja"]],"109":["Kulit di sekitar lubang selang lambung tampak merah atau bocor. Manakah tindakan yang tepat?",["Mengamati dan melapor ke perawat","Mencabut selang atas keputusan sendiri","Membiarkannya","Menggosok kuat saat menyeka","Menambah jumlah cairan"]],"117":["Manakah yang tidak termasuk cara berkomunikasi dengan penyandang tuli?",["Bahasa isyarat","Menulis","Membaca gerak bibir","Ejaan jari","Huruf Braille"]],"118":["Manakah yang termasuk disabilitas organ dalam?",["Gangguan fungsi jantung","Disabilitas penglihatan","Disabilitas pendengaran","Gangguan gerak anggota badan","Gangguan fungsi suara"]],"119":["Manakah gejala yang sering muncul pada skizofrenia?",["Halusinasi dan waham","Otot mengecil","Hanya gangguan ingatan","Afasia","Kelumpuhan"]],"123":["Apa yang diamati setelah penyedotan dahak?",["Kondisi napas, warna wajah, serta jumlah dan sifat dahak","Warna pakaian","Posisi perabot kamar","Selera makan","Model rambut"]],"124":["Apa yang dipastikan sebelum memulai nutrisi lewat selang?",["Kondisi tubuh dan posisi pengguna, serta isi dan jumlah cairan nutrisi sesuai instruksi","Warna kesukaan pengguna","Jam kerja staf","Cuaca hari sebelumnya","Jumlah pengunjung"]],"181":["Gejala mana yang membuat orang lupa n pendengaran karena usia?",["Tuli sensorineural","Tuli konduktif","Tuli campuran","Tuli fungsional","Tuli mendadak"]],"190":["Manakah gejala gangguan fungsi otak tingkat tinggi yang tepat?",["Gangguan ingatan dan perhatian","Otot mengecil","Gula darah naik","Hanya penglihatan menurun","Tulang berubah bentuk"]],"191":["Manakah sikap yang tepat terhadap orang yang sedang depresi?",["Menghindari menyuruh “semangat” dan menerima perasaannya","Menyemangati dengan keras agar beraktivitas","Meninggalkannya sendiri tanpa bicara","Menghentikan semua hobinya","Mendesaknya mengambil keputusan besar"]],"192":["Manakah yang termasuk jaminan kemandirian menurut UU dukungan disabilitas?",["Jaminan perawatan dan jaminan pelatihan","Pembayaran pensiun","Jaminan asuransi kesehatan","Jaminan bantuan hidup","Pinjaman beasiswa"]],"193":["Manakah ciri ADHD yang tepat?",["Kurang perhatian, hiperaktif, impulsif","Hanya kebiasaan yang kaku","Halusinasi dan waham sebagai inti","Gangguan ingatan sebagai inti","Kelumpuhan gerak sebagai inti"]],"194":["Manakah gejala utama penyakit Parkinson yang tepat?",["Gemetar saat istirahat, otot kaku, gerak lambat","Kelumpuhan mendadak","Hanya gangguan ingatan yang memburuk","Demam tinggi","Ruam kulit"]],"195":["Apa yang mudah terjadi jika kecepatan nutrisi selang terlalu cepat?",["Diare dan muntah","Sembelit","Kulit kering","Penglihatan menurun","Rambut rontok"]],"196":["Manakah cara merawat selang lambung setelah pemberian selesai?",["Memberi air hangat untuk membilas bagian dalam selang","Membiarkan selang begitu saja","Mengisi selang dengan cuka","Mengisi selang dengan teh","Membereskan tanpa berbuat apa-apa"]],"197":["Manakah cara yang tepat saat memasukkan selang penyedot?",["Masukkan tanpa tekanan isap, lalu isap sambil menarik keluar","Masukkan sambil menekan isap","Masukkan dengan tekanan isap maksimum","Mendorong selang berkali-kali","Memasukkan sedalam mungkin sekaligus"]],"198":["Wajah pengguna memucat saat penyedotan dahak. Manakah tindakan
